name: Fetch Conference Subtitles

on:
  workflow_dispatch:

jobs:
  fetch-subtitles:
    name: Fetch subtitles from GitHub
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '18.x'

      - name: Install dependencies
        run: npm install
        working-directory: .
        continue-on-error: true

      - name: Fetch subtitles
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node confs/2026/videos/fetch-subtitles.js
