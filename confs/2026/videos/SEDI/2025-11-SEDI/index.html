<!DOCTYPE html>
<html lang="en">
<!-- Video gallery template: copy this file + site.json into a folder. Shared assets stay in /confs/2026/videos/. -->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,600;0,700;0,800;1,600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.plyr.io/3.8.4/plyr.css">
    <link rel="stylesheet" href="/confs/2026/videos/gallery.css">
</head>

<body>
    <header id="galleryHeader"></header>

    <section class="promo-section" id="promoSection" hidden aria-label="Promo video">
        <h2 class="promo-title" id="promoTitle" hidden></h2>
        <div class="promo-player" id="promoPlayer"></div>
    </section>

    <section class="top-clips-section" id="topClipsSection" hidden aria-label="Top clips">
        <div class="top-clips-header">
            <h2 id="topClipsTitle">Top Clips</h2>
            <span class="top-clips-sub" id="topClipsSubtitle"></span>
        </div>
        <ol class="top-clips-row" id="topClipsRow" aria-label="Top clips"></ol>
    </section>

    <section class="search-section" aria-label="Search transcripts">
        <label for="transcriptSearch" id="searchLabel">Search all transcripts</label>
        <div class="search-wrapper">
            <input type="search" id="transcriptSearch" placeholder="Type to search…" autocomplete="off"
                spellcheck="false">
            <button id="searchToggleAll" type="button" aria-label="Toggle all results"
                title="Collapse/expand all result groups">Toggle All</button>
            <button id="searchClear" type="button" aria-label="Clear search">Clear</button>
        </div>
        <p id="searchStatus" aria-live="polite"></p>
        <div id="searchResults" role="list" aria-label="Search results"></div>
    </section>

    <button id="toggleAllVideos" type="button" aria-label="Toggle condensed view"
        title="Toggle condensed view for all videos">Condensed View</button>

    <main class="video-container" id="videoContainer">
        <!-- Video cards generated by gallery.js from site.json -->
    </main>

    <footer id="galleryFooter"></footer>

    <script src="https://cdn.plyr.io/3.8.4/plyr.polyfilled.js"></script>
    <script>
        // Optional: window.GALLERY_CONFIG = 'site.json';
    </script>
    <script src="/confs/2026/videos/gallery.js?v=2026-09-02"></script>
</body>

</html>
