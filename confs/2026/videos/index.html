            transition: transform 0.25s;
            font-style: normal;
        }

        .transcript-toggle[aria-expanded="true"] .arrow {
            transform: rotate(90deg);
        }

        // ─────────────────────────────────────────────────────────────────────
        //  Utilities
        // ─────────────────────────────────────────────────────────────────────
        function srtTimeToSeconds(hms, ms) {
            const [h, m, s] = hms.split(':').map(Number);
            return h * 3600 + m * 60 + s + Number(ms) / 1000;
        }

        function formatTime(totalSec) {
            const h = Math.floor(totalSec / 3600);
            const m = Math.floor((totalSec % 3600) / 60);
            const s = Math.floor(totalSec % 60);
            return h > 0
                ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`
                : `${m}:${String(s).padStart(2,'0')}`;
        }

        function escHtml(str) {
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function escRe(str) {
            return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        function highlightMatch(text, query) {
            if (!query) return escHtml(text);
            const re = new RegExp(`(${escRe(query)})`, 'gi');
            return escHtml(text).replace(re, '<mark>$1</mark>');
        }

        // ─────────────────────────────────────────────────────────────────────
        //  SRT parser → array of { start, end, startLabel, text }
        // ─────────────────────────────────────────────────────────────────────
        function parseSrt(raw) {
            const cues = [];
            const normalized = raw.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
            const blocks = normalized.split(/\n{2,}/);
            const timePat = /(\d{2}:\d{2}:\d{2})[,.](\d{3})\s*-->\s*(\d{2}:\d{2}:\d{2})[,.](\d{3})/;

            for (const block of blocks) {
                const lines = block.trim().split('\n');
                if (lines.length < 2) continue;
                let timeLine = -1;
                for (let i = 0; i < lines.length; i++) {
                    if (timePat.test(lines[i])) { timeLine = i; break; }
                }
                if (timeLine === -1) continue;
                const m = lines[timeLine].match(timePat);
                if (!m) continue;
                const startSec = srtTimeToSeconds(m[1], m[2]);
                const cueText  = lines.slice(timeLine + 1).join(' ').trim();
                if (!cueText) continue;
                cues.push({
                    start: startSec,
                    end: srtTimeToSeconds(m[3], m[4]),
                    startLabel: formatTime(startSec),
                    text: cueText
                });
            }
            return cues;
        }

        // ─────────────────────────────────────────────────────────────────────
        //  In-memory transcript store  path → { status, cues, rawText }
        //  status: 'loading' | 'ready' | 'error'
        // ─────────────────────────────────────────────────────────────────────
        const transcriptStore  = {};
        const videoElementMap  = {};   // path → <video> element

        function pauseAllVideos(exceptVideo) {
            for (const key in videoElementMap) {
                const otherVideo = videoElementMap[key];
                if (otherVideo && otherVideo !== exceptVideo && !otherVideo.paused) {
                    otherVideo.pause();
                }
            }
        }

        function loadTranscript(video) {
            const id = video.path;
            if (transcriptStore[id]) return Promise.resolve(transcriptStore[id]);
            transcriptStore[id] = { status: 'loading', cues: [], rawText: '' };

            const url = `subtitle-proxy.php?url=${encodeURIComponent(video.subtitle)}`;
            return fetch(url)
                .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.text(); })
                .then(raw => {
                    transcriptStore[id].rawText = raw;
                    transcriptStore[id].cues    = parseSrt(raw);
                    transcriptStore[id].status  = 'ready';
                    return transcriptStore[id];
                })
                .catch(() => {
                    transcriptStore[id].status = 'error';
                    return transcriptStore[id];
                });
        }

        function attachVttTrack(videoEl, rawSrt) {
            // Avoid adding duplicate tracks
            if (videoEl.querySelector('track[srclang="en"]')) return;
            const vtt = 'WEBVTT\n\n' + rawSrt
                .replace(/\r\n/g, '\n').replace(/\r/g, '\n')
                .replace(/(\d{2}:\d{2}:\d{2}),(\d{3})/g, '$1.$2');
            const blob   = new Blob([vtt], { type: 'text/vtt' });
            const blobUrl = URL.createObjectURL(blob);
            const track  = document.createElement('track');
            track.kind    = 'subtitles';
            track.srclang = 'en';
            track.label   = 'English';
            track.default = true;
            track.src     = blobUrl;
            track.addEventListener('load',  () => URL.revokeObjectURL(blobUrl), { once: true });
            track.addEventListener('error', () => URL.revokeObjectURL(blobUrl), { once: true });
            videoEl.appendChild(track);
        }

        // ─────────────────────────────────────────────────────────────────────
        //  Cue line element (shared by accordion and search results)
        // ─────────────────────────────────────────────────────────────────────
        function makeCueLine(cue, videoPath, highlightQuery) {
            const div = document.createElement('div');
            div.className = 'cue-line';
            div.setAttribute('role', 'listitem');
            div.setAttribute('tabindex', '0');
            div.title = `Jump to ${cue.startLabel}`;

            const timeSpan = document.createElement('span');
            timeSpan.className   = 'cue-time';
            timeSpan.textContent = cue.startLabel;

            const textSpan = document.createElement('span');
            textSpan.className = 'cue-text';
            if (highlightQuery) {
                textSpan.innerHTML = highlightMatch(cue.text, highlightQuery);
            } else {
                textSpan.textContent = cue.text;
            }

            div.appendChild(timeSpan);
            div.appendChild(textSpan);

            const seek = () => {
                const videoEl = videoElementMap[videoPath];
                if (!videoEl) return;
                videoEl.currentTime = cue.start;
                videoEl.play();
                videoEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
            };
            div.addEventListener('click', seek);
            div.addEventListener('keydown', e => {
                if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); seek(); }
            });
            return div;
        }

        // ─────────────────────────────────────────────────────────────────────
        //  Build a video card
        // ─────────────────────────────────────────────────────────────────────
        function createVideoCard(video) {
            const card = document.createElement('article');
            card.className = 'video-card';

            // ── video player ──
            const thumbDiv = document.createElement('div');
            thumbDiv.className = 'video-thumbnail';

            const videoEl = document.createElement('video');
            videoEl.controls = true;
            videoEl.poster   = '/wp-content/uploads/2026/02/FullLogo@3x.png';
            videoEl.preload  = 'none';
            videoEl.playsInline  =  "true" ;

            const source = document.createElement('source');
            source.src  = video.path;
            source.type = 'video/mp4';
            videoEl.appendChild(source);
            thumbDiv.appendChild(videoEl);
            card.appendChild(thumbDiv);

            videoElementMap[video.path] = videoEl;
            videoCardMap.set(video.path, card);
            videoEl.addEventListener('play', () => pauseAllVideos(videoEl));

            // ── info ──
            const infoDiv = document.createElement('div');
            infoDiv.className = 'video-info';

            const titleEl = document.createElement('h3');
            titleEl.className   = 'video-title';
            titleEl.textContent = video.title;
            infoDiv.appendChild(titleEl);

            const metaDiv = document.createElement('div');
            metaDiv.className = 'video-meta';
            const durSpan = document.createElement('span');
            durSpan.className   = 'video-duration';
            durSpan.textContent = video.duration;
            metaDiv.appendChild(durSpan);
            infoDiv.appendChild(metaDiv);
            card.appendChild(infoDiv);

            // ── transcript accordion ──
            if (video.subtitle) {
                const safeId = CSS.escape(video.path.replace(/\W/g, '_'));
                const panelId = `transcript-${safeId}`;

                const toggleBtn = document.createElement('button');
                toggleBtn.className = 'transcript-toggle';
                toggleBtn.setAttribute('aria-expanded', 'false');
                toggleBtn.setAttribute('aria-controls', panelId);
                toggleBtn.innerHTML = '<span class="arrow" aria-hidden="true">▶</span> Transcript';

                const panel = document.createElement('div');
                panel.className = 'transcript-panel';
                panel.id = panelId;
                panel.setAttribute('role', 'region');
                panel.setAttribute('aria-label', `Transcript — ${video.title}`);

                const body = document.createElement('div');
                body.className = 'transcript-body';
                body.setAttribute('role', 'list');
                panel.appendChild(body);

                let transcriptLoaded = false;

                toggleBtn.addEventListener('click', () => {
                    const expanded = toggleBtn.getAttribute('aria-expanded') === 'true';
                    toggleBtn.setAttribute('aria-expanded', String(!expanded));
                    panel.classList.toggle('open', !expanded);

                    if (!transcriptLoaded && !expanded) {
                        transcriptLoaded = true;
                        body.innerHTML = '<p class="transcript-loading">Loading transcript…</p>';

                        loadTranscript(video).then(store => {
                            // Attach VTT to video element
                            if (store.rawText) attachVttTrack(videoEl, store.rawText);

                            body.innerHTML = '';
                            if (store.status === 'error' || !store.cues.length) {
                                body.innerHTML = '<p class="transcript-loading">Transcript unavailable.</p>';
                                return;
                            }
                            const frag = document.createDocumentFragment();
                            store.cues.forEach(cue =>
                                frag.appendChild(makeCueLine(cue, video.path, ''))
                            );
                            body.appendChild(frag);
                        });
                    }
                });

                card.appendChild(toggleBtn);
                card.appendChild(panel);
            }

            return card;
        }

        // ─────────────────────────────────────────────────────────────────────
        //  Render day sections
        // ─────────────────────────────────────────────────────────────────────
        const container = document.getElementById('videoContainer');
        const videoCardMap = new Map();

        const sorted = [...videos].sort((a, b) =>
            a.day !== b.day
                ? a.day.localeCompare(b.day)
                : (a.order || 0) - (b.order || 0)
        );

        const dayGroups = sorted.reduce((acc, v) => {
            (acc[v.day] = acc[v.day] || []).push(v);
            return acc;
        }, {});

        ['KERICONF26 Day 1', 'KERICONF26 Day 2'].forEach(day => {
            if (!dayGroups[day]) return;
            const section = document.createElement('section');
            section.className = 'day-section';
            const h2 = document.createElement('h2');
            h2.textContent = day;
            section.appendChild(h2);
            const grid = document.createElement('div');
            grid.className = 'video-grid';
            dayGroups[day].forEach(v => grid.appendChild(createVideoCard(v)));
            section.appendChild(grid);
            container.appendChild(section);
        });

        // ─────────────────────────────────────────────────────────────────────
        //  Background preload — staggered, so search works as soon as possible
        // ─────────────────────────────────────────────────────────────────────
        let preloadIdx = 0;
        function preloadNext() {
            if (preloadIdx >= videos.length) return;
            const v = videos[preloadIdx++];
            if (!v.subtitle) { setTimeout(preloadNext, 50); return; }
            loadTranscript(v).then(store => {
                // Eagerly attach VTT to all videos so captions are ready on play
                if (store.rawText && videoElementMap[v.path]) {
                    attachVttTrack(videoElementMap[v.path], store.rawText);
                }
                // Re-run active search so results accumulate as transcripts load,
                // making results independent of how fast the user typed.
                const q = searchInput.value.trim();
                if (q.length >= 2) runSearch(q);
                setTimeout(preloadNext, 350);
            });
        }
        setTimeout(preloadNext, 1800);  // let the page paint first

        // ─────────────────────────────────────────────────────────────────────
        //  Throttled cross-video search
        // ─────────────────────────────────────────────────────────────────────
        const searchInput   = document.getElementById('transcriptSearch');
        const searchStatus  = document.getElementById('searchStatus');
        const searchResults = document.getElementById('searchResults');
        const searchClear   = document.getElementById('searchClear');

        const MAX_RESULTS    = 80;
        const subtitledCount = videos.filter(v => v.subtitle).length;

        function updateVideoCardDimState(activePaths) {
            for (const video of videos) {
                const card = videoCardMap.get(video.path);
                if (!card) continue;
                if (activePaths && activePaths.has(video.path)) {
                    card.classList.remove('dimmed');
                } else {
                    card.classList.add('dimmed');
                }
            }
        }

        function runSearch(query) {
            searchResults.innerHTML = '';
            if (!query || query.length < 2) {
                searchStatus.textContent = query.length === 1 ? 'Type at least 2 characters…' : '';
                updateVideoCardDimState(null);
                return;
            }

            const q = query.toLowerCase();
            const matches = [];

            for (const video of videos) {
                if (!video.subtitle) continue;
                const store = transcriptStore[video.path];
                if (!store || store.status !== 'ready') continue;
                for (const cue of store.cues) {
                    if (cue.text.toLowerCase().includes(q)) {
                        matches.push({ video, cue });
                        if (matches.length >= MAX_RESULTS) break;
                    }
                }
                if (matches.length >= MAX_RESULTS) break;
            }

            const loadedCount = videos.filter(v => {
                const s = transcriptStore[v.path];
                return s && s.status === 'ready';
            }).length;

            const loadedNote = loadedCount < subtitledCount
                ? ` (${loadedCount}/${subtitledCount} transcripts loaded — results grow as they load)`
                : '';

            if (!matches.length) {
                searchStatus.textContent = `No results for "${query}"${loadedNote}`;
                updateVideoCardDimState(new Set());
                return;
            }

            const activePaths = new Set(matches.map(({ video }) => video.path));
            updateVideoCardDimState(activePaths);

            const truncated = matches.length >= MAX_RESULTS;
            searchStatus.textContent =
                `${truncated ? MAX_RESULTS + '+' : matches.length} result${matches.length !== 1 ? 's' : ''}${loadedNote}`;

            const frag = document.createDocumentFragment();
            for (const { video, cue } of matches) {
                const item = document.createElement('div');
                item.className = 'search-result';
                item.setAttribute('role', 'listitem');
                item.setAttribute('tabindex', '0');
                item.title = `Jump to ${cue.startLabel} in "${video.title}"`;

                const titleEl = document.createElement('div');
                titleEl.className   = 'search-result-title';
                titleEl.textContent = video.title;

                const timeEl = document.createElement('span');
                timeEl.className   = 'search-result-time';
                timeEl.textContent = cue.startLabel;

                const textEl = document.createElement('div');
                textEl.className = 'search-result-text';
                textEl.innerHTML  = highlightMatch(cue.text, query);

                item.appendChild(titleEl);
                item.appendChild(timeEl);
                item.appendChild(textEl);

                const seek = () => {
                    const videoEl = videoElementMap[video.path];
                    if (!videoEl) return;
                    videoEl.currentTime = cue.start;
                    videoEl.play();
                    videoEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                };
                item.addEventListener('click', seek);
                item.addEventListener('keydown', e => {
                    if (e.key === 'Enter') { e.preventDefault(); seek(); }
                });

                frag.appendChild(item);
            }
            searchResults.appendChild(frag);
        }

        let searchTimer = null;
        searchInput.addEventListener('input', () => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => runSearch(searchInput.value.trim()), 300);
        });

        searchClear.addEventListener('click', () => {
            searchInput.value = '';
            searchResults.innerHTML = '';
            searchStatus.textContent = '';
            updateVideoCardDimState(null);
            searchInput.focus();
        });
    </script>
