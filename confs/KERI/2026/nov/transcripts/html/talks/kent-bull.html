<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kent Bull — Transcript</title>
  <meta name="description" content="Transcript: Kent Bull (Mini Conference nov 2026 · 0:17)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #060b6f;
      --muted: #2e3a7a;
      --bg: #fdefde;
      --panel: #f4f0e8;
      --accent: #986c32;
      --link: #0450a8;
      --waves: url("/custom/img/waves-kim-1.png");
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Source Serif 4", Georgia, serif;
      background: var(--bg);
      color: var(--ink);
      padding: 24px 16px 48px;
      line-height: 1.55;
    }
    .wrap { max-width: 44rem; margin: 0 auto; }
    nav {
      font-family: "Plus Jakarta Sans", "Segoe UI", sans-serif;
      font-size: 0.9rem;
      margin-bottom: 1.25rem;
    }
    nav a { color: var(--link); }
    nav a:hover { color: var(--ink); }
    header {
      position: relative;
      z-index: 0;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid color-mix(in srgb, var(--ink) 12%, transparent);
      border-radius: 10px;
      padding: 1.25rem 1.4rem;
      margin-bottom: 1.5rem;
    }
    header > * { position: relative; z-index: 1; }
    header::after {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      width: 360px;
      height: 208px;
      background-image: var(--waves);
      background-repeat: no-repeat;
      background-position: left top;
      background-size: 360px 208px;
      transform: rotate(180deg);
      pointer-events: none;
      z-index: 0;
      opacity: 0.55;
    }
    h1 {
      font-family: "Plus Jakarta Sans", "Segoe UI", sans-serif;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.15;
      font-size: clamp(1.45rem, 3vw, 2rem);
      margin: 0 0 0.4rem;
    }
    .meta {
      font-family: "Plus Jakarta Sans", "Segoe UI", sans-serif;
      color: var(--muted);
      font-size: 0.95rem;
      margin: 0 0 1rem;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
    }
    .actions a {
      font-family: "Plus Jakarta Sans", "Segoe UI", sans-serif;
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none;
      color: var(--ink);
      background: rgba(152, 108, 50, 0.18);
      border: 1px solid rgba(152, 108, 50, 0.35);
      border-radius: 8px;
      padding: 0.55rem 0.9rem;
    }
    .actions a:hover { background: rgba(152, 108, 50, 0.32); }
    .actions a.primary {
      background: var(--ink);
      color: #fff;
      border-color: var(--ink);
    }
    .actions a.primary:hover { background: #0a1270; }
    article {
      background: var(--panel);
      border: 1px solid color-mix(in srgb, var(--ink) 12%, transparent);
      border-radius: 10px;
      padding: 1rem 1.25rem 1.5rem;
    }
    .cue {
      display: grid;
      grid-template-columns: 4.5rem 1fr;
      gap: 0.65rem 0.85rem;
      margin: 0;
      padding: 0.45rem 0;
      border-bottom: 1px solid color-mix(in srgb, var(--ink) 8%, transparent);
    }
    .cue:last-child { border-bottom: none; }
    .cue-time {
      font-family: "Plus Jakarta Sans", "Segoe UI", sans-serif;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--accent);
      text-decoration: none;
      padding-top: 0.15rem;
    }
    .cue-time:hover { color: var(--ink); text-decoration: underline; }
    .cue-text { font-size: 1.05rem; }
    footer {
      position: relative;
      z-index: 0;
      font-family: "Plus Jakarta Sans", "Segoe UI", sans-serif;
      margin-top: 2rem;
      padding-bottom: 7.5rem;
      font-size: 0.85rem;
      color: var(--muted);
      text-align: center;
    }
    footer::after {
      content: "";
      position: absolute;
      right: 0;
      bottom: 0;
      width: 220px;
      height: 126px;
      background: var(--waves) right bottom / 220px 126px no-repeat;
      pointer-events: none;
      z-index: -1;
      opacity: 0.85;
    }
    @media (max-width: 768px) {
      header::after {
        width: 220px;
        height: 126px;
        background-size: 220px 126px;
      }
      footer { padding-bottom: 5.5rem; }
      footer::after {
        width: 160px;
        height: 92px;
        background-size: 160px 92px;
      }
    }
    @media (max-width: 520px) {
      .cue { grid-template-columns: 1fr; gap: 0.2rem; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <nav>
      <a href="../../../">KERI Mini Conference November 2026</a>
      · <a href="./">All transcripts</a>
    </nav>
    <header>
      <h1>Kent Bull</h1>
      <p class="meta">Mini Conference nov 2026 · 0:17</p>
      <div class="actions">
        <a class="primary" href="../../../#kent-bull">Watch video</a>
        <a href="./">All transcripts</a>
        <a href="../../../">Video gallery</a>
      </div>
    </header>
    <article>
    <p class="cue" id="t0">
      <a class="cue-time" href="../../../#kent-bull">0:00</a>
      <span class="cue-text">[Background noise]</span>
    </p>
    </article>
    <footer>KERI Foundation • Conference Videos Collection</footer>
  </div>
</body>
</html>
