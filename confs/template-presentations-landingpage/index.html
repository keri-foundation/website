            function setCondensedButtonState(toggleBtn, allCondensed) {
                if (!toggleBtn) return;
                toggleBtn.dataset.allCondensed = String(allCondensed);
                toggleBtn.title = allCondensed ? 'Expand all videos' : 'Condense all videos';
                toggleBtn.setAttribute('aria-pressed', String(allCondensed));
                toggleBtn.innerHTML = allCondensed ? condensedViewText : expandedViewText;
            }

            function updateCondensedToggleState() {
                const toggleAllBtn = document.querySelector('#toggleAllVideos');
                if (!toggleAllBtn) return;
                const cards = document.querySelectorAll('.video-card');
                const allCondensed = cards.length > 0 && Array.from(cards).every(card => card.classList.contains('condensed'));
                setCondensedButtonState(toggleAllBtn, allCondensed);
            }

            function setCardCondensedState(card, condensed) {
                const title = card.querySelector('.video-title');
                const titleText = title ? title.textContent.trim() : 'video';
                card.classList.toggle('condensed', condensed);
                if (condensed) {
                    card.setAttribute('tabindex', '0');
                    card.setAttribute('role', 'button');
                    card.setAttribute('aria-expanded', 'false');
                    card.removeAttribute('aria-labelledby');
                    card.setAttribute('aria-label', `Expand ${titleText}`);
                } else {
                    card.removeAttribute('tabindex');
                    card.removeAttribute('role');
                    card.removeAttribute('aria-expanded');
                    card.removeAttribute('aria-label');
                    if (title && title.id) {
                        card.setAttribute('aria-labelledby', title.id);
                    }
                }
            }

            function setAllCardsCondensed(condensed) {
                const cards = document.querySelectorAll('.video-card');
                cards.forEach(card => setCardCondensedState(card, condensed));
                updateCondensedToggleState();
            }

            function toggleAllCardsCondensed() {
                const cards = document.querySelectorAll('.video-card');
                const allCondensed = cards.length > 0 && Array.from(cards).every(card => card.classList.contains('condensed'));
                setAllCardsCondensed(!allCondensed);
            }

            // ─────────────────────────────────────────────────────────────────────
            //  SRT parser → array of { start, end, startLabel, text }
            // ─────────────────────────────────────────────────────────────────────
            function parseSrt(raw) {
                const cues = [];
                const normalized = raw.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
                const blocks = normalized.split(/\n{2,}/);
                const timePat = new RegExp(
                    '(\\d{2}:\\d{2}:\\d{2})[.,](\\d{3})\\s*-->\\s*(\\d{2}:\\d{2}:\\d{2})[.,](\\d{3})'
                );

                for (const block of blocks) {
                    const lines = block.trim().split('\n');
                    if (lines.length < 2) continue;
                    let timeLine = -1;
                    for (let i = 0; i < lines.length; i++) {
                        if (timePat.test(lines[i])) { timeLine = i; break; }
                    }
                    if (timeLine === -1) continue;
                    const m = lines[timeLine].match(timePat);
                    if (!m) continue;
                    const startSec = srtTimeToSeconds(m[1], m[2]);
                    const cueText = lines.slice(timeLine + 1).join(' ').trim();
                    if (!cueText) continue;
                    cues.push({
                        start: startSec,
                        end: srtTimeToSeconds(m[3], m[4]),
                        startLabel: formatTime(startSec),
                        text: cueText
                    });
                }
                return cues;
            }

            function normalizeUrl(url) {
                return url.replace(/^(https?:)\/([^/])/, '$1//$2');
            }

            function parseSrtTimestamp(value) {
                const match = value.trim().match(/^(\d{2}):(\d{2}):(\d{2})[,.](\d{3})$/);
                if (!match) return Number.NaN;
                const hours = Number(match[1]);
                const minutes = Number(match[2]);
                const seconds = Number(match[3]);
                const millis = Number(match[4]);
                return hours * 3600 + minutes * 60 + seconds + millis / 1000;
            }

            function extractUrlsFromText(text) {
                const regex = /https?:\/\/[^\s)<>\]]+/gi;
                const seen = new Set();
                const urls = [];

                for (const match of text.matchAll(regex)) {
                    const raw = match[0].replace(/[.,;:!?)]+$/, '');
                    const normalized = normalizeUrl(raw);
                    if (!seen.has(normalized)) {
                        seen.add(normalized);
                        urls.push(normalized);
                    }
                }

                return urls;
            }

            function parseSrtCuesForUrls(srt) {
                const normalized = srt.replace(/\r\n/g, '\n').replace(/\r/g, '\n').trim();
                const cues = [];

                for (const block of normalized.split(/\n\n+/)) {
                    const lines = block.split('\n');
                    const timeLineIndex = lines.findIndex(line => line.includes('-->'));
                    if (timeLineIndex === -1) continue;

                    const [startStr, endStr] = lines[timeLineIndex].split('-->').map(part => part.trim());
                    const start = parseSrtTimestamp(startStr);
                    const end = parseSrtTimestamp(endStr);
                    if (!Number.isFinite(start) || !Number.isFinite(end)) continue;

                    cues.push({
                        start,
                        end,
                        text: lines.slice(timeLineIndex + 1).join('\n'),
                    });
                }

                return cues;
            }

            function cueOverlapsRange(cue, rangeStart, rangeStop) {
                const rangeEnd = rangeStop ?? Number.POSITIVE_INFINITY;
                return cue.end > rangeStart && cue.start < rangeEnd;
            }

            function extractUrlsFromSrt(srt, rangeStart = 0, rangeStop = null) {
                const cues = parseSrtCuesForUrls(srt);
                const seen = new Set();
                const urls = [];

                for (const cue of cues) {
                    if (!cueOverlapsRange(cue, rangeStart, rangeStop)) continue;
                    for (const url of extractUrlsFromText(cue.text)) {
                        if (!seen.has(url)) {
                            seen.add(url);
                            urls.push(url);
                        }
                    }
                }

                return urls;
            }

            // ─────────────────────────────────────────────────────────────────────
            //  In-memory transcript store  path → { status, cues, rawText }
            //  status: 'loading' | 'ready' | 'error'
            // ─────────────────────────────────────────────────────────────────────
            const transcriptStore = {};
            const transcriptPromises = {};  // path → Promise — kept so in-flight fetches are reusable
            const videoElementMap = {};   // path → <video> element
            const audioElementMap = {};   // path → <audio> element
            const playbackClock = {};     // path → seconds
            const clockSyncLock = {};     // path → true while applying a handoff seek

            function rememberClock(path, time) {
                if (!path || !Number.isFinite(time) || time < 0) return;
                playbackClock[path] = time;
            }

            function shouldAcceptMediaTime(path, time) {
                if (clockSyncLock[path]) return false;
                const clock = Number.isFinite(playbackClock[path]) ? playbackClock[path] : 0;
                // Ignore the brief 0s burst when a newly loaded file starts before handoff seek.
                if (time < 0.5 && clock > 1) return false;
                return true;
            }

            function mediaElsForPath(path) {
                const els = [];
                if (audioElementMap[path]) els.push(audioElementMap[path]);
                if (videoElementMap[path]) els.push(videoElementMap[path]);
                if (modalVideoEl && modalSourceVideoPath === path) els.push(modalVideoEl);
                return els;
            }

            function readClock(path) {
                if (!path) return 0;
                const playing = mediaElsForPath(path).find(el => el && !el.paused && !el.ended);
                if (playing && Number.isFinite(playing.currentTime)) {
                    playbackClock[path] = playing.currentTime;
                    return playing.currentTime;
                }
                if (Number.isFinite(playbackClock[path])) return playbackClock[path];
                const loaded = mediaElsForPath(path).find(el => el && el.readyState >= 1 && Number.isFinite(el.currentTime) && el.currentTime > 0);
                if (loaded) {
                    playbackClock[path] = loaded.currentTime;
                    return loaded.currentTime;
                }
                return 0;
            }

            function seekWhenReady(el, time) {
                if (!el || !Number.isFinite(time)) return;
                const apply = () => {
                    try { el.currentTime = time; } catch {
                        // Ignore seek errors if the media is not ready yet.
                    }
                };
                if (el.readyState >= 1) apply();
                el.addEventListener('loadedmetadata', apply, { once: true });
                el.addEventListener('canplay', apply, { once: true });
                el.addEventListener('playing', apply, { once: true });
            }

            function syncMediaToClock(el, path) {
                if (!el || !path) return;
                const clock = Number.isFinite(playbackClock[path]) ? playbackClock[path] : 0;
                if (!(clock > 0)) return;
                clockSyncLock[path] = true;
                const unlock = () => { clockSyncLock[path] = false; };
                const apply = () => {
                    try { el.currentTime = clock; } catch {
                        // Ignore seek errors if the media is not ready yet.
                    }
                };
                seekWhenReady(el, clock);
                el.addEventListener('playing', () => {
                    apply();
                    requestAnimationFrame(unlock);
                }, { once: true });
                setTimeout(unlock, 4000);
            }

            function attachClockTracking(el, path) {
                if (!el || !path || el.dataset.clockTracking === 'true') return;
                el.dataset.clockTracking = 'true';
                const save = () => {
                    if (!shouldAcceptMediaTime(path, el.currentTime)) return;
                    rememberClock(path, el.currentTime);
                };
                el.addEventListener('timeupdate', save);
                el.addEventListener('pause', save);
                el.addEventListener('seeked', () => rememberClock(path, el.currentTime));
                el.addEventListener('ended', () => {
                    if (!clockSyncLock[path]) rememberClock(path, 0);
                });
            }

            function setSessionHandler(action, handler) {
                if (!('mediaSession' in navigator)) return;
                try { navigator.mediaSession.setActionHandler(action, handler); } catch {
                    // Unsupported lock-screen / headset action on this browser.
                }
            }

            function updateMediaSession(video, mediaEl) {
                if (!('mediaSession' in navigator) || !video || !mediaEl) return;
                try {
                    const poster = getSpeakerPoster(video);
                    navigator.mediaSession.metadata = new MediaMetadata({
                        title: video.title || 'Conference talk',
                        artist: video.speaker || '',
                        album: document.title || 'Conference Videos',
                        artwork: poster ? [{ src: poster, sizes: '512x512' }] : []
                    });
                    navigator.mediaSession.playbackState = mediaEl.paused ? 'paused' : 'playing';
                    setSessionHandler('play', () => playMedia(mediaEl));
                    setSessionHandler('pause', () => mediaEl.pause());
                    setSessionHandler('seekbackward', () => {
                        mediaEl.currentTime = Math.max(0, (mediaEl.currentTime || 0) - 10);
                    });
                    setSessionHandler('seekforward', () => {
                        mediaEl.currentTime = (mediaEl.currentTime || 0) + 10;
                    });
                    setSessionHandler('seekto', (details) => {
                        if (details && Number.isFinite(details.seekTime)) mediaEl.currentTime = details.seekTime;
                    });
                    if (Number.isFinite(mediaEl.duration) && mediaEl.duration > 0) {
                        navigator.mediaSession.setPositionState({
                            duration: mediaEl.duration,
                            playbackRate: mediaEl.playbackRate || 1,
                            position: Math.min(mediaEl.currentTime || 0, mediaEl.duration)
                        });
                    }
                } catch {
                    // Media Session is best-effort for lock-screen playback.
                }
            }

            function pauseAllVideos(exceptMedia) {
                for (const key in videoElementMap) {
                    const otherVideo = videoElementMap[key];
                    if (otherVideo && otherVideo !== exceptMedia && !otherVideo.paused) {
                        otherVideo.pause();
                    }
                }
                for (const key in audioElementMap) {
                    const otherAudio = audioElementMap[key];
                    if (otherAudio && otherAudio !== exceptMedia && !otherAudio.paused) {
                        otherAudio.pause();
                    }
                }
                if (promoVideoEl && promoVideoEl !== exceptMedia && !promoVideoEl.paused) {
                    promoVideoEl.pause();
                }
                if (modalVideoEl && modalVideoEl !== exceptMedia && !modalVideoEl.paused) {
                    modalVideoEl.pause();
                }
            }

            // ─────────────────────────────────────────────────────────────────────
            //  Multi-language subtitles (optional). `subtitle` = English (`foo.srt`).
            //  Extra languages are discovered as siblings: `foo.nl.srt`, `foo.es.srt`, …
            //  Partial tracks: coverage is derived from SRT cue timestamps.
            // ─────────────────────────────────────────────────────────────────────
            const LANGUAGE_LABELS = {
                en: 'English',
                nl: 'Nederlands',
                de: 'Deutsch',
                fr: 'Français',
                es: 'Español',
                it: 'Italiano',
                pt: 'Português',
                ja: '日本語',
                zh: '中文',
                ko: '한국어',
                ar: 'العربية',
                hi: 'हिन्दी',
                sv: 'Svenska',
                da: 'Dansk',
                no: 'Norsk',
                fi: 'Suomi',
                pl: 'Polski',
                uk: 'Українська'
            };

            const captionTrackStore = {};
            const captionTrackPromises = {};
            const captionCoverageByVideo = new WeakMap();
            // Merge cue gaps shorter than this into one coverage window so brief
            // pauses between lines do not flash the "no translation" notice.
            const CAPTION_COVERAGE_MERGE_GAP = 30;

            function languageLabel(lang) {
                const key = String(lang || '').toLowerCase();
                return LANGUAGE_LABELS[key] || (key ? key.toUpperCase() : 'Unknown');
            }

            function normalizeSubtitleEntry(value) {
                if (!value) return null;
                if (typeof value === 'string') return { src: value };
                if (typeof value === 'object' && value.src) return { src: String(value.src) };
                return null;
            }

            function englishSubtitleSrc(video) {
                const entry = normalizeSubtitleEntry(video?.subtitle);
                return entry?.src || null;
            }

            function derivedSubtitleSrc(englishSrc, lang) {
                const key = String(lang || '').toLowerCase();
                if (!englishSrc || !key || key === 'en') return null;
                if (!/\.srt$/i.test(englishSrc)) return null;
                return englishSrc.replace(/\.srt$/i, `.${key}.srt`);
            }

            function subtitleTracks(video) {
                const tracks = {};
                if (!video) return tracks;
                const en = englishSubtitleSrc(video);
                if (en) tracks.en = { src: en };
                // Prefer HEAD-discovered siblings; fall back to optional JSON overrides.
                const extras = video._resolvedSubtitles || video.subtitles;
                if (extras && typeof extras === 'object') {
                    for (const [lang, value] of Object.entries(extras)) {
                        const entry = normalizeSubtitleEntry(value);
                        const key = String(lang || '').toLowerCase();
                        if (entry && key && key !== 'en') tracks[key] = entry;
                    }
                }
                return tracks;
            }

            function probeSubtitleExists(src) {
                return fetch(src, { method: 'HEAD' })
                    .then((res) => {
                        if (res.ok) return true;
                        // Some hosts reject HEAD; fall back to a light GET.
                        if (res.status === 405 || res.status === 501) {
                            return fetch(src, { method: 'GET', headers: { Range: 'bytes=0-0' } })
                                .then((r) => r.ok || r.status === 206)
                                .catch(() => false);
                        }
                        return false;
                    })
                    .catch(() => false);
            }

            function resolveExtraSubtitleTracks(video) {
                if (!video) return Promise.resolve({});
                if (video._subtitleDiscovery) return video._subtitleDiscovery;

                video._subtitleDiscovery = (async () => {
                    const resolved = {};
                    if (video.subtitles && typeof video.subtitles === 'object') {
                        for (const [lang, value] of Object.entries(video.subtitles)) {
                            const entry = normalizeSubtitleEntry(value);
                            const key = String(lang || '').toLowerCase();
                            if (entry && key && key !== 'en') resolved[key] = entry;
                        }
                    }

                    const en = englishSubtitleSrc(video);
                    if (en) {
                        const langs = Object.keys(LANGUAGE_LABELS).filter((lang) => lang !== 'en' && !resolved[lang]);
                        await Promise.all(langs.map(async (lang) => {
                            const src = derivedSubtitleSrc(en, lang);
                            if (!src) return;
                            if (await probeSubtitleExists(src)) resolved[lang] = { src };
                        }));
                    }

                    video._resolvedSubtitles = resolved;
                    return resolved;
                })();

                return video._subtitleDiscovery;
            }

            function primarySubtitleLang(video) {
                const tracks = subtitleTracks(video);
                if (tracks.en) return 'en';
                return Object.keys(tracks)[0] || null;
            }

            function primarySubtitleSrc(video) {
                const lang = primarySubtitleLang(video);
                return lang ? subtitleTracks(video)[lang].src : null;
            }

            function hasSubtitles(video) {
                return Object.keys(subtitleTracks(video)).length > 0;
            }

            let captionLangPreference = null; // from ?lang= / #…&lang= or player choice

            function normalizeLangCode(raw) {
                if (!raw || typeof raw !== 'string') return null;
                const match = raw.trim().toLowerCase().match(/^([a-z]{2,3})(?:-[a-z0-9]+)?$/i);
                return match ? match[1].toLowerCase() : null;
            }

            function readCaptionLangFromLocation() {
                const hash = window.location.hash;
                if (hash && hash.length > 1) {
                    const hashPart = hash.substring(1);
                    const ampIndex = hashPart.indexOf('&');
                    const queryStr = ampIndex === -1 ? '' : hashPart.substring(ampIndex + 1);
                    const fromHash = parseHashQuery(queryStr).lang;
                    if (fromHash) return fromHash;
                }
                try {
                    return normalizeLangCode(new URLSearchParams(window.location.search).get('lang'));
                } catch {
                    return null;
                }
            }

            function syncLangSearchParam(lang) {
                try {
                    const url = new URL(window.location.href);
                    if (lang && lang !== 'en') url.searchParams.set('lang', lang);
                    else url.searchParams.delete('lang');
                    const next = `${url.pathname}${url.search}${url.hash}`;
                    const cur = `${window.location.pathname}${window.location.search}${window.location.hash}`;
                    if (next !== cur) history.replaceState(null, '', next);
                } catch {
                    // Ignore URL sync failures.
                }
            }

            function setCaptionLangPreference(lang, { syncUrl = true } = {}) {
                captionLangPreference = normalizeLangCode(lang);
                if (!syncUrl) return;
                if (modalVideoId && videoModalOverlay && !videoModalOverlay.hidden) {
                    // Preserve clip/share t&e. Using currentTime here used to rewrite t=
                    // (often to 0 before seek finished) and drop the end bound.
                    const { start, end } = getCurrentHashTimeRange();
                    const activeClipStart = (typeof clipStartTime === 'number' && Number.isFinite(clipStartTime))
                        ? clipStartTime
                        : null;
                    const activeClipEnd = (typeof clipEndTime === 'number' && Number.isFinite(clipEndTime))
                        ? clipEndTime
                        : null;
                    const time = start !== null
                        ? start
                        : (activeClipStart !== null ? activeClipStart : (modalVideoEl?.currentTime ?? 0));
                    const endTime = activeClipEnd !== null ? activeClipEnd : end;
                    updateVideoUrlForModal(modalVideoId, time, endTime);
                    return;
                }
                syncLangSearchParam(captionLangPreference);
            }

            function preferredCaptionLanguage(tracks) {
                // URL/player preference when available; otherwise English (full transcript).
                const langs = Object.keys(tracks || {});
                if (!langs.length) return null;
                const want = captionLangPreference || readCaptionLangFromLocation();
                if (want && langs.includes(want)) return want;
                if (langs.includes('en')) return 'en';
                return langs[0];
            }

            function coverageRangesFromCues(cues, mergeGap = CAPTION_COVERAGE_MERGE_GAP) {
                if (!Array.isArray(cues) || !cues.length) return [];
                const sorted = [...cues].sort((a, b) => a.start - b.start);
                const ranges = [{ start: sorted[0].start, end: sorted[0].end }];
                for (let i = 1; i < sorted.length; i++) {
                    const cue = sorted[i];
                    const last = ranges[ranges.length - 1];
                    if (cue.start <= last.end + mergeGap) {
                        last.end = Math.max(last.end, cue.end);
                    } else {
                        ranges.push({ start: cue.start, end: cue.end });
                    }
                }
                return ranges;
            }

            function timeInCoverage(time, ranges) {
                if (!Array.isArray(ranges) || !ranges.length) return false;
                return ranges.some((r) => time >= r.start && time <= r.end);
            }

            function getActiveCaptionLanguage(videoEl) {
                const player = videoEl && videoEl._plyrPlayer ? videoEl._plyrPlayer : null;
                if (player && player.language) return String(player.language).toLowerCase();
                const tracks = videoEl?.textTracks;
                if (!tracks) return null;
                for (let i = 0; i < tracks.length; i++) {
                    const track = tracks[i];
                    if ((track.kind === 'subtitles' || track.kind === 'captions') && track.mode === 'showing') {
                        return String(track.language || '').toLowerCase() || null;
                    }
                }
                return null;
            }

            function captionsAreEnabled(videoEl) {
                const player = videoEl && videoEl._plyrPlayer ? videoEl._plyrPlayer : null;
                if (player && typeof player.currentTrack === 'number') {
                    return player.currentTrack >= 0;
                }
                const tracks = videoEl?.textTracks;
                if (!tracks) return false;
                for (let i = 0; i < tracks.length; i++) {
                    const track = tracks[i];
                    if ((track.kind === 'subtitles' || track.kind === 'captions') && track.mode === 'showing') {
                        return true;
                    }
                }
                return false;
            }

            function ensureCaptionGapNotice(containerEl) {
                if (!containerEl) return null;
                let notice = containerEl.querySelector('.caption-gap-notice');
                if (!notice) {
                    notice = document.createElement('div');
                    notice.className = 'caption-gap-notice';
                    notice.hidden = true;
                    notice.setAttribute('role', 'status');
                    notice.setAttribute('aria-live', 'polite');
                    containerEl.appendChild(notice);
                }
                return notice;
            }

            function updateCaptionGapNotice(videoEl) {
                if (!videoEl) return;
                const container = videoEl.closest('.video-modal-player, .video-thumbnail');
                const notice = container ? ensureCaptionGapNotice(container) : null;
                if (!notice) return;

                const meta = captionCoverageByVideo.get(videoEl);
                if (!meta || !captionsAreEnabled(videoEl)) {
                    notice.hidden = true;
                    return;
                }

                const activeLang = getActiveCaptionLanguage(videoEl);
                const primaryLang = meta.primaryLang;
                if (!activeLang || activeLang === primaryLang) {
                    notice.hidden = true;
                    return;
                }

                const ranges = meta.byLang?.[activeLang];
                if (!ranges || !ranges.length) {
                    notice.hidden = true;
                    return;
                }

                const t = Number(videoEl.currentTime) || 0;
                if (timeInCoverage(t, ranges)) {
                    notice.hidden = true;
                    return;
                }

                notice.textContent = `No ${languageLabel(activeLang)} translation for this part yet`;
                notice.hidden = false;
            }

            // Card/thumbnail players also emit languagechange when captions attach.
            // While the modal is open, only the modal player may own the URL lang=
            // (otherwise a late English attach on the card clears &lang=nl).
            function shouldSyncCaptionLangToUrl(videoEl) {
                if (!videoEl) return false;
                if (modalVideoEl && videoModalOverlay && !videoModalOverlay.hidden) {
                    return videoEl === modalVideoEl;
                }
                return true;
            }

            function syncCaptionLangFromVideoEl(videoEl) {
                const lang = normalizeLangCode(getActiveCaptionLanguage(videoEl));
                if (!lang) return;
                videoEl.dataset.preferredCaptionLang = lang;
                if (!shouldSyncCaptionLangToUrl(videoEl)) return;
                // Debounce with languagechange so transient English track flips do not
                // clear &lang=nl from the URL.
                clearTimeout(videoEl._captionLangUrlTimer);
                videoEl._captionLangUrlTimer = setTimeout(() => {
                    if (!shouldSyncCaptionLangToUrl(videoEl)) return;
                    const settled = normalizeLangCode(getActiveCaptionLanguage(videoEl))
                        || normalizeLangCode(videoEl._plyrPlayer?.language);
                    if (!settled) return;
                    if (settled !== captionLangPreference || (settled !== 'en' && readCaptionLangFromLocation() !== settled)) {
                        setCaptionLangPreference(settled);
                    }
                }, 50);
            }

            function bindCaptionLanguageUrlSync(videoEl) {
                if (!videoEl) return;
                const player = videoEl._plyrPlayer;
                if (player && typeof player.on === 'function' && videoEl.dataset.captionLangUrlBound !== 'true') {
                    videoEl.dataset.captionLangUrlBound = 'true';
                    player.on('languagechange', () => {
                        // On cold loads Plyr can emit this before player.language is populated.
                        const lang = normalizeLangCode(player.language) || normalizeLangCode(getActiveCaptionLanguage(videoEl));
                        if (lang) {
                            videoEl.dataset.preferredCaptionLang = lang;
                            if (shouldSyncCaptionLangToUrl(videoEl)) {
                                // Plyr often emits a transient English languagechange while
                                // switching tracks; debounce so URL lang= does not flicker off.
                                clearTimeout(videoEl._captionLangUrlTimer);
                                videoEl._captionLangUrlTimer = setTimeout(() => {
                                    if (!shouldSyncCaptionLangToUrl(videoEl)) return;
                                    const settled = normalizeLangCode(player.language)
                                        || normalizeLangCode(getActiveCaptionLanguage(videoEl));
                                    if (settled) setCaptionLangPreference(settled);
                                }, 50);
                            }
                            enforceActiveCaptionTrack(videoEl, lang);
                        }
                        updateCaptionGapNotice(videoEl);
                        if (videoEl === modalVideoEl) scheduleModalTranscriptLanguageRefresh();
                    });
                }
                if (videoEl.textTracks && videoEl.dataset.captionLangTrackBound !== 'true') {
                    videoEl.dataset.captionLangTrackBound = 'true';
                    videoEl.textTracks.addEventListener('change', () => {
                        enforceActiveCaptionTrack(videoEl);
                        syncCaptionLangFromVideoEl(videoEl);
                        updateCaptionGapNotice(videoEl);
                    });
                }
            }

            function bindCaptionGapNotice(videoEl) {
                if (!videoEl) return;
                bindCaptionLanguageUrlSync(videoEl);
                if (videoEl.dataset.captionGapBound === 'true') {
                    updateCaptionGapNotice(videoEl);
                    return;
                }
                videoEl.dataset.captionGapBound = 'true';
                const onUpdate = () => {
                    // Plyr may flip inactive tracks back to "hidden" (still cue-active);
                    // keep non-selected languages disabled so English cannot flash.
                    enforceActiveCaptionTrack(videoEl);
                    updateCaptionGapNotice(videoEl);
                };
                videoEl.addEventListener('timeupdate', onUpdate);
                videoEl.addEventListener('seeked', onUpdate);
                videoEl.addEventListener('play', onUpdate);
                const player = videoEl._plyrPlayer;
                if (player && typeof player.on === 'function') {
                    player.on('captionsenabled', () => {
                        syncCaptionLangFromVideoEl(videoEl);
                        onUpdate();
                        if (videoEl === modalVideoEl) scheduleModalTranscriptLanguageRefresh();
                    });
                    player.on('captionsdisabled', () => {
                        const container = videoEl.closest('.video-modal-player, .video-thumbnail');
                        const notice = container?.querySelector('.caption-gap-notice');
                        if (notice) notice.hidden = true;
                    });
                }
                onUpdate();
            }

            function srtToVttBlobUrl(rawSrt) {
                const vtt = 'WEBVTT\n\n' + String(rawSrt || '')
                    .replace(/\r\n/g, '\n').replace(/\r/g, '\n')
                    .replace(/(\d{2}:\d{2}:\d{2}),(\d{3})/g, '$1.$2');
                const blob = new Blob([vtt], { type: 'text/vtt' });
                return URL.createObjectURL(blob);
            }

            function loadCaptionTrack(video, lang) {
                const key = `${video.path}::${lang}`;
                if (captionTrackPromises[key]) return captionTrackPromises[key];

                const entry = subtitleTracks(video)[lang];
                if (!entry?.src) {
                    captionTrackPromises[key] = Promise.resolve(null);
                    return captionTrackPromises[key];
                }

                if (!captionTrackStore[video.path]) captionTrackStore[video.path] = {};
                captionTrackStore[video.path][lang] = {
                    status: 'loading',
                    cues: [],
                    rawText: '',
                    coverage: [],
                    src: entry.src,
                    lang
                };

                captionTrackPromises[key] = fetch(entry.src)
                    .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.text(); })
                    .then(raw => {
                        const cues = parseSrt(raw);
                        const track = {
                            status: 'ready',
                            rawText: raw,
                            cues,
                            coverage: coverageRangesFromCues(cues),
                            src: entry.src,
                            lang
                        };
                        captionTrackStore[video.path][lang] = track;
                        return track;
                    })
                    .catch(() => {
                        const track = {
                            status: 'error',
                            rawText: '',
                            cues: [],
                            coverage: [],
                            src: entry.src,
                            lang
                        };
                        captionTrackStore[video.path][lang] = track;
                        return track;
                    });

                return captionTrackPromises[key];
            }

            function loadAllCaptionTracks(video) {
                return resolveExtraSubtitleTracks(video).then(() => {
                    const langs = Object.keys(subtitleTracks(video));
                    if (!langs.length) return {};
                    return Promise.all(langs.map((lang) => loadCaptionTrack(video, lang)))
                        .then(() => captionTrackStore[video.path] || {});
                });
            }

            function loadTranscript(video) {
                const id = video.path;
                // Return the existing promise so concurrent callers all wait for the same fetch
                if (transcriptPromises[id]) return transcriptPromises[id];
                const lang = primarySubtitleLang(video);
                if (!lang) {
                    transcriptStore[id] = { status: 'error', cues: [], rawText: '' };
                    transcriptPromises[id] = Promise.resolve(transcriptStore[id]);
                    return transcriptPromises[id];
                }

                transcriptStore[id] = { status: 'loading', cues: [], rawText: '' };
                transcriptPromises[id] = loadCaptionTrack(video, lang).then((track) => {
                    if (!track || track.status !== 'ready') {
                        transcriptStore[id] = { status: 'error', cues: [], rawText: '' };
                    } else {
                        transcriptStore[id] = {
                            status: 'ready',
                            cues: track.cues,
                            rawText: track.rawText
                        };
                    }
                    return transcriptStore[id];
                });
                return transcriptPromises[id];
            }

            function detachCaptionTracks(videoEl) {
                if (!videoEl) return;
                videoEl.querySelectorAll('track').forEach(track => {
                    const blobUrl = track.dataset.blobUrl;
                    track.remove();
                    if (blobUrl) {
                        try { URL.revokeObjectURL(blobUrl); } catch {
                            // Ignore revoke errors for already-released blob URLs.
                        }
                    }
                });
                captionCoverageByVideo.delete(videoEl);
                const container = videoEl.closest('.video-modal-player, .video-thumbnail');
                const notice = container?.querySelector('.caption-gap-notice');
                if (notice) notice.hidden = true;
            }

            function attachVttTrack(videoEl, rawSrt, options = {}) {
                const lang = String(options.lang || 'en').toLowerCase();
                const existing = videoEl.querySelector(`track[data-keri-captions="true"][srclang="${lang}"]`);
                if (existing) return existing;

                const blobUrl = srtToVttBlobUrl(rawSrt);
                const track = document.createElement('track');
                // iOS native fullscreen shows kind=captions more reliably than subtitles.
                track.kind = 'captions';
                track.srclang = lang;
                track.label = options.label || languageLabel(lang);
                track.default = Boolean(options.isDefault);
                track.dataset.keriCaptions = 'true';
                track.dataset.keriLang = lang;
                track.dataset.blobUrl = blobUrl;
                track.src = blobUrl;
                const activate = () => {
                    syncPlyrCaptions(videoEl, videoEl.dataset.preferredCaptionLang || lang);
                    bindCaptionCueFollow(videoEl, track.track);
                    if (videoEl.webkitDisplayingFullscreen) {
                        setCaptionTracksMode(videoEl, 'showing');
                    }
                    updateCaptionGapNotice(videoEl);
                };
                track.addEventListener('load', activate, { once: true });
                videoEl.appendChild(track);
                return track;
            }

            function attachCaptionTracksForVideo(videoEl, video, store) {
                if (!videoEl || !video || !store) return;
                const tracks = subtitleTracks(video);
                const langs = Object.keys(tracks);
                if (!langs.length) return;

                const preferred = preferredCaptionLanguage(tracks);
                const primaryLang = primarySubtitleLang(video) || 'en';
                videoEl.dataset.preferredCaptionLang = preferred || primaryLang;

                const byLang = {};
                for (const lang of langs) {
                    const data = store[lang];
                    if (!data || data.status !== 'ready' || !data.rawText) continue;
                    attachVttTrack(videoEl, data.rawText, {
                        lang,
                        label: languageLabel(lang),
                        isDefault: lang === preferred
                    });
                    byLang[lang] = data.coverage || coverageRangesFromCues(data.cues);
                }

                captionCoverageByVideo.set(videoEl, { primaryLang, byLang });
                bindCaptionGapNotice(videoEl);
                syncPlyrCaptions(videoEl, preferred || primaryLang);
            }

            // ─────────────────────────────────────────────────────────────────────
            //  Cue line element (shared by accordion and search results)
            // ─────────────────────────────────────────────────────────────────────
            function makeCueLine(cue, videoPath, highlightQuery, targetVideoEl, lang) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'cue-line';
                btn.dataset.cueStart = String(cue.start);
                btn.dataset.cueEnd = String(cue.end);
                const langName = lang ? languageLabel(lang) : '';
                btn.setAttribute(
                    'aria-label',
                    langName
                        ? `Play from ${cue.startLabel} (${langName}): ${cue.text}`
                        : `Play from ${cue.startLabel}: ${cue.text}`
                );

                const timeSpan = document.createElement('span');
                timeSpan.className = 'cue-time';
                timeSpan.textContent = cue.startLabel;
                timeSpan.setAttribute('aria-hidden', 'true');

                const textSpan = document.createElement('span');
                textSpan.className = 'cue-text';
                if (highlightQuery) {
                    textSpan.innerHTML = highlightMatch(cue.text, highlightQuery);
                } else {
                    textSpan.textContent = cue.text;
                }

                btn.appendChild(timeSpan);
                if (langName) {
                    const langSpan = document.createElement('span');
                    langSpan.className = 'cue-lang';
                    langSpan.textContent = langName;
                    langSpan.setAttribute('aria-hidden', 'true');
                    btn.appendChild(langSpan);
                }
                btn.appendChild(textSpan);

                const seek = () => {
                    const videoEl = targetVideoEl || videoElementMap[videoPath];
                    if (!videoEl) return;
                    videoEl.currentTime = cue.start;
                    playMedia(videoEl);
                    if (!targetVideoEl) {
                        videoEl.scrollIntoView({ behavior: motionSafeBehavior(), block: 'center' });
                    }
                };
                btn.addEventListener('click', seek);
                return btn;
            }

            let videoModalOverlay = null;
            let videoModalDialog = null;
            let modalVideoEl = null;
            let modalTranscriptBody = null;
            let modalTranscriptSyncBtn = null;
            let modalTranscriptViewBtn = null;
            let modalTranscriptSearchInput = null;
            let modalTranscriptSearchStatus = null;
            let modalTranscriptStore = null;
            let modalTranscriptVideoPath = null;
            let modalTranscriptSearchTimer = null;
            let modalTranscriptPlainView = false;
            let modalTranscriptLang = null;
            let modalTranscriptLangTimer = null;
            let modalTranscriptLiveKey = '';
            let modalTranscriptUserScrolled = false;
            let modalTranscriptScrollLock = 0;
            const captionCueFollowTracks = new WeakSet();
            let modalLinksSection = null;
            let modalTitleEl = null;
            let modalCopyBtn = null;
            let modalClearTimestampsBtn = null;
            let modalCopyHint = null;
            let modalClipTimer = null;
            let modalClipTimerValue = null;
            let modalVideoId = null;
            let modalPreviousFocus = null;
            let modalSourceVideoPath = null;
            let modalWorkspace = null;
            let modalPanelZIndex = 2;
            let modalSourceLink = null;
            let hashSourceUrl = null;
            let copyRangeStart = null;
            let clipEndTime = null;
            let clipStartTime = null;
            let clipTimeUpdateHandler = null;
            let clipResumeHandler = null;
            let modalSessionId = 0;
            let modalLoadedMetadataHandler = null;
            let modalPlaySeekHandler = null;
            let copyFlashTimer = null;

            const COPY_ICON_SVG = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>';
            const COPY_CHECK_SVG = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="20 6 9 17 4 12"></polyline></svg>';
            const CLEAR_TIMESTAMPS_ICON_SVG = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline><line x1="4" y1="4" x2="20" y2="20"></line></svg>';

            function formatClipCountdown(seconds) {
                const total = Math.max(0, Math.ceil(seconds));
                const mins = Math.floor(total / 60);
                const secs = total % 60;
                return `${mins}:${String(secs).padStart(2, '0')}`;
            }

            function clearModalMediaHandlers() {
                if (modalVideoEl && modalLoadedMetadataHandler) {
                    modalVideoEl.removeEventListener('loadedmetadata', modalLoadedMetadataHandler);
                }
                if (modalVideoEl && modalPlaySeekHandler) {
                    modalVideoEl.removeEventListener('play', modalPlaySeekHandler);
                }
                modalLoadedMetadataHandler = null;
                modalPlaySeekHandler = null;
            }

            function beginModalSession() {
                modalSessionId += 1;
                clearModalMediaHandlers();
                return modalSessionId;
            }

            function clearClipPlayback() {
                if (modalVideoEl && clipTimeUpdateHandler) {
                    modalVideoEl.removeEventListener('timeupdate', clipTimeUpdateHandler);
                }
                clipTimeUpdateHandler = null;
                if (modalVideoEl && clipResumeHandler) {
                    modalVideoEl.removeEventListener('play', clipResumeHandler);
                }
                clipResumeHandler = null;
                clipEndTime = null;
                clipStartTime = null;
                if (modalClipTimer) {
                    modalClipTimer.classList.remove('is-visible');
                    modalClipTimer.hidden = true;
                }
                if (modalClipTimerValue) {
                    modalClipTimerValue.textContent = '';
                }
            }

            function updateClipTimerDisplay() {
                if (!modalVideoEl || clipEndTime === null || !modalClipTimerValue) return;
                const currentTime = modalVideoEl.currentTime;
                const start = clipStartTime === null ? 0 : clipStartTime;
                // Ignore the previous clip's position until this clip has actually been seeked into.
                if (currentTime < start - 0.25 || currentTime > clipEndTime + 2) {
                    modalClipTimerValue.textContent = formatClipCountdown(clipEndTime - start);
                    return;
                }
                const remaining = clipEndTime - currentTime;
                modalClipTimerValue.textContent = formatClipCountdown(remaining);
                if (remaining <= 0) {
                    modalVideoEl.pause();
                    modalClipTimerValue.textContent = '0:00';
                    // Release the end-stop so Play can continue past the clip if desired
                    if (clipTimeUpdateHandler) {
                        modalVideoEl.removeEventListener('timeupdate', clipTimeUpdateHandler);
                        clipTimeUpdateHandler = null;
                    }
                    clipEndTime = null;
                    if (clipResumeHandler) {
                        modalVideoEl.removeEventListener('play', clipResumeHandler);
                    }
                    clipResumeHandler = () => {
                        clearClipPlayback();
                    };
                    modalVideoEl.addEventListener('play', clipResumeHandler, { once: true });
                }
            }

            function setupClipPlayback(endTime, startTime) {
                clearClipPlayback();
                if (typeof endTime !== 'number' || !Number.isFinite(endTime) || endTime <= 0) return;

                clipEndTime = endTime;
                clipStartTime = typeof startTime === 'number' && Number.isFinite(startTime) ? startTime : 0;
                if (modalClipTimer) {
                    modalClipTimer.hidden = false;
                    modalClipTimer.classList.add('is-visible');
                }

                clipTimeUpdateHandler = () => updateClipTimerDisplay();
                modalVideoEl.addEventListener('timeupdate', clipTimeUpdateHandler);
                updateClipTimerDisplay();
            }

            function setCopyPendingHintVisible(visible) {
                if (!modalCopyHint) return;
                modalCopyHint.classList.toggle('is-visible', visible);
                modalCopyHint.hidden = !visible;
            }

            function setCopyPendingUi(pending) {
                if (!modalCopyBtn) return;
                modalCopyBtn.classList.toggle('is-pending-start', pending);
                modalCopyBtn.title = pending
                    ? 'Start set — click again at the end, or here again for start-only'
                    : 'Copy link';
                setCopyPendingHintVisible(pending);
            }

            function resetCopyRangeState() {
                copyRangeStart = null;
                if (copyFlashTimer) {
                    clearTimeout(copyFlashTimer);
                    copyFlashTimer = null;
                }
                if (modalCopyBtn) {
                    modalCopyBtn.innerHTML = COPY_ICON_SVG;
                }
                setCopyPendingUi(false);
            }

            function flashCopyButtonSuccess(pendingStart) {
                if (!modalCopyBtn) return;
                if (copyFlashTimer) {
                    clearTimeout(copyFlashTimer);
                    copyFlashTimer = null;
                }
                modalCopyBtn.innerHTML = COPY_CHECK_SVG;
                const copiedLabel = pendingStart
                    ? 'Start time copied. Click again to finish the clip.'
                    : 'Link copied';
                modalCopyBtn.setAttribute('aria-label', copiedLabel);
                setCopyPendingUi(pendingStart);
                copyFlashTimer = setTimeout(() => {
                    copyFlashTimer = null;
                    if (!modalCopyBtn) return;
                    modalCopyBtn.innerHTML = COPY_ICON_SVG;
                    if (modalVideoId && videos.length) {
                        const current = videos.find((v) => generateVideoId(v) === modalVideoId);
                        modalCopyBtn.setAttribute('aria-label', current ? `Copy link to ${current.title}` : 'Copy link to this video');
                    } else {
                        modalCopyBtn.setAttribute('aria-label', 'Copy link to this video');
                    }
                }, 1000);
            }

            function buildShareUrl(videoId, startTime, endTime) {
                // Reuse buildVideoHash so copied links keep lang= (and from=) in sync with the address bar.
                return `${window.location.origin}${window.location.pathname}${window.location.search}${buildVideoHash(videoId, startTime, endTime)}`;
            }

            function copyShareUrl(url, pendingStart) {
                navigator.clipboard.writeText(url).then(() => {
                    flashCopyButtonSuccess(pendingStart);
                });
            }

            function isStackedModalLayout() {
                return window.matchMedia('(max-width: 768px)').matches;
            }

            function getModalPanels() {
                if (!modalWorkspace) return [];
                return Array.from(modalWorkspace.querySelectorAll('.video-modal-panel'));
            }

            function clearModalPanelInlineLayout(panel) {
                panel.style.left = '';
                panel.style.top = '';
                panel.style.width = '';
                panel.style.height = '';
                panel.style.zIndex = '';
            }

            function syncModalPanelLayout() {
                const panels = getModalPanels();
                if (!panels.length) return;
                if (isStackedModalLayout()) {
                    panels.forEach(clearModalPanelInlineLayout);
                    return;
                }
                panels.forEach(clampModalPanelPosition);
            }

            function bringModalPanelToFront(panel) {
                if (isStackedModalLayout()) return;
                modalPanelZIndex += 1;
                panel.style.zIndex = String(modalPanelZIndex);
            }

            function clampModalPanelPosition(panel) {
                if (!modalWorkspace || isStackedModalLayout()) return;
                const maxLeft = Math.max(0, modalWorkspace.clientWidth - panel.offsetWidth);
                const maxTop = Math.max(0, modalWorkspace.clientHeight - panel.offsetHeight);
                const left = Math.min(Math.max(0, panel.offsetLeft), maxLeft);
                const top = Math.min(Math.max(0, panel.offsetTop), maxTop);
                panel.style.left = `${left}px`;
                panel.style.top = `${top}px`;
            }

            function initModalPanelDrag(panel, handle) {
                handle.addEventListener('pointerdown', (e) => {
                    if (e.button !== 0) return;
                    if (isStackedModalLayout()) return;
                    e.preventDefault();
                    bringModalPanelToFront(panel);
                    panel.classList.add('is-dragging');

                    const startX = e.clientX;
                    const startY = e.clientY;
                    const startLeft = panel.offsetLeft;
                    const startTop = panel.offsetTop;

                    handle.setPointerCapture(e.pointerId);

                    const onMove = (ev) => {
                        const dx = ev.clientX - startX;
                        const dy = ev.clientY - startY;
                        const maxLeft = Math.max(0, modalWorkspace.clientWidth - panel.offsetWidth);
                        const maxTop = Math.max(0, modalWorkspace.clientHeight - panel.offsetHeight);
                        panel.style.left = `${Math.min(Math.max(0, startLeft + dx), maxLeft)}px`;
                        panel.style.top = `${Math.min(Math.max(0, startTop + dy), maxTop)}px`;
                    };

                    const onEnd = () => {
                        panel.classList.remove('is-dragging');
                        handle.removeEventListener('pointermove', onMove);
                        handle.removeEventListener('pointerup', onEnd);
                        handle.removeEventListener('pointercancel', onEnd);
                        if (handle.hasPointerCapture(e.pointerId)) {
                            handle.releasePointerCapture(e.pointerId);
                        }
                    };

                    handle.addEventListener('pointermove', onMove);
                    handle.addEventListener('pointerup', onEnd);
                    handle.addEventListener('pointercancel', onEnd);
                });

                panel.addEventListener('pointerdown', () => bringModalPanelToFront(panel));
            }

            function createModalPanel(className, label) {
                const panel = document.createElement('div');
                panel.className = `video-modal-panel ${className}`;

                const handle = document.createElement('div');
                handle.className = 'video-modal-panel-handle';

                const handleLabel = document.createElement('span');
                handleLabel.className = 'video-modal-panel-handle-label';
                handleLabel.textContent = label;

                const handleHint = document.createElement('span');
                handleHint.className = 'video-modal-panel-handle-hint';
                handleHint.textContent = 'Drag header · resize corner';

                handle.appendChild(handleLabel);
                handle.appendChild(handleHint);

                const content = document.createElement('div');
                content.className = 'video-modal-panel-content';

                panel.appendChild(handle);
                panel.appendChild(content);
                initModalPanelDrag(panel, handle);

                return { panel, content };
            }

            function scrollElementIntoContainer(container, element, behavior = motionSafeBehavior()) {
                const containerRect = container.getBoundingClientRect();
                const elementRect = element.getBoundingClientRect();
                const relativeTop = elementRect.top - containerRect.top + container.scrollTop;
                const targetTop = relativeTop - (container.clientHeight / 2) + (element.clientHeight / 2);
                const token = ++modalTranscriptScrollLock;
                container.scrollTo({ top: Math.max(0, targetTop), behavior });
                const release = () => {
                    if (modalTranscriptScrollLock === token) modalTranscriptScrollLock = 0;
                };
                if (behavior === 'smooth') {
                    container.addEventListener('scrollend', release, { once: true });
                    setTimeout(release, 800);
                } else {
                    requestAnimationFrame(() => requestAnimationFrame(release));
                }
            }

            function resetModalTranscriptFollow() {
                clearTimeout(modalTranscriptLangTimer);
                modalTranscriptLangTimer = null;
                modalTranscriptLang = null;
                modalTranscriptLiveKey = '';
                modalTranscriptUserScrolled = false;
                modalTranscriptScrollLock = 0;
            }

            function bindCaptionCueFollow(videoEl, textTrack) {
                if (!videoEl || !textTrack || captionCueFollowTracks.has(textTrack)) return;
                captionCueFollowTracks.add(textTrack);
                textTrack.addEventListener('cuechange', () => {
                    if (videoEl === modalVideoEl) followModalTranscriptCaption();
                });
            }

            function getShowingTrackActiveCues(videoEl) {
                const tracks = videoEl?.textTracks;
                if (!tracks) return { ready: false, cues: [] };
                const want = String(
                    videoEl._plyrPlayer?.language
                    || videoEl.dataset.preferredCaptionLang
                    || ''
                ).toLowerCase();
                for (let i = 0; i < tracks.length; i++) {
                    const track = tracks[i];
                    if (!isCaptionTextTrack(track) || track.mode === 'disabled') continue;
                    const lang = String(track.language || '').toLowerCase();
                    if (want && lang && lang !== want) continue;
                    if (!track.cues || !track.cues.length) return { ready: false, cues: [] };
                    return { ready: true, cues: track.activeCues ? Array.from(track.activeCues) : [] };
                }
                return { ready: false, cues: [] };
            }

            function findModalCueLineByStart(start) {
                if (!modalTranscriptBody || !Number.isFinite(start)) return null;
                const lines = modalTranscriptBody.querySelectorAll('.cue-line[data-cue-start]');
                let best = null;
                let bestDelta = 0.2;
                for (const line of lines) {
                    const value = Number.parseFloat(line.dataset.cueStart);
                    if (!Number.isFinite(value)) continue;
                    const delta = Math.abs(value - start);
                    if (delta < bestDelta) {
                        best = line;
                        bestDelta = delta;
                        if (delta === 0) break;
                    }
                }
                return best;
            }

            function modalCueLinesCoveringTime(time) {
                if (!modalTranscriptBody || !Number.isFinite(time)) return [];
                const lines = modalTranscriptBody.querySelectorAll('.cue-line[data-cue-start]');
                const hits = [];
                for (const line of lines) {
                    const start = Number.parseFloat(line.dataset.cueStart);
                    const end = Number.parseFloat(line.dataset.cueEnd);
                    if (Number.isFinite(start) && Number.isFinite(end) && time >= start && time < end) {
                        hits.push(line);
                    }
                }
                return hits;
            }

            function isCueComfortablyVisible(container, element) {
                const containerRect = container.getBoundingClientRect();
                const elementRect = element.getBoundingClientRect();
                if (!containerRect.height || !elementRect.height) return false;
                const topLimit = containerRect.top + containerRect.height * 0.12;
                const bottomLimit = containerRect.bottom - containerRect.height * 0.18;
                return elementRect.top >= topLimit && elementRect.bottom <= bottomLimit;
            }

            function setLiveCueLines(lines, { scroll = false, force = false } = {}) {
                if (!modalTranscriptBody) return;
                const next = new Set(lines);
                modalTranscriptBody.querySelectorAll('.cue-line.is-live-cue').forEach((el) => {
                    if (next.has(el)) return;
                    el.classList.remove('is-live-cue');
                    el.removeAttribute('aria-current');
                });
                lines.forEach((el) => {
                    el.classList.add('is-live-cue');
                    el.setAttribute('aria-current', 'true');
                });
                const target = lines[0];
                if (!scroll || !target) return;
                if (!force && isCueComfortablyVisible(modalTranscriptBody, target)) return;
                scrollElementIntoContainer(modalTranscriptBody, target, force ? motionSafeBehavior() : 'auto');
            }

            function followModalTranscriptCaption({ forceScroll = false } = {}) {
                if (!modalVideoEl || !modalTranscriptBody) return;
                if (!videoModalOverlay || videoModalOverlay.hidden) return;
                if (modalTranscriptPlainView) return;
                if ((modalTranscriptSearchInput?.value || '').trim()) return;

                const active = getShowingTrackActiveCues(modalVideoEl);
                let lines = [];
                if (active.ready) {
                    const seen = new Set();
                    for (const cue of active.cues) {
                        const line = findModalCueLineByStart(cue.startTime);
                        if (line && !seen.has(line)) {
                            seen.add(line);
                            lines.push(line);
                        }
                    }
                    // Caption is showing, but the transcript is still in another language.
                    if (active.cues.length && !lines.length) return;
                } else {
                    lines = modalCueLinesCoveringTime(modalVideoEl.currentTime || 0);
                }

                const key = lines.map((line) => line.dataset.cueStart).join('|');
                if (!lines.length) {
                    if (!modalTranscriptLiveKey) return;
                    modalTranscriptLiveKey = '';
                    setLiveCueLines([], { scroll: false });
                    return;
                }
                if (!forceScroll && key === modalTranscriptLiveKey) return;
                modalTranscriptLiveKey = key;
                setLiveCueLines(lines, {
                    scroll: forceScroll || !modalTranscriptUserScrolled,
                    force: forceScroll
                });
            }

            function captionTrackForModal(lang) {
                if (!modalSourceVideoPath || !lang) return null;
                const track = captionTrackStore[modalSourceVideoPath]?.[lang];
                if (!track || track.status !== 'ready' || !track.cues.length) return null;
                return track;
            }

            function readyCaptionTracks(videoPath) {
                const byLang = captionTrackStore[videoPath] || {};
                return Object.keys(byLang)
                    .filter((lang) => byLang[lang]?.status === 'ready' && byLang[lang].cues?.length)
                    .sort((a, b) => {
                        if (a === 'en') return -1;
                        if (b === 'en') return 1;
                        return a.localeCompare(b);
                    })
                    .map((lang) => ({ lang, cues: byLang[lang].cues }));
            }

            function transcriptSearchHits(videoPath, normalizedQuery) {
                const hits = [];
                for (const source of readyCaptionTracks(videoPath)) {
                    source.cues.forEach((cue, index) => {
                        if (cue.text.toLowerCase().includes(normalizedQuery)) {
                            hits.push({ cue, index, lang: source.lang, cues: source.cues });
                        }
                    });
                }
                hits.sort((a, b) => a.cue.start - b.cue.start || a.lang.localeCompare(b.lang));
                return hits;
            }

            function scheduleModalTranscriptLanguageRefresh() {
                const sessionId = modalSessionId;
                clearTimeout(modalTranscriptLangTimer);
                modalTranscriptLangTimer = setTimeout(() => {
                    if (sessionId !== modalSessionId) return;
                    applyModalTranscriptLanguage();
                }, 120);
            }

            function applyModalTranscriptLanguage() {
                if (!modalVideoEl || !modalSourceVideoPath) return;
                if (!videoModalOverlay || videoModalOverlay.hidden) return;
                const lang = normalizeLangCode(getActiveCaptionLanguage(modalVideoEl))
                    || normalizeLangCode(modalVideoEl.dataset.preferredCaptionLang);
                if (!lang) return;
                const track = captionTrackForModal(lang);
                if (!track) {
                    followModalTranscriptCaption();
                    return;
                }
                if (lang !== modalTranscriptLang) {
                    modalTranscriptLang = lang;
                    modalTranscriptUserScrolled = false;
                    modalTranscriptLiveKey = '';
                    populateModalTranscript(track, modalSourceVideoPath, modalTranscriptSearchInput?.value ?? '');
                    return;
                }
                followModalTranscriptCaption();
            }

            function scrollModalTranscriptToCurrentTime() {
                if (!modalVideoEl || !modalTranscriptBody) return;
                modalTranscriptUserScrolled = false;

                const active = getShowingTrackActiveCues(modalVideoEl);
                const covering = modalCueLinesCoveringTime(modalVideoEl.currentTime || 0);
                if (active.cues.length || covering.length) {
                    followModalTranscriptCaption({ forceScroll: true });
                    const line = modalTranscriptBody.querySelector('.cue-line.is-live-cue');
                    if (line) flashModalTranscriptCue(line);
                    return;
                }

                const time = modalVideoEl.currentTime;
                const cueLines = modalTranscriptBody.querySelectorAll('.cue-line[data-cue-start]');
                if (!cueLines.length) return;

                let targetLine = cueLines[0];
                for (const line of cueLines) {
                    const start = Number.parseFloat(line.dataset.cueStart);
                    if (Number.isFinite(start) && start <= time) {
                        targetLine = line;
                    } else {
                        break;
                    }
                }

                scrollElementIntoContainer(modalTranscriptBody, targetLine);
                flashModalTranscriptCue(targetLine);
            }

            function flashModalTranscriptCue(line) {
                if (!line || !modalTranscriptBody) return;

                modalTranscriptBody.querySelectorAll('.cue-line.is-current-position').forEach((el) => {
                    el.classList.remove('is-current-position');
                });

                // Restart the animation if the same line is targeted again
                void line.offsetWidth;
                line.classList.add('is-current-position');

                const clearFlash = () => {
                    line.classList.remove('is-current-position');
                    line.removeEventListener('animationend', clearFlash);
                };
                line.addEventListener('animationend', clearFlash);
            }

            function setModalTranscriptSyncEnabled(enabled) {
                if (!modalTranscriptSyncBtn) return;
                modalTranscriptSyncBtn.disabled = !enabled;
            }

            function concatenateCueTexts(cues) {
                return cues
                    .map(cue => cue.text.trim())
                    .filter(Boolean)
                    .join(' ')
                    .replace(/\s+/g, ' ')
                    .replace(/\s+([.,!?;:])/g, '$1')
                    .trim();
            }

                modalLinksSection.className = 'video-modal-links';

                const { panel: transcriptPanel, content: transcriptContent } = createModalPanel('video-modal-panel--transcript', 'Transcript');

                modalTranscriptSyncBtn.className = 'video-modal-transcript-sync-btn';

                modalTranscriptSyncBtn.title = 'Jump to the subtitle currently shown and follow it';
                modalTranscriptSyncBtn.setAttribute('aria-label', 'Scroll the transcript to the subtitle currently shown under the video and keep following it');

                modalTranscriptViewBtn = document.createElement('button');
                modalTranscriptViewBtn.type = 'button';
                modalTranscriptViewBtn.className = 'video-modal-transcript-view-btn';

                updateModalTranscriptViewBtn();
                modalTranscriptViewBtn.addEventListener('click', () => {
                    modalTranscriptPlainView = !modalTranscriptPlainView;
                    updateModalTranscriptViewBtn();
                    runModalTranscriptSearch();

                searchWrap.className = 'video-modal-transcript-search-wrap';

                modalTranscriptSearchInput.disabled = true;
                modalTranscriptSearchInput.setAttribute('aria-label', 'Search this transcript');
                modalTranscriptSearchInput.setAttribute('aria-describedby', 'videoModalTranscriptSearchStatus');
                modalTranscriptSearchInput.addEventListener('input', () => {
                    clearTimeout(modalTranscriptSearchTimer);
                    modalTranscriptSearchTimer = setTimeout(runModalTranscriptSearch, 200);
                });

                modalTranscriptSearchStatus = document.createElement('span');
                modalTranscriptSearchStatus.id = 'videoModalTranscriptSearchStatus';
                modalTranscriptSearchStatus.className = 'video-modal-transcript-search-status';
                modalTranscriptSearchStatus.setAttribute('role', 'status');
                modalTranscriptSearchStatus.setAttribute('aria-live', 'polite');

                searchWrap.appendChild(modalTranscriptSearchInput);
                searchWrap.appendChild(modalTranscriptSearchStatus);

                transcriptToolbar.appendChild(searchWrap);
                transcriptToolbar.appendChild(modalTranscriptViewBtn);
                transcriptToolbar.appendChild(modalTranscriptSyncBtn);

                modalTranscriptBody = document.createElement('div');
                modalTranscriptBody.className = 'video-modal-transcript-body';
                modalTranscriptBody.addEventListener('scroll', () => {
                    if (modalTranscriptScrollLock) return;
                    modalTranscriptUserScrolled = true;
                }, { passive: true });
                modalTranscriptBody.addEventListener('wheel', () => {
                    modalTranscriptUserScrolled = true;
                }, { passive: true });
                modalTranscriptBody.addEventListener('touchmove', () => {
                    modalTranscriptUserScrolled = true;
                }, { passive: true });
                modalTranscriptBody.addEventListener('keydown', (e) => {
                    if (['ArrowDown', 'ArrowUp', 'PageDown', 'PageUp', 'Home', 'End', ' '].includes(e.key)) {
                        modalTranscriptUserScrolled = true;

                modalWorkspace.appendChild(transcriptPanel);

                dialog.appendChild(modalWorkspace);

                const clampPanels = () => {
                    syncModalPanelLayout();

                window.matchMedia('(max-width: 768px)').addEventListener('change', clampPanels);
                [videoPanel, transcriptPanel].forEach((panel) => {
                    panel.addEventListener('mouseup', clampPanels);
                });

                videoModalOverlay.addEventListener('click', (e) => {
                    if (e.target === videoModalOverlay) closeVideoModal();
                });
                videoModalOverlay.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') {
                        e.preventDefault();
                        closeVideoModal();
                        return;
                    }
                    if (e.key !== 'Tab' || !videoModalDialog) return;
                    const focusable = getFocusableElements(videoModalDialog);
                    if (!focusable.length) {
                        e.preventDefault();
                        videoModalDialog.focus();
                        return;
                    }
                    const first = focusable[0];
                    const last = focusable[focusable.length - 1];
                    if (e.shiftKey && document.activeElement === first) {
                        e.preventDefault();
                        last.focus();
                    } else if (!e.shiftKey && document.activeElement === last) {
                        e.preventDefault();
                        first.focus();
                    }
                });

                document.body.appendChild(videoModalOverlay);

            function renderModalLinks(rawSrt) {
                if (!modalLinksSection) return;
                modalLinksSection.innerHTML = '';
                modalLinksSection.hidden = true;
                if (!rawSrt) return;

                const urls = extractUrlsFromSrt(rawSrt);
                if (!urls.length) return;

                modalLinksSection.hidden = false;

                const heading = document.createElement('h3');
                heading.className = 'video-modal-links-heading';
                heading.textContent = 'Links';

                const list = document.createElement('ul');
                list.className = 'subtitle-links';
                for (const link of urls) {
                    const li = document.createElement('li');
                    const a = document.createElement('a');
                    a.href = link;
                    a.target = '_blank';
                    a.rel = 'noopener noreferrer';
                    a.textContent = link;
                    const hint = document.createElement('span');
                    hint.className = 'visually-hidden';
                    hint.textContent = ' (opens in a new tab)';
                    a.appendChild(hint);
                    li.appendChild(a);
                    list.appendChild(li);
