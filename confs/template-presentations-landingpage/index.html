<!DOCTYPE html>
<html lang="en">
<!--
  Presentations landing page (self-contained).
  Copy this file into a conference folder that also has index.json.
  Page copy, videos, and posters come from index.json in the same folder.
-->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Videos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,600;0,700;0,800;1,600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.plyr.io/3.8.4/plyr.css">
    <style>
        :root {
            --heading-font: 'Plus Jakarta Sans', 'Segoe UI', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #b1d1cf;
            color: #060b6f;
            padding: 16px 8px;
            min-height: 100vh;
        }

        a {
            color: #0450a8;
        }

        a:hover {
            color: #060b6f;
        }

        a:focus-visible {
            outline: 2px solid #986c32;
            outline-offset: 2px;
        }

        h1 a {
            color: inherit;
            text-decoration: none;
        }

        h1 a:hover,
        h1 a:focus-visible {
            text-decoration: underline;
        }

        .skip-link {
            position: absolute;
            left: 16px;
            top: 16px;
            z-index: 3000;
            padding: 10px 16px;
            background: #060b6f;
            color: #fff;
            font-weight: 700;
            border-radius: 8px;
            text-decoration: none;
            transform: translateY(-200%);
        }

        .skip-link:focus,
        .skip-link:focus-visible {
            color: #fff;
            transform: none;
            outline: 2px solid #986c32;
            outline-offset: 3px;
        }

        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .gallery-nav {
            margin-top: 14px;
            font-size: 0.95rem;
        }

        .gallery-toolbar {
            margin: 0 0 8px;
        }

        header {
            text-align: center;
            padding: 30px 0;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.35);
            border-radius: 8px;
            border: 1px solid rgba(6, 11, 111, 0.12);
        }

        h1,
        h1 a,
        h2,
        h3,
        .video-title,
        .video-modal-title {
            font-family: var(--heading-font);
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.12;
            margin-bottom: 10px;
        }

        .status-notice {
            display: inline-block;
            margin: 0 auto 18px;
            padding: 10px 16px;
            background: rgba(255, 255, 255, 0.55);
            color: #060b6f;
            border-radius: 4px;
            border: 1px solid rgba(6, 11, 111, 0.14);
            border-left: 3px solid #986c32;
            font-size: 0.9rem;
            font-weight: 500;
            max-width: 760px;
            text-align: left;
            line-height: 1.45;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #2e3a7a;
            max-width: 800px;
            margin: 0 auto;
        }

        /* ── Search bar ── */
        .search-section {
            display: block;
            margin-bottom: 30px;
            background: rgba(255, 255, 255, 0.35);
            border-radius: 8px;
            padding: 20px 24px;
            border: 1px solid rgba(6, 11, 111, 0.12);
        }

        .search-section label {
            display: block;
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 10px;
            letter-spacing: 0.04em;
            color: #060b6f;
        }

        .search-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        #transcriptSearch {
            flex: 1 1 12rem;
            min-width: 0;
            background: rgba(255, 255, 255, 0.65);
            border: 1px solid rgba(6, 11, 111, 0.2);
            border-radius: 8px;
            color: #060b6f;
            font-size: 1rem;
            padding: 10px 14px;
            transition: border-color 0.2s;
        }

        #transcriptSearch::placeholder {
            color: rgba(6, 11, 111, 0.72);
        }

        #transcriptSearch:focus-visible {
            border-color: #986c32;
            outline: 2px solid #986c32;
            outline-offset: 2px;
        }

        #searchToggleAll,
        #searchClear,
        #toggleAllVideos {
            background: rgba(255, 255, 255, 0.65);
            border: 1px solid rgba(6, 11, 111, 0.2);
            border-radius: 8px;
            color: #060b6f;
            font-size: 0.95rem;
            padding: 10px 16px;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }

        #searchToggleAll:hover,
        #searchClear:hover,
        #toggleAllVideos:hover {
            background: rgba(255, 255, 255, 0.9);
            border-color: rgba(6, 11, 111, 0.3);
        }

        #searchToggleAll:focus-visible,
        #searchClear:focus-visible,
        #toggleAllVideos:focus-visible {
            outline: 2px solid #986c32;
            outline-offset: 2px;
        }

        #searchToggleAll:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        #searchStatus {
            font-size: 0.85rem;
            color: #2e3a7a;
            margin-top: 8px;
        }

        #searchResults {
            margin-top: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .search-result {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
            appearance: none;
            background: rgba(177, 209, 207, 0.12);
            border: 1px solid rgba(177, 209, 207, 0.25);
            border-radius: 10px;
            padding: 12px 16px;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            min-height: 44px;
            font: inherit;
            color: inherit;
            text-align: left;
        }

        .search-result:hover,
        .search-result:focus-visible {
            background: rgba(6, 11, 111, 0.12);
            border-color: rgba(152, 108, 50, 0.35);
        }

        .search-result:focus-visible {
            outline: 2px solid #986c32;
            outline-offset: 2px;
        }

        .search-result-title {
            font-size: 0.8rem;
            font-weight: 700;
            color: #060b6f;
            margin-bottom: 4px;
            letter-spacing: 0.03em;
        }

        .search-result-time {
            font-size: 0.75rem;
            background: rgba(6, 11, 111, 0.08);
            color: #2e3a7a;
            border-radius: 20px;
            padding: 2px 8px;
            white-space: nowrap;
            flex: none;
            margin-bottom: 0;
        }

        .search-result-text {
            font-size: 0.9rem;
            line-height: 1.45;
            flex: 1 1 0;
            min-width: 0;
        }

        .search-result-context {
            display: inline;
        }

        .context-line {
            display: inline;
            margin: 0;
            padding: 0;
        }

        .context-line.before::after,
        .context-line.match::after {
            content: ' ';
        }

        .context-line.before,
        .context-line.after {
            color: #2e3a7a;
        }

        .context-line.match {
            font-weight: 700;
        }

        .search-result-text mark {
            background: rgba(177, 209, 207, 0.75);
            color: #060b6f;
            border-radius: 2px;
            padding: 0 2px;
        }

        /* ── Search result grouping ── */
        .search-result-group {
            background: rgba(177, 209, 207, 0.08);
            border: 1px solid rgba(177, 209, 207, 0.2);
            border-radius: 10px;
            overflow: hidden;
        }

        .search-result-group-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            appearance: none;
            background: rgba(177, 209, 207, 0.15);
            border: none;
            border-bottom: 1px solid rgba(177, 209, 207, 0.2);
            padding: 10px 16px;
            font: inherit;
            font-size: 0.95rem;
            font-weight: 600;
            color: #060b6f;
            text-align: left;
            cursor: pointer;
            transition: background 0.2s;
        }

        .search-result-group-title:hover {
            background: rgba(177, 209, 207, 0.25);
        }

        .search-result-group-title:focus-visible {
            outline: 2px solid #986c32;
            outline-offset: -2px;
        }

        .search-result-group-title-text {
            display: inline-flex;
            align-items: center;
            width: 100%;
            text-align: left;
        }

        .search-result-group-title:hover .search-result-group-title-text {
            text-decoration: underline;
        }

        .search-result-group-toggle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 1.8em;
            min-height: 1.8em;
            color: inherit;
            margin-left: 1rem;
            transition: transform 0.2s;
            font-size: 1rem;
        }

        .search-result-group-title[aria-expanded="false"] .search-result-group-toggle {
            transform: rotate(-90deg);
        }

        .search-result-group-items {
            display: flex;
            flex-direction: column;
            gap: 0;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .search-result-group-items>li {
            margin: 0;
            padding: 0;
        }

        .search-result-group-items[hidden] {
            display: none !important;
        }

        .search-result-group .search-result {
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(177, 209, 207, 0.1);
            border-radius: 0;
            padding: 10px 16px;
            margin: 0;
            cursor: pointer;
            transition: background 0.15s;
        }

        .search-result-group-items>li:last-child .search-result {
            border-bottom: none;
        }

        .search-result-group .search-result:hover,
        .search-result-group .search-result:focus-visible {
            background: rgba(177, 209, 207, 0.12);
            border-color: transparent;
        }

        /* ── Optional promo movie (omit promo from index.json to hide) ── */
        .promo-section {
            margin-bottom: 30px;
            background: rgba(255, 255, 255, 0.35);
            border-radius: 8px;
            padding: 20px 24px 24px;
            border: 1px solid rgba(6, 11, 111, 0.12);
        }

        .promo-section[hidden] {
            display: none !important;
        }

        .promo-title {
            font-size: 1.45rem;
            font-weight: 800;
            letter-spacing: -0.01em;
            color: #060b6f;
            margin: 0 0 14px;
            text-align: center;
        }

        .promo-title[hidden] {
            display: none !important;
        }

        .promo-player {
            position: relative;
            max-width: 960px;
            margin: 0 auto;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(6, 11, 111, 0.2);
        }

        .promo-player .plyr {
            width: 100%;
        }

        .promo-player .plyr__poster {
            background-size: cover;
            background-position: center;
        }

        /* ── Top ten clips ── */
        .top-clips-section {
            margin-bottom: 30px;
            background: rgba(255, 255, 255, 0.35);
            border-radius: 8px;
            padding: 20px 24px 14px;
            border: 1px solid rgba(6, 11, 111, 0.12);
        }

        .top-clips-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 4px 18px;
            margin-bottom: 14px;
        }

        .top-clips-header h2 {
            font-size: 1.45rem;
            font-weight: 800;
            letter-spacing: -0.01em;
            color: #060b6f;
        }

        .top-clips-sub {
            font-size: 0.88rem;
            color: #2e3a7a;
            margin: 0;
        }

        .top-clips-row {
            display: grid;
            grid-auto-flow: column;
            grid-auto-columns: 15.5rem;
            gap: 14px;
            overflow-x: auto;
            scroll-snap-type: x proximity;
            padding: 4px 2px 12px;
            margin: 0;
            list-style: none;
            scrollbar-width: thin;
            scrollbar-color: rgba(6, 11, 111, 0.35) transparent;
        }

        .top-clips-row::-webkit-scrollbar {
            height: 6px;
        }

        .top-clips-row::-webkit-scrollbar-thumb {
            background: rgba(6, 11, 111, 0.3);
            border-radius: 3px;
        }

        .top-clips-row>li {
            scroll-snap-align: start;
            min-height: 19rem;
        }

        .top-clip-card {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            width: 100%;
            height: 100%;
            min-height: 19rem;
            border: 1px solid rgba(6, 11, 111, 0.2);
            border-radius: 12px;
            overflow: hidden;
            background: #060b6f;
            color: #fff;
            font: inherit;
            text-align: left;
            padding: 0;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
        }

        .top-clip-card:hover,
        .top-clip-card:focus-visible {
            transform: translateY(-4px);
            box-shadow: 0 12px 28px rgba(6, 11, 111, 0.35);
            border-color: #986c32;
        }

        .top-clip-card:focus-visible {
            outline: 2px solid #986c32;
            outline-offset: 3px;
        }

        .top-clip-photo {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 20%;
            opacity: 0.9;
            transition: transform 0.3s;
        }

        .top-clip-card:hover .top-clip-photo {
            transform: scale(1.04);
        }

        .top-clip-scrim {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg,
                    rgba(6, 11, 111, 0.25) 0%,
                    rgba(6, 11, 111, 0.55) 42%,
                    rgba(4, 6, 60, 0.94) 78%,
                    rgba(3, 5, 48, 0.98) 100%);
        }

        .top-clip-rank {
            position: absolute;
            top: 2px;
            left: 10px;
            font-family: var(--heading-font);
            font-size: 3.4rem;
            font-weight: 800;
            line-height: 1;
            color: transparent;
            -webkit-text-stroke: 2px rgba(255, 255, 255, 0.92);
            text-shadow: 0 2px 12px rgba(6, 11, 111, 0.6);
        }

        @supports not (-webkit-text-stroke: 2px #fff) {
            .top-clip-rank {
                color: rgba(255, 255, 255, 0.92);
            }
        }

        .top-clip-duration {
            position: absolute;
            top: 12px;
            right: 12px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.92);
            color: #060b6f;
            font-size: 0.75rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.03em;
        }

        .top-clip-duration svg {
            display: block;
        }

        .top-clip-quote {
            position: relative;
            padding: 0 14px 10px;
            font-size: 0.92rem;
            font-weight: 600;
            line-height: 1.42;
            text-shadow: 0 1px 8px rgba(3, 5, 48, 0.8);
        }

        .top-clip-meta {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 1px;
            padding: 0 14px 13px;
        }

        .top-clip-speaker {
            font-family: var(--heading-font);
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            color: #b1d1cf;
        }

        .top-clip-talk {
            font-size: 0.72rem;
            color: rgba(255, 255, 255, 0.75);
        }

        @media (max-width: 480px) {
            .top-clips-row {
                grid-auto-columns: 82vw;
            }

            .top-clips-row>li,
            .top-clip-card {
                min-height: 17rem;
            }
        }

        /* ── Day sections ── */
        .video-container {
            display: grid;
            gap: 40px;
            padding: 20px 0;
        }

        .day-section {
            display: grid;
            gap: 28px;
        }

        .day-section h2 {
            font-size: 2rem;
            font-weight: 700;
            margin: 0;
            padding: 24px 10px 12px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #060b6f;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            justify-content: stretch;
            justify-items: stretch;
            gap: 16px;
            width: 100%;
        }

        @media (min-width: 1600px) {
            .video-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }

        @media (max-width: 640px) {
            .video-grid {
                grid-template-columns: minmax(0, 1fr);
            }
        }

        @supports (grid-template-rows: masonry) {
            .video-grid {
                grid-template-rows: masonry;
            }
        }

        .video-grid:has(.video-card.condensed) {
            grid-template-columns: minmax(0, 56rem);
            justify-content: center;
        }

        /* ── Video cards ── */
        .video-card {
            background: rgba(255, 255, 255, 0.4);
            border-radius: 8px;
            overflow: hidden;
            transition: border-color 0.2s ease, opacity 0.3s ease, filter 0.3s ease;
            border: 6px solid #e8e8f1;
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: none;
            justify-self: stretch;
            break-inside: avoid;
        }

        .video-card.condensed {
            background: transparent;
            box-shadow: none;
            border: none;
            flex-direction: row;
            align-items: center;
            gap: 15px;
            padding: 0px;
            margin: 0;
            max-width: none;
            cursor: pointer;
        }

        .video-card.condensed:focus-visible {
            outline: 2px solid #986c32;
            outline-offset: 3px;
            border-radius: 8px;
        }

        .video-card.condensed .video-info {
            padding: 0;
        }

        .video-card.condensed *:not(.video-info):not(.video-title):not(.video-icon):not(.video-icon *) {
            display: none;
        }

        .video-card.condensed .video-title>.video-icon,
        .video-card.condensed .video-title>.video-icon * {
            display: inline-flex;
        }

        .video-card-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .open-video-modal-btn,
        .download-presentation-btn,
        .view-presentation-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            flex: 1 1 10rem;
            background: rgba(152, 108, 50, 0.18);
            border: 1px solid rgba(152, 108, 50, 0.35);
            border-radius: 8px;
            color: #060b6f;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.03em;
            padding: 10px 14px;
            cursor: pointer;
            transition: background 0.2s;
            text-decoration: none;
            box-sizing: border-box;
        }

        .open-video-modal-btn:hover,
        .download-presentation-btn:hover,
        .view-presentation-btn:hover {
            background: rgba(152, 108, 50, 0.32);
        }

        .open-video-modal-btn:focus-visible,
        .download-presentation-btn:focus-visible,
        .view-presentation-btn:focus-visible {
            outline: 2px solid #986c32;
            outline-offset: 2px;
        }

        /* ── Video modal ── */
        .video-modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: max(12px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
            background: rgba(6, 11, 111, 0.35);
        }

        .video-modal-overlay[hidden] {
            display: none !important;
        }

        .video-modal {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100%;
            background: #f4f8f7;
            border-radius: 8px;
            border: 1px solid rgba(6, 11, 111, 0.14);
            overflow: hidden;
            color: #060b6f;
        }

        .video-modal:focus {
            outline: none;
        }

        .video-modal-header {
            position: relative;
            z-index: 6;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 16px;
            background: rgba(177, 209, 207, 0.35);
            border-bottom: 1px solid rgba(6, 11, 111, 0.12);
            flex-shrink: 0;
        }

        .video-modal-header-actions {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            flex-wrap: wrap;
            gap: 8px;
            flex-shrink: 0;
            max-width: min(100%, 28rem);
        }

        .video-modal-header-text {
            min-width: 0;
            flex: 1;
        }

        .video-modal-title {
            font-size: 1.05rem;
            line-height: 1.4;
            font-weight: 700;
            margin: 0;
            padding-right: 8px;
        }

        .video-modal-source {
            margin: 6px 8px 0 0;
            font-size: 0.82rem;
            line-height: 1.35;
            font-weight: 600;
            color: rgba(6, 11, 111, 0.78);
            word-break: break-all;
        }

        .video-modal-source a {
            font-weight: 700;
        }

        .video-modal-close {
            position: relative;
            z-index: 8;
            flex: 0 0 2.75rem;
            align-self: flex-start;
            width: 2.75rem;
            min-width: 2.75rem;
            height: 2.75rem;
            margin: -4px -4px -4px 0;
            border: none;
            border-radius: 8px;
            background: rgba(6, 11, 111, 0.1);
            color: #060b6f;
            font-size: 1.75rem;
            line-height: 1;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            transition: background 0.2s;
        }

        .video-modal-close:hover {
            background: rgba(6, 11, 111, 0.2);
        }

        .video-modal-close:focus-visible {

        .video-modal-transcript-sync-btn,

            font-weight: 600;

        .video-modal-transcript-sync-btn:hover:not(:disabled),

        .video-modal-transcript-sync-btn:focus-visible,
        .video-modal-transcript-view-btn:focus-visible {
            outline: 2px solid #986c32;
            outline-offset: 2px;
        }

        .video-modal-transcript-sync-btn:disabled,
        .video-modal-transcript-view-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .video-modal-transcript-view-btn[aria-pressed="true"] {

        }

        .video-modal-transcript-body {

            overflow-y: auto;
            padding: 4px 14px 18px;
            scrollbar-width: thin;
            scrollbar-color: rgba(6, 11, 111, 0.35) transparent;

        .video-modal-transcript-body::-webkit-scrollbar {
            width: 8px;

        .video-modal-transcript-body::-webkit-scrollbar-thumb {
            background: rgba(6, 11, 111, 0.35);
            border-radius: 4px;
        }

        .video-modal-transcript-body .cue-line {

            margin-bottom: 4px;

            }

            100% {
                background-color: transparent;
            }

        .video-modal-transcript-body .cue-line.is-current-position {

        .video-modal-transcript-body .cue-time {

            color: #036b64;
            background: rgba(6, 11, 111, 0.08);

        .video-modal-transcript-body .cue-text {

            color: #1a1a2e;
        }

        .video-modal-transcript-body .cue-text mark {

        .video-modal-transcript-body .transcript-plain {

        .video-modal-transcript-body .transcript-plain mark {
            background: rgba(177, 209, 207, 0.75);
            color: #060b6f;
            border-radius: 2px;
            padding: 0 2px;
        }

        .video-modal-transcript-body .transcript-loading {

            padding: 12px 4px;
        }

        .video-card:hover {
            border-color: #0450a8;
        }

        .video-card.dimmed {
            opacity: 0.45;
            filter: grayscale(0.45);
        }

        .video-card.dimmed:hover {
            border-color: #060b6f;
        }

        .video-card.highlighted {
            border-color: #986c32;
            border-width: 2px;
        }

        :root {
            --plyr-color-main: #5f7c2f;
        }

        .plyr--video:not(.plyr--playing) .plyr__overlay-controls,
        .plyr--video:not(.plyr--playing) .plyr__control--overlaid {
            display: flex;
            visibility: visible;
            opacity: 0.95;
        }

        .plyr--video.plyr--playing:not(.plyr--hide-controls) .plyr__overlay-controls,
        .plyr--video.plyr--playing:not(.plyr--hide-controls) .plyr__control--overlaid,
        .plyr--video.plyr--playing.plyr--overlay-controls-pinned .plyr__overlay-controls,
        .plyr--video.plyr--playing.plyr--overlay-controls-pinned .plyr__control--overlaid {
            display: flex;
            visibility: visible;
            opacity: 0.95;
        }

        .plyr__overlay-controls {
            position: absolute;
            top: 50%;
            left: 50%;
            z-index: 3;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 0.85rem;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .plyr__overlay-controls .plyr__control,
        .plyr__control--overlaid {
            pointer-events: auto;
        }

        .video-modal-player .plyr__poster {
            pointer-events: none;
        }

        .plyr__overlay-controls .plyr__control--overlaid {
            position: static;
            top: auto;
            left: auto;
            transform: none;
            margin: 0;
        }

        .plyr__control--overlaid {
            padding: 1.35rem;
            z-index: 3;
        }

        .plyr__control--overlay-seek {
            padding: 0.95rem;
            background: rgba(0, 0, 0, 0.55);
            border-radius: 100%;
            color: #fff;
            border: 0;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.15s ease;
        }

        .plyr__control--overlay-seek:hover,
        .plyr__control--overlay-seek:focus-visible {
            background: var(--plyr-color-main, #5f7c2f);
        }

        .plyr__control--overlay-seek:active {
            transform: scale(0.96);
        }

        .plyr__control--overlaid svg,
        .plyr__control--overlay-seek svg {
            width: 1.75rem;
            height: 1.75rem;
            display: block;
        }

        .plyr__control--overlay-seek svg {
            width: 1.35rem;
            height: 1.35rem;
        }

        .plyr__control--overlaid.plyr__control--pressed svg {
            left: 0;
        }

        /* Cinematic split-tone on speaker posters only (while player is stopped) */
        .video-thumbnail {
            width: 100%;
            background: #accfce;
        }

        .video-thumbnail video {
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 9;
            display: block;
        }

        /* Plyr duplicates the poster; we render our own filtered copy instead */
        .video-thumbnail .plyr__poster {
            display: none !important;
        }

        .video-poster-filter-wrap {
            pointer-events: none;
        }

        .video-thumbnail .video-poster-filter-wrap {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            transition: opacity 0.2s ease, visibility 0.2s ease;
        }

        .video-thumbnail .video-poster-filter {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
            object-position: center;
            filter: saturate(1.45) contrast(1.2) brightness(0.84) sepia(0.32) hue-rotate(-18deg);
            transition: filter 0.45s ease;
        }

        .video-thumbnail .video-poster-filter-wrap::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(145deg,
                    rgba(6, 11, 111, 0.35) 0%,
                    transparent 45%,
                    rgba(152, 108, 50, 0.28) 100%);
            mix-blend-mode: soft-light;
        }

        .video-card:hover .video-thumbnail .plyr.plyr--stopped .video-poster-filter {
            filter: saturate(1.55) contrast(1.24) brightness(0.88) sepia(0.26) hue-rotate(-14deg);
        }

        .video-thumbnail .plyr:not(.plyr--stopped) .video-poster-filter-wrap {
            opacity: 0;
            visibility: hidden;
        }

        .video-info {
            padding: 16px 20px 18px;
        }

        .video-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .video-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            color: #2e3a7a;
            margin-top: 6px;
        }

        .video-duration {
            background: rgba(6, 11, 111, 0.1);
            padding: 3px 8px;
            border-radius: 20px;
            color: #060b6f;
        }

        .copy-button {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 2.25rem;
            height: 2.25rem;
            background: rgba(6, 11, 111, 0.1);
            border: none;
            border-radius: 8px;
            color: #060b6f;
            cursor: pointer;
            transition: background 0.2s, box-shadow 0.2s;
        }

        .copy-button:hover {
            background: rgba(6, 11, 111, 0.2);
        }

        .copy-button:focus-visible {
            outline: 2px solid #986c32;
            outline-offset: 2px;
        }

        .copy-button.is-pending-start {
            background: rgba(152, 108, 50, 0.35);
            box-shadow: inset 0 0 0 2px #986c32;
            animation: copy-pending-blink 1s ease-in-out infinite;
        }

        .copy-pending-hint {
            display: none;
            max-width: 16rem;
            padding: 6px 10px;
            border-radius: 8px;
            background: rgba(152, 108, 50, 0.2);
            border: 1px solid rgba(152, 108, 50, 0.55);
            color: #4a3520;
            font-size: 0.75rem;
            font-weight: 600;
            line-height: 1.35;
            animation: copy-pending-blink 1s ease-in-out infinite;
        }

        .copy-pending-hint.is-visible {
            display: block;
        }

        @keyframes copy-pending-blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.35;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            .copy-button.is-pending-start,
            .copy-pending-hint {
                animation: none;
            }

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }

            .top-clip-card:hover,
            .top-clip-card:focus-visible,
            .top-clip-card:hover .top-clip-photo,
            .plyr__control--overlay-seek:active {
                transform: none;
            }
        }

        .clip-timer {
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 20;
            display: none;
            align-items: baseline;
            gap: 12px;
            padding: 12px 18px;
            border-radius: 12px;
            background: rgba(6, 11, 111, 0.94);
            color: #fff;
            font-size: 1.75rem;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.02em;
            line-height: 1;
            pointer-events: none;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45), 0 0 0 2px rgba(255, 255, 255, 0.18);
        }

        .clip-timer.is-visible {
            display: inline-flex;
        }

        .clip-timer-label {
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            opacity: 0.9;
        }

        .clip-timer-value {
            min-width: 3.6em;
            text-align: right;
            font-size: 2.1rem;
            font-weight: 800;
        }

        /* ── Transcript accordion ── */
        .transcript-toggle {
            display: flex;
            align-items: center;
            gap: 7px;
            width: 100%;
            background: rgba(152, 108, 50, 0.12);
            border: none;
            border-top: 1px solid rgba(6, 11, 111, 0.1);
            color: #4a3520;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            padding: 10px 20px;
            cursor: pointer;
            text-align: left;
            transition: background 0.2s;
            margin-top: auto;
        }

        .transcript-toggle:hover {
            background: rgba(152, 108, 50, 0.2);
            color: #2a1f10;
        }

        .transcript-toggle:focus-visible {
            outline: 2px solid #986c32;
            outline-offset: -2px;
        }

        .transcript-toggle .arrow {
            display: inline-block;
            transition: transform 0.25s;
            font-style: normal;
        }

        .transcript-toggle[aria-expanded="true"] .arrow {
            transform: rotate(90deg);
        }

        .transcript-panel {
            overflow: hidden;
            max-height: 0;
            transition: max-height 0.35s ease;
            background: rgba(6, 11, 111, 0.06);
        }

        .transcript-panel.open {
            max-height: 380px;
        }

        .transcript-body {
            padding: 12px 16px;
            overflow-y: auto;
            max-height: 360px;
            scrollbar-width: thin;
            scrollbar-color: rgba(177, 209, 207, 0.6) transparent;
        }

        .transcript-body::-webkit-scrollbar {
            width: 5px;
        }

        .transcript-body::-webkit-scrollbar-thumb {
            background: rgba(177, 209, 207, 0.6);
            border-radius: 3px;
        }

        .transcript-loading {
            font-size: 0.8rem;
            color: #2e3a7a;
            padding: 6px 0;
        }

        /* ── Cue lines ── */
        .cue-line {
            display: flex;
            gap: 10px;
            width: 100%;
            appearance: none;
            margin-bottom: 6px;
            align-items: flex-start;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            padding: 4px 6px;

            font: inherit;
            color: inherit;
            text-align: left;

        .cue-line:hover {

        .cue-line:focus-visible {

            outline-offset: 1px;
        }

        .cue-time {

            white-space: nowrap;
        }

        .cue-text {

            color: #1a2347;
        }

        footer {
            text-align: center;
            padding: 30px 0;
            margin-top: 30px;
            font-size: 0.9rem;
            color: #2e3a7a;
        }

        @media (max-width: 768px) {
            .video-container {
                gap: 24px;
            }

            h1 {
                font-size: 2.2rem;
            }

            .video-modal-overlay {
                padding: 0;
                padding-top: env(safe-area-inset-top, 0px);
                padding-right: env(safe-area-inset-right, 0px);
                padding-bottom: env(safe-area-inset-bottom, 0px);
                padding-left: env(safe-area-inset-left, 0px);
            }

                border-radius: 0;

                height: 100%;
                max-width: none;

            <ol class="top-clips-row" id="topClipsRow"></ol>
        </section>

        <search class="search-section" aria-labelledby="searchLabel">
            <label for="transcriptSearch" id="searchLabel">Search all transcripts</label>
            <div class="search-wrapper">
                <input type="search" id="transcriptSearch" placeholder="Type to search…" autocomplete="off"
                    spellcheck="false" enterkeyhint="search" aria-describedby="searchStatus">
                <button id="searchToggleAll" type="button" aria-expanded="true" aria-controls="searchResults"
                    title="Collapse or expand all result groups" disabled>Toggle All</button>
                <button id="searchClear" type="button" aria-label="Clear search">Clear</button>
            </div>
            <p id="searchStatus" role="status" aria-live="polite"></p>
            <div id="searchResults"></div>
        </search>

        <div class="gallery-toolbar">
            <button id="toggleAllVideos" type="button" aria-pressed="false"
                title="Toggle condensed view for all videos">Show only titles</button>
        </div>

        <div class="video-container" id="videoContainer">
            <!-- Video cards generated from index.json -->
        </div>
    </main>

    <footer id="galleryFooter"></footer>

    <script src="https://cdn.plyr.io/3.8.4/plyr.polyfilled.js"></script>
    <script>
        // Optional: window.GALLERY_CONFIG = 'index.json';
    </script>
    <script>
        /**
         * Shared video gallery app. Content comes from index.json next to index.html.
         * Override config path with: window.GALLERY_CONFIG = 'index.json';
         *
         * Posters: video.poster, then speakerPhotos keyed by video.speaker or a name
         * found in the title / filename, then defaultPoster.
         */
        (function () {
            'use strict';

            let videos = [];
            let defaultPoster = '';
            let dayOrder = [];
            let topClips = [];
            let promoVideoEl = null;

            function prefersReducedMotion() {
                return window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            }

            function motionSafeBehavior() {
                return prefersReducedMotion() ? 'auto' : 'smooth';
            }

            function getFocusableElements(root) {
                if (!root) return [];
                const selector = [
                    'a[href]',
                    'button:not([disabled])',
                    'input:not([disabled])',
                    'select:not([disabled])',
                    'textarea:not([disabled])',
                    'video[controls]',
                    '[tabindex]:not([tabindex="-1"])'
                ].join(', ');
                return Array.from(root.querySelectorAll(selector)).filter((el) => {
                    if (el.hasAttribute('disabled') || el.getAttribute('aria-hidden') === 'true') return false;
                    if (el.closest('[hidden]')) return false;
                    const style = window.getComputedStyle(el);
                    if (style.display === 'none' || style.visibility === 'hidden') return false;
                    const rect = el.getBoundingClientRect();
                    return rect.width > 0 && rect.height > 0;
                });
            }

            function setBackgroundAriaHidden(hidden) {
                Array.from(document.body.children).forEach((el) => {
                    if (el === videoModalOverlay) return;
                    if (el.tagName === 'SCRIPT' || el.tagName === 'STYLE' || el.tagName === 'SVG') return;
                    if (hidden) {
                        el.setAttribute('aria-hidden', 'true');
                        el.setAttribute('data-modal-hidden', 'true');
                    } else if (el.getAttribute('data-modal-hidden') === 'true') {
                        el.removeAttribute('aria-hidden');
                        el.removeAttribute('data-modal-hidden');
                    }
                });
            }

            function hasTransientUserActivation() {
                try {
                    return Boolean(navigator.userActivation && navigator.userActivation.isActive);
                } catch {
                    return false;
                }
            }

            function focusModalPlayControl() {
                if (isCoarsePointer() || !videoModalOverlay) return;
                const playBtn = videoModalOverlay.querySelector('.video-modal-player .plyr__control--overlaid');
                if (playBtn && typeof playBtn.focus === 'function') {
                    playBtn.focus({ preventScroll: true });
                    return;
                }
                if (modalVideoEl && typeof modalVideoEl.focus === 'function') {
                    modalVideoEl.focus({ preventScroll: true });
                }
            }

            function resolveAssetUrl(path) {
                if (!path) return path;
                if (/^(https?:)?\/\//i.test(path) || path.startsWith('/')) return path;
                return new URL(path, window.location.href).href;
            }

            const plyrConfig = {
                seekTime: 10,
                controls: ['play-large', 'rewind', 'play', 'fast-forward', 'progress', 'current-time', 'duration', 'mute', 'volume', 'captions', 'settings', 'fullscreen'],
                settings: ['speed'],
                speed: {
                    selected: 1,
                    options: [0.5, 0.75, 1, 1.25, 1.5, 1.75, 2]
                },
                iconUrl: 'https://cdn.plyr.io/3.8.4/plyr.svg',
                loadSprite: true,
                hideControls: true,
                clickToPlay: true,
                captions: {
                    active: true,
                    update: true,
                    language: 'en'
                },
                storage: {
                    enabled: false
                },
                fullscreen: {
                    enabled: true,
                    iosNative: false
                }
            };

            function isCoarsePointer() {
                return window.matchMedia('(hover: none) and (pointer: coarse)').matches
                    || (('ontouchstart' in window) && navigator.maxTouchPoints > 0);
            }

            function getPlyrConfig() {
                const forceViewportFullscreen = isCoarsePointer();
                return {
                    ...plyrConfig,
                    fullscreen: {
                        enabled: true,
                        fallback: forceViewportFullscreen ? 'force' : true,
                        iosNative: false
                    }
                };
            }

            function prepareVideoElement(videoEl) {
                if (!videoEl) return;
                videoEl.playsInline = true;
                videoEl.setAttribute('playsinline', '');
                videoEl.setAttribute('webkit-playsinline', '');
            }

            function setVideoSource(videoEl, url) {
                if (!videoEl) return;
                const source = videoEl.querySelector('source');
                if (url) {
                    if (source) source.src = url;
                    videoEl.src = url;
                } else {
                    videoEl.removeAttribute('src');
                    if (source) source.removeAttribute('src');
                }
                try { videoEl.load(); } catch {
                    // Ignore load errors while swapping or releasing media.
                }
            }

            function playMedia(videoEl) {
                if (!videoEl) return Promise.resolve();
                const duration = Number(videoEl.duration);
                if (videoEl.ended || (Number.isFinite(duration) && duration > 0 && videoEl.currentTime >= duration - 0.15)) {
                    try { videoEl.currentTime = 0; } catch {
                        // Ignore seek errors on unloaded media.
                    }
                }
                const player = videoEl._plyrPlayer;
                let attempt;
                try {
                    attempt = player && typeof player.play === 'function' ? player.play() : videoEl.play();
                } catch (err) {
                    attempt = Promise.reject(err);
                }
                if (!attempt || typeof attempt.catch !== 'function') return Promise.resolve();
                return attempt.catch(() => {
                    // Do not call videoEl.load() here: after a blocked autoplay (clip hash URLs)
                    // it resets the media element and Plyr's play button stops responding.
                    const retry = videoEl.play();
                    if (retry && typeof retry.catch === 'function') {
                        return retry.catch((error) => {
                            console.warn('Video playback could not be started', error);
                        });
                    }
                    return undefined;
                });
            }

            function attachMobilePlaybackRecovery(videoEl, player) {
                if (!videoEl || videoEl.dataset.playbackRecovery === 'true') return;
                videoEl.dataset.playbackRecovery = 'true';

                const resetIfEnded = () => {
                    if (!videoEl.ended) return;
                    try { videoEl.currentTime = 0; } catch {
                        // Ignore seek errors.
                    }
                    if (player) pinOverlayControls(player, 8000);
                };

                videoEl.addEventListener('ended', resetIfEnded);
                videoEl.addEventListener('pause', () => {
                    if (!isCoarsePointer() || !player) return;
                    pinOverlayControls(player, 6000);
                });
                videoEl.addEventListener('webkitendfullscreen', () => {
                    if (player) pinOverlayControls(player, 8000);
                });
            }

            const OVERLAY_CONTROLS_HOLD_MS = 2500;

            function createOverlaySeekButton(label, title, pathD, onClick) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'plyr__control plyr__control--overlay-seek';
                btn.setAttribute('aria-label', label);
                btn.setAttribute('title', title);
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    onClick();
                });

                const namespace = 'http://www.w3.org/2000/svg';
                const svg = document.createElementNS(namespace, 'svg');
                svg.setAttribute('aria-hidden', 'true');
                svg.setAttribute('focusable', 'false');
                svg.setAttribute('viewBox', '0 0 24 24');

                const path = document.createElementNS(namespace, 'path');
                path.setAttribute('d', pathD);
                path.setAttribute('fill', 'currentColor');
                svg.appendChild(path);
                btn.appendChild(svg);
                return btn;
            }

            function pinOverlayControls(player, holdMs = OVERLAY_CONTROLS_HOLD_MS) {
                const container = player?.elements?.container;
                if (!container) return;

                if (typeof player.toggleControls === 'function') {
                    player.toggleControls(true);
                }

                container.classList.add('plyr--overlay-controls-pinned');
                clearTimeout(container._overlayControlsPinTimer);
                container._overlayControlsPinTimer = setTimeout(() => {
                    container.classList.remove('plyr--overlay-controls-pinned');
                    container._overlayControlsPinTimer = null;
                }, holdMs);
            }

            function enhanceOverlaidPlayToggle(player, iconUrl) {
                if (!player?.elements?.container) return;

                const overlaid = player.elements.container.querySelector('.plyr__control--overlaid');
                if (!overlaid) return;

                const playIcon = overlaid.querySelector('svg');
                if (playIcon && !overlaid.querySelector('.icon--pressed')) {
                    playIcon.classList.add('icon--not-pressed');

                    const namespace = 'http://www.w3.org/2000/svg';
                    const pauseIcon = document.createElementNS(namespace, 'svg');
                    pauseIcon.setAttribute('aria-hidden', 'true');
                    pauseIcon.setAttribute('focusable', 'false');
                    pauseIcon.setAttribute('viewBox', '0 0 24 24');
                    pauseIcon.classList.add('icon--pressed');

                    const pausePath = document.createElementNS(namespace, 'path');
                    pausePath.setAttribute('d', 'M6 4h4v16H6zM14 4h4v16h-4z');
                    pausePath.setAttribute('fill', 'currentColor');
                    pauseIcon.appendChild(pausePath);

                    playIcon.before(pauseIcon);
                }

                if (player.elements.container.querySelector('.plyr__overlay-controls')) return;

                const seekTime = typeof player.config?.seekTime === 'number' ? player.config.seekTime : 10;
                const cluster = document.createElement('div');
                cluster.className = 'plyr__overlay-controls';

                const rewindBtn = createOverlaySeekButton(
                    `Go back ${seekTime} seconds`,
                    `Go back ${seekTime} seconds`,
                    'M11.5 12l8.5 6V6l-8.5 6zm-9 0l8.5 6V6L2.5 12z',
                    () => {
                        if (typeof player.rewind === 'function') player.rewind(seekTime);
                        else player.currentTime = Math.max(0, (player.currentTime || 0) - seekTime);
                        pinOverlayControls(player);
                    }
                );

                const forwardBtn = createOverlaySeekButton(
                    `Go forward ${seekTime} seconds`,
                    `Go forward ${seekTime} seconds`,
                    'M12.5 12l-8.5 6V6l8.5 6zm9 0l-8.5 6V6l8.5 6z',
                    () => {
                        if (typeof player.forward === 'function') player.forward(seekTime);
                        else {
                            const duration = player.duration || 0;
                            player.currentTime = Math.min(duration, (player.currentTime || 0) + seekTime);
                        }
                        pinOverlayControls(player);
                    }
                );

                overlaid.replaceWith(cluster);
                cluster.appendChild(rewindBtn);
                cluster.appendChild(overlaid);
                cluster.appendChild(forwardBtn);

                overlaid.addEventListener('click', (e) => {
                    const media = player.media;
                    if (!media) return;
                    e.preventDefault();
                    e.stopImmediatePropagation();
                    const duration = Number(media.duration);
                    const atEnd = media.ended || (Number.isFinite(duration) && duration > 0 && media.currentTime >= duration - 0.15);
                    if (!media.paused && !atEnd) {
                        media.pause();
                        return;
                    }
                    playMedia(media);
                }, true);
            }

            function attachFilteredPoster(videoEl) {
                const posterUrl = videoEl.poster;
                if (!posterUrl) return;

                const wrapper = videoEl.closest('.plyr__video-wrapper');
                if (!wrapper || wrapper.querySelector('.video-poster-filter-wrap')) return;

                const wrap = document.createElement('div');
                wrap.className = 'video-poster-filter-wrap';
                wrap.setAttribute('aria-hidden', 'true');

                const img = document.createElement('img');
                img.className = 'video-poster-filter';
                img.src = posterUrl;
                img.alt = '';
                img.decoding = 'async';

                wrap.appendChild(img);
                wrapper.appendChild(wrap);
            }

            function initPlyrVideo(videoEl, options = {}) {
                if (!videoEl || !window.Plyr || videoEl.dataset.plyrInitialized === 'true') return null;
                if (!videoEl.isConnected) {
                    if (videoEl.dataset.plyrInitPending !== 'true') {
                        videoEl.dataset.plyrInitPending = 'true';
                        requestAnimationFrame(() => {
                            videoEl.dataset.plyrInitPending = 'false';
                            initPlyrVideo(videoEl, options);
                        });
                    }
                    return null;
                }
                const player = new window.Plyr(videoEl, getPlyrConfig());
                videoEl.dataset.plyrInitialized = 'true';
                videoEl._plyrPlayer = player;
                enhanceOverlaidPlayToggle(player, plyrConfig.iconUrl);
                attachMobilePlaybackRecovery(videoEl, player);
                if (options.filteredPoster !== false) {
                    attachFilteredPoster(videoEl);
                }
                return player;
            }

            function syncPlyrCaptions(videoEl) {
                const player = videoEl && videoEl._plyrPlayer ? videoEl._plyrPlayer : null;
                if (!player || !player.media) return;

                const media = player.media;
                const tracks = Array.from(media.textTracks).filter(track => track.kind === 'subtitles' || track.kind === 'captions');
                if (!tracks.length) return;

                const preferred = tracks.find(track => track.language === 'en') ?? tracks[0];
                if (!preferred) return;

                const apply = () => {
                    try {
                        player.language = preferred.language || 'en';
                        player.toggleCaptions(true);
                    } catch {
                        // Plyr may not be ready yet; ignore.
                    }
                };

                apply();
                if (!preferred.cues?.length) {
                    preferred.addEventListener('load', apply, { once: true });
                }
            }

            let speakerPhotos = {};

            function longestSpeakerPhotoMatch(text) {
                if (!text) return '';
                const haystack = text.toLowerCase();
                let bestSrc = '';
                let bestLen = 0;
                for (const [name, src] of Object.entries(speakerPhotos)) {
                    if (!name) continue;
                    const needle = name.toLowerCase();
                    if (needle.length > bestLen && haystack.includes(needle)) {
                        bestSrc = src;
                        bestLen = needle.length;
                    }
                }
                return bestSrc;
            }

            function filenameToSearchText(path) {
                const stem = (path.split('/').pop() || '').replace(/\.[^.]+$/i, '');
                return stem.replace(/[^\p{L}\p{N}'’]+/gu, ' ').replace(/\s+/g, ' ').trim();
            }

            function getSpeakerPoster(video) {
                if (video.poster) return resolveAssetUrl(video.poster);
                if (video.speaker && speakerPhotos[video.speaker]) return speakerPhotos[video.speaker];

                const fromTitle = longestSpeakerPhotoMatch(video.title || '');
                if (fromTitle) return fromTitle;

                const fromPath = longestSpeakerPhotoMatch(filenameToSearchText(video.path || ''));
                if (fromPath) return fromPath;

                return defaultPoster;
            }

            // ─────────────────────────────────────────────────────────────────────
            //  Utilities
            // ─────────────────────────────────────────────────────────────────────
            function srtTimeToSeconds(hms, ms) {
                const [h, m, s] = hms.split(':').map(Number);
                return h * 3600 + m * 60 + s + Number(ms) / 1000;
            }

            function formatTime(totalSec) {
                const h = Math.floor(totalSec / 3600);
                const m = Math.floor((totalSec % 3600) / 60);
                const s = Math.floor(totalSec % 60);
                return h > 0
                    ? `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`
                    : `${m}:${String(s).padStart(2, '0')}`;
            }

            function escHtml(str) {
                return str
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;');
            }


            const YOUTUBE_ICON = 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyNCIgaGVpZ2h0PSIyNCIgdmlld0JveD0iMCAwIDI0IDI0IiBmaWxsPSJub25lIiBzdHJva2U9ImN1cnJlbnRDb2xvciIgc3Ryb2tlLXdpZHRoPSIyIiBzdHJva2UtbGluZWNhcD0icm91bmQiIHN0cm9rZS1saW5lam9pbj0icm91bmQiPjxwYXRoIGQ9Ik0xMiA4djggbC00LTIuNXYtMy4yTDggMTJ6Ii8+PC9zdmc+';

            function renderPageChrome(page, topClipsConfig) {
                if (!page) return;

                if (page.title) document.title = page.title;

                const header = document.getElementById('galleryHeader');
                if (header) {
                    const heading = page.heading || page.title || '';
                    const href = page.headingHref || './';
                    let html = `<h1><a href="${escHtml(href)}">${escHtml(heading)}</a></h1>`;
                    if (page.statusNotice) {
                        html += `<div class="status-notice" role="status">${escHtml(page.statusNotice)}</div>`;
                    }
                    if (page.subtitle) {
                        html += `<p class="subtitle">${escHtml(page.subtitle)}</p>`;
                    }
                    const nav = page.nav || [];
                    if (nav.length) {
                        const parts = [];
                        nav.forEach((item, i) => {
                            const prev = nav[i - 1];
                            const openInNewTab = item.external === true;
                            const target = openInNewTab ? ' target="_blank" rel="noopener noreferrer"' : '';
                            let label = escHtml(item.label || '');
                            if (item.icon === 'youtube') {
                                label = `<img src="${YOUTUBE_ICON}" alt="" width="24" height="24" style="vertical-align: middle; margin-right: 5px;">${label}`;
                            }
                            const prefix = item.prefix ? `${escHtml(item.prefix)} ` : '';
                            const newTabHint = openInNewTab
                                ? ' <span class="visually-hidden">(opens in a new tab)</span>'
                                : '';
                            let currentAttr = '';
                            try {
                                const itemUrl = new URL(item.href, window.location.href);
                                const normalize = (path) => path.replace(/\/+$/, '') || '/';
                                if (normalize(itemUrl.pathname) === normalize(window.location.pathname)) {
                                    currentAttr = ' aria-current="page"';
                                }
                            } catch {
                                // Ignore invalid href values from config.
                            }
                            const link = `${prefix}<a href="${escHtml(item.href)}"${target}${currentAttr}>${label}${newTabHint}</a>`;
                            if (i === 0) {
                                parts.push(link);
                            } else if (item.prefix) {
                                parts.push(' | ' + link);
                            } else if (prev && prev.icon === 'youtube' && item.icon === 'youtube') {
                                parts.push(' ' + link);
                            } else {
                                parts.push(' | ' + link);
                            }
                        });
                        html += `<nav class="gallery-nav" aria-label="Related pages">${parts.join('')}</nav>`;
                    }
                    header.innerHTML = html;
                }

                const footer = document.getElementById('galleryFooter');
                if (footer && page.footer) {
                    footer.innerHTML = `<p>${escHtml(page.footer)}</p>`;
                }

                const searchLabel = document.getElementById('searchLabel');
                if (searchLabel && page.searchLabel) searchLabel.textContent = page.searchLabel;

                const searchInputEl = document.getElementById('transcriptSearch');
                if (searchInputEl && page.searchPlaceholder) {
                    searchInputEl.placeholder = page.searchPlaceholder;
                }

                const topSection = document.getElementById('topClipsSection');
                const topTitle = document.getElementById('topClipsTitle');
                const topSub = document.getElementById('topClipsSubtitle');
                const enabled = !!(topClipsConfig && topClipsConfig.enabled !== false && (topClipsConfig.clips || []).length);
                if (topSection) {
                    topSection.hidden = !enabled;
                    if (enabled) {
                        if (topTitle && topClipsConfig.title) topTitle.textContent = topClipsConfig.title;
                        if (topSub && topClipsConfig.subtitle) topSub.textContent = topClipsConfig.subtitle;
                        topSection.setAttribute('aria-labelledby', 'topClipsTitle');
                    }
                }
            }

            function renderPromo(promoConfig) {
                const section = document.getElementById('promoSection');
                const playerHost = document.getElementById('promoPlayer');
                const titleEl = document.getElementById('promoTitle');
                if (!section || !playerHost) return;

                const src = promoConfig && promoConfig.src ? String(promoConfig.src).trim() : '';
                if (!src) {
                    section.hidden = true;
                    playerHost.innerHTML = '';
                    promoVideoEl = null;
                    return;
                }

                const title = promoConfig.title ? String(promoConfig.title).trim() : '';
                if (titleEl) {
                    if (title) {
                        titleEl.textContent = title;
                        titleEl.hidden = false;
                    } else {
                        titleEl.textContent = '';
                        titleEl.hidden = true;
                    }
                }
                section.setAttribute('aria-labelledby', 'promoTitle');
                if (titleEl && !title) {
                    titleEl.textContent = 'Promo video';
                }

                playerHost.innerHTML = '';
                const videoEl = document.createElement('video');
                videoEl.controls = true;
                videoEl.preload = 'metadata';
                videoEl.controlsList = 'nodownload';
                videoEl.setAttribute('aria-label', title || 'Promo video');
                videoEl.oncontextmenu = () => false;
                prepareVideoElement(videoEl);
                if (promoConfig.poster) {
                    videoEl.poster = resolveAssetUrl(promoConfig.poster);
                }

                const source = document.createElement('source');
                source.src = resolveAssetUrl(src);
                source.type = 'video/mp4';
                videoEl.appendChild(source);
                playerHost.appendChild(videoEl);

                promoVideoEl = videoEl;
                videoEl.addEventListener('play', () => pauseAllVideos(videoEl));
                initPlyrVideo(videoEl, { filteredPoster: false });
                section.hidden = false;
            }


            function escRe(str) {
                return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            }

            function highlightMatch(text, query) {
                if (!query) return escHtml(text);
                const re = new RegExp(`(${escRe(query)})`, 'gi');
                return escHtml(text).replace(re, '<mark>$1</mark>');
            }

            function getCueContextLines(cues, index) {
                const lines = [];
                if (index > 0) {
                    lines.push({ type: 'before', text: cues[index - 1].text });
                }
                lines.push({ type: 'match', text: cues[index].text });
                if (index < cues.length - 1) {
                    lines.push({ type: 'after', text: cues[index + 1].text });
                }
                return lines;
            }

            function createSearchResultContextHTML(cues, index, query) {
                const lines = getCueContextLines(cues, index);
                return `<span class="search-result-context">${lines.map(line =>
                    `<span class="context-line ${line.type}">${highlightMatch(line.text, query)}</span>`
                ).join('')}</span>`;
            }

            const expandedViewText = 'Show only titles';
            const condensedViewText = 'Expand All Videos';

            function setCondensedButtonState(toggleBtn, allCondensed) {
                if (!toggleBtn) return;
                toggleBtn.dataset.allCondensed = String(allCondensed);
                toggleBtn.title = allCondensed ? 'Expand all videos' : 'Condense all videos';
                toggleBtn.setAttribute('aria-pressed', String(allCondensed));
                toggleBtn.innerHTML = allCondensed ? condensedViewText : expandedViewText;
            }

            function updateCondensedToggleState() {
                const toggleAllBtn = document.querySelector('#toggleAllVideos');
                if (!toggleAllBtn) return;
                const cards = document.querySelectorAll('.video-card');
                const allCondensed = cards.length > 0 && Array.from(cards).every(card => card.classList.contains('condensed'));
                setCondensedButtonState(toggleAllBtn, allCondensed);
            }

            function setCardCondensedState(card, condensed) {
                const title = card.querySelector('.video-title');
                const titleText = title ? title.textContent.trim() : 'video';
                card.classList.toggle('condensed', condensed);
                if (condensed) {
                    card.setAttribute('tabindex', '0');
                    card.setAttribute('role', 'button');
                    card.setAttribute('aria-expanded', 'false');
                    card.removeAttribute('aria-labelledby');
                    card.setAttribute('aria-label', `Expand ${titleText}`);
                } else {
                    card.removeAttribute('tabindex');
                    card.removeAttribute('role');
                    card.removeAttribute('aria-expanded');
                    card.removeAttribute('aria-label');
                    if (title && title.id) {
                        card.setAttribute('aria-labelledby', title.id);
                    }
                }
            }

            function setAllCardsCondensed(condensed) {
                const cards = document.querySelectorAll('.video-card');
                cards.forEach(card => setCardCondensedState(card, condensed));
                updateCondensedToggleState();
            }

            // ─────────────────────────────────────────────────────────────────────
            //  SRT parser → array of { start, end, startLabel, text }
            // ─────────────────────────────────────────────────────────────────────
            function parseSrt(raw) {
                const cues = [];
                const normalized = raw.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
                const blocks = normalized.split(/\n{2,}/);
                const timePat = new RegExp(
                    '(\\d{2}:\\d{2}:\\d{2})[.,](\\d{3})\\s*-->\\s*(\\d{2}:\\d{2}:\\d{2})[.,](\\d{3})'
                );

                for (const block of blocks) {
                    const lines = block.trim().split('\n');
                    if (lines.length < 2) continue;
                    let timeLine = -1;
                    for (let i = 0; i < lines.length; i++) {
                        if (timePat.test(lines[i])) { timeLine = i; break; }
                    }
                    if (timeLine === -1) continue;
                    const m = lines[timeLine].match(timePat);
                    if (!m) continue;
                    const startSec = srtTimeToSeconds(m[1], m[2]);
                    const cueText = lines.slice(timeLine + 1).join(' ').trim();
                    if (!cueText) continue;
                    cues.push({
                        start: startSec,
                        end: srtTimeToSeconds(m[3], m[4]),
                        startLabel: formatTime(startSec),
                        text: cueText
                    });
                }
                return cues;
            }

            function normalizeUrl(url) {
                return url.replace(/^(https?:)\/([^/])/, '$1//$2');
            }

            function parseSrtTimestamp(value) {
                const match = value.trim().match(/^(\d{2}):(\d{2}):(\d{2})[,.](\d{3})$/);
                if (!match) return Number.NaN;
                const hours = Number(match[1]);
                const minutes = Number(match[2]);
                const seconds = Number(match[3]);
                const millis = Number(match[4]);
                return hours * 3600 + minutes * 60 + seconds + millis / 1000;
            }

            function extractUrlsFromText(text) {
                const regex = /https?:\/\/[^\s)<>\]]+/gi;
                const seen = new Set();
                const urls = [];

                for (const match of text.matchAll(regex)) {
                    const raw = match[0].replace(/[.,;:!?)]+$/, '');
                    const normalized = normalizeUrl(raw);
                    if (!seen.has(normalized)) {
                        seen.add(normalized);
                        urls.push(normalized);
                    }
                }

                return urls;
            }

            function parseSrtCuesForUrls(srt) {
                const normalized = srt.replace(/\r\n/g, '\n').replace(/\r/g, '\n').trim();
                const cues = [];

                for (const block of normalized.split(/\n\n+/)) {
                    const lines = block.split('\n');
                    const timeLineIndex = lines.findIndex(line => line.includes('-->'));
                    if (timeLineIndex === -1) continue;

                    const [startStr, endStr] = lines[timeLineIndex].split('-->').map(part => part.trim());
                    const start = parseSrtTimestamp(startStr);
                    const end = parseSrtTimestamp(endStr);
                    if (!Number.isFinite(start) || !Number.isFinite(end)) continue;

                    cues.push({
                        start,
                        end,
                        text: lines.slice(timeLineIndex + 1).join('\n'),
                    });
                }

                return cues;
            }

            function cueOverlapsRange(cue, rangeStart, rangeStop) {
                const rangeEnd = rangeStop ?? Number.POSITIVE_INFINITY;
                return cue.end > rangeStart && cue.start < rangeEnd;
            }

            function extractUrlsFromSrt(srt, rangeStart = 0, rangeStop = null) {
                const cues = parseSrtCuesForUrls(srt);
                const seen = new Set();
                const urls = [];

                for (const cue of cues) {
                    if (!cueOverlapsRange(cue, rangeStart, rangeStop)) continue;
                    for (const url of extractUrlsFromText(cue.text)) {
                        if (!seen.has(url)) {
                            seen.add(url);
                            urls.push(url);
                        }
                    }
                }

                return urls;
            }

            // ─────────────────────────────────────────────────────────────────────
            //  In-memory transcript store  path → { status, cues, rawText }
            //  status: 'loading' | 'ready' | 'error'
            // ─────────────────────────────────────────────────────────────────────
            const transcriptStore = {};
            const transcriptPromises = {};  // path → Promise — kept so in-flight fetches are reusable
            const videoElementMap = {};   // path → <video> element

            function pauseAllVideos(exceptVideo) {
                for (const key in videoElementMap) {
                    const otherVideo = videoElementMap[key];
                    if (otherVideo && otherVideo !== exceptVideo && !otherVideo.paused) {
                        otherVideo.pause();
                    }
                }
                if (promoVideoEl && promoVideoEl !== exceptVideo && !promoVideoEl.paused) {
                    promoVideoEl.pause();
                }
                if (modalVideoEl && modalVideoEl !== exceptVideo && !modalVideoEl.paused) {
                    modalVideoEl.pause();
                }
            }

            function loadTranscript(video) {
                const id = video.path;
                // Return the existing promise so concurrent callers all wait for the same fetch
                if (transcriptPromises[id]) return transcriptPromises[id];
                transcriptStore[id] = { status: 'loading', cues: [], rawText: '' };

                transcriptPromises[id] = fetch(video.subtitle)
                    .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.text(); })
                    .then(raw => {
                        transcriptStore[id].rawText = raw;
                        transcriptStore[id].cues = parseSrt(raw);
                        transcriptStore[id].status = 'ready';
                        return transcriptStore[id];
                    })
                    .catch(() => {
                        transcriptStore[id].status = 'error';
                        return transcriptStore[id];
                    });
                return transcriptPromises[id];
            }

            function attachVttTrack(videoEl, rawSrt) {
                // Avoid adding duplicate tracks
                if (videoEl.querySelector('track[srclang="en"]')) return;
                const vtt = 'WEBVTT\n\n' + rawSrt
                    .replace(/\r\n/g, '\n').replace(/\r/g, '\n')
                    .replace(/(\d{2}:\d{2}:\d{2}),(\d{3})/g, '$1.$2');
                const blob = new Blob([vtt], { type: 'text/vtt' });
                const blobUrl = URL.createObjectURL(blob);
                const track = document.createElement('track');
                track.kind = 'subtitles';
                track.srclang = 'en';
                track.label = 'English';
                track.default = true;
                track.src = blobUrl;
                track.addEventListener('load', () => {
                    URL.revokeObjectURL(blobUrl);
                    syncPlyrCaptions(videoEl);
                }, { once: true });
                track.addEventListener('error', () => URL.revokeObjectURL(blobUrl), { once: true });
                videoEl.appendChild(track);
            }

            function makeCueLine(cue, videoPath, highlightQuery, targetVideoEl) {

                    textSpan.textContent = cue.text;
                }

                btn.appendChild(timeSpan);
                btn.appendChild(textSpan);

                const seek = () => {
                    const videoEl = targetVideoEl || videoElementMap[videoPath];
