<!DOCTYPE html>
<html lang="en">
<!--
  Shared presentations landing page (self-contained shell).
  deploy-confs.sh landing-pages stamps this file into every gallery and fills
  title / description / canonical URL in the social meta tags from that
  gallery's index.json. Do not edit per-gallery index.html by hand.
  Page copy, videos, and posters come from that gallery's index.json.
-->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Videos</title>
    <meta name="description" content="Presentations and talks from the KERI Foundation.">
    <link rel="canonical" href="https://keri.foundation/">
    <!-- Open Graph / social previews (image from custom/img logo on brand background) -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="KERI Foundation">
    <meta property="og:title" content="KERI Foundation Videos">
    <meta property="og:description" content="Presentations and talks from the KERI Foundation.">
    <meta property="og:url" content="https://keri.foundation/">
    <meta property="og:image" content="https://keri.foundation/custom/img/logo-keri-foundation-og.png">
    <meta property="og:image:secure_url" content="https://keri.foundation/custom/img/logo-keri-foundation-og.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="KERI Foundation logo">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="KERI Foundation Videos">
    <meta name="twitter:description" content="Presentations and talks from the KERI Foundation.">
    <meta name="twitter:image" content="https://keri.foundation/custom/img/logo-keri-foundation-og.png">
    <meta name="twitter:image:alt" content="KERI Foundation logo">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,600;0,700;0,800;1,600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.plyr.io/3.8.4/plyr.css">
    <style>
        :root {
            --heading-font: 'Plus Jakarta Sans', 'Segoe UI', sans-serif;
            /* Mild shared tone so posters/images read as one set (dwarshuis-cms, nudged up for headshots) */
            --media-tone: brightness(1.02) contrast(0.92) saturate(0.72) sepia(0.16);
            /* keri.foundation: warm band, white content, header stone, logo bronze */
            --page-bg: #fdefde;
            --panel-bg: #f4f0e8;
            --stone: #e8e6de;
            --speaker: #f6e2b8;
            --waves: url("https://keri.foundation/custom/img/waves-kim-1.png");
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--page-bg);
            color: #060b6f;
            padding: 16px 8px;
            min-height: 100vh;
        }

        a {
            color: #0450a8;
        }

        a:hover {
            color: #060b6f;
        }

        a:focus-visible {
            outline: 2px solid #986c32;
            outline-offset: 2px;
        }

        h1 a {
            color: inherit;
            text-decoration: none;
        }

        h1 a:hover,
        h1 a:focus-visible {
            text-decoration: underline;
        }

        .skip-link {
            position: absolute;
            left: 16px;
            top: 16px;
            z-index: 3000;
            padding: 10px 16px;
            background: #060b6f;
            color: #fff;
            font-weight: 700;
            border-radius: 8px;
            text-decoration: none;
            transform: translateY(-200%);
        }

        .skip-link:focus,
        .skip-link:focus-visible {
            color: #fff;
            transform: none;
            outline: 2px solid #986c32;
            outline-offset: 3px;
        }

        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        /* Transcript index links — labels/hrefs come from page.transcriptLinks in index.json. */
        .seo-transcript-links {
            margin: 0 0 10px;
            padding: 6px 10px;
            font-size: 0.8rem;
            line-height: 1.4;
            color: #2e3a7a;
            opacity: 0.85;
        }

        .seo-transcript-links a {
            color: #0450a8;
            text-decoration: underline;
            text-underline-offset: 2px;
        }

        .seo-transcript-links a:hover {
            color: #060b6f;
        }

        .seo-transcript-links .sep {
            margin: 0 0.35em;
            opacity: 0.55;
        }

        .gallery-nav {
            margin-top: 14px;
            font-size: 0.95rem;
        }

        .gallery-toolbar {
            margin: 0 0 8px;
        }

        .audience-filter {
            margin: 0;
            min-width: 0;
            background: var(--panel-bg);
            border-radius: 8px;
            padding: 20px 24px;
            border: 1px solid rgba(6, 11, 111, 0.12);
            text-align: center;
        }

        .audience-filter[hidden] {
            display: none !important;
        }

        .audience-filter h2 {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .audience-filter-hint {
            color: #2e3a7a;
            font-size: 0.95rem;
            max-width: 40rem;
            margin: 0 auto 14px;
            line-height: 1.45;
        }

        .audience-filter-options {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
        }

        .audience-filter-options button {
            font: inherit;
            font-weight: 700;
            font-size: 0.95rem;
            color: #060b6f;
            background: var(--page-bg);
            border: 1px solid rgba(6, 11, 111, 0.18);
            border-radius: 999px;
            padding: 8px 16px;
            cursor: pointer;
        }

        .audience-filter-options button:hover {
            background: #f8e4c8;
        }

        .audience-filter-options button[aria-pressed="true"] {
            background: #060b6f;
            color: #fff;
            border-color: #060b6f;
        }

        .audience-filter-options button:focus-visible {
            outline: 2px solid #986c32;
            outline-offset: 2px;
        }

        .audience-filter-status {
            margin-top: 12px;
            font-size: 0.9rem;
            color: #2e3a7a;
            min-height: 1.2em;
        }

        .video-audiences {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: -2px 0 10px;
            padding: 0;
            list-style: none;
        }

        .video-audiences li {
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.01em;
            color: #060b6f;
            background: rgba(6, 11, 111, 0.08);
            border-radius: 999px;
            padding: 3px 8px;
        }

        .video-card.audience-hidden,
        .day-section.audience-empty {
            display: none;
        }

        header {
            position: relative;
            z-index: 0;
            overflow: hidden;
            text-align: center;
            padding: 30px 0;
            margin-bottom: 20px;
            background: var(--panel-bg);
            border-radius: 8px;
            border: 1px solid rgba(6, 11, 111, 0.12);
        }

        header > * {
            position: relative;
            z-index: 1;
        }

        /* Same corner wave as the keri.foundation header. */
        header::after {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            width: 360px;
            height: 208px;
            background-image: var(--waves);
            background-repeat: no-repeat;
            background-position: left top;
            background-size: 360px 208px;
            transform: rotate(180deg);
            pointer-events: none;
            z-index: 0;
            opacity: 0.55;
        }

        h1,
        h1 a,
        h2,
        h3,
        .video-title,
        .video-modal-title {
            font-family: var(--heading-font);
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.12;
            margin-bottom: 10px;
        }

        .status-notice {
            display: inline-block;
            margin: 0 auto 18px;
            padding: 10px 16px;
            background: var(--page-bg);
            color: #060b6f;
            border-radius: 4px;
            border: 1px solid rgba(6, 11, 111, 0.14);
            border-left: 3px solid #986c32;
            font-size: 0.9rem;
            font-weight: 500;
            max-width: 760px;
            text-align: left;
            line-height: 1.45;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #2e3a7a;
            max-width: 800px;
            margin: 0 auto;
        }

        /* ── Search bar ── */
        .search-section {
            display: block;
            min-width: 0;
            background: var(--panel-bg);
            border-radius: 8px;
            padding: 20px 24px;
            border: 1px solid rgba(6, 11, 111, 0.12);
        }

        .search-bar {
            min-width: 0;
        }

        .search-bar label {
            display: block;
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 10px;
            letter-spacing: 0.04em;
            color: #060b6f;
        }

        .search-output {
            min-width: 0;
        }

        .search-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        #transcriptSearch {
            flex: 1 1 12rem;
            min-width: 0;
            background: var(--page-bg);
            border: 1px solid rgba(6, 11, 111, 0.2);
            border-radius: 8px;
            color: #060b6f;
            font-size: 1rem;
            padding: 10px 14px;
            transition: border-color 0.2s;
        }

        #transcriptSearch::placeholder {
            color: rgba(6, 11, 111, 0.72);
        }

        #transcriptSearch:focus-visible {
            border-color: #986c32;
            outline: 2px solid #986c32;
            outline-offset: 2px;
        }

        #searchToggleAll,
        #searchClear,
        #toggleAllVideos {
            background: var(--page-bg);
            border: 1px solid rgba(6, 11, 111, 0.2);
            border-radius: 8px;
            color: #060b6f;
            font-size: 0.95rem;
            padding: 10px 16px;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }

        #searchToggleAll:hover,
        #searchClear:hover,
        #toggleAllVideos:hover {
            background: #f8e4c8;
            border-color: rgba(6, 11, 111, 0.3);
        }

        #searchToggleAll:focus-visible,
        #searchClear:focus-visible,
        #toggleAllVideos:focus-visible {
            outline: 2px solid #986c32;
            outline-offset: 2px;
        }

        #toggleAllVideos {
            background: var(--panel-bg);
        }

        #searchToggleAll:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        #searchStatus {
            font-size: 0.85rem;
            color: #2e3a7a;
            margin-top: 8px;
        }

        #searchResults {
            margin-top: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .search-result {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
            appearance: none;
            background: var(--panel-bg);
            border: 1px solid rgba(152, 108, 50, 0.28);
            border-radius: 10px;
            padding: 12px 16px;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            min-height: 44px;
            font: inherit;
            color: inherit;
            text-align: left;
        }

        .search-result:hover,
        .search-result:focus-visible {
            background: rgba(6, 11, 111, 0.12);
            border-color: rgba(152, 108, 50, 0.35);
        }

        .search-result:focus-visible {
            outline: 2px solid #986c32;
            outline-offset: 2px;
        }

        .search-result-title {
            font-size: 0.8rem;
            font-weight: 700;
            color: #060b6f;
            margin-bottom: 4px;
            letter-spacing: 0.03em;
        }

        .search-result-time,
        .search-result-lang {
            font-size: 0.75rem;
            background: rgba(6, 11, 111, 0.08);
            color: #2e3a7a;
            border-radius: 20px;
            padding: 2px 8px;
            white-space: nowrap;
            flex: none;
            margin-bottom: 0;
        }

        .search-result-lang {
            color: #036b64;
            font-weight: 700;
            letter-spacing: 0.03em;
        }

        .search-result-text {
            font-size: 0.9rem;
            line-height: 1.45;
            flex: 1 1 0;
            min-width: 0;
        }

        .search-result-context {
            display: inline;
        }

        .context-line {
            display: inline;
            margin: 0;
            padding: 0;
        }

        .context-line.before::after,
        .context-line.match::after {
            content: ' ';
        }

        .context-line.before,
        .context-line.after {
            color: #2e3a7a;
        }

        .context-line.match {
            font-weight: 700;
        }

        .search-result-text mark {
            background: rgba(240, 200, 110, 0.7);
            color: #060b6f;
            border-radius: 2px;
            padding: 0 2px;
        }

        /* ── Search result grouping ── */
        .search-result-group {
            background: var(--panel-bg);
            border: 1px solid rgba(152, 108, 50, 0.22);
            border-radius: 10px;
            overflow: hidden;
        }

        .search-result-group-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            appearance: none;
            background: #f8ead8;
            border: none;
            border-bottom: 1px solid rgba(152, 108, 50, 0.2);
            padding: 10px 16px;
            font: inherit;
            font-size: 0.95rem;
            font-weight: 600;
            color: #060b6f;
            text-align: left;
            cursor: pointer;
            transition: background 0.2s;
        }

        .search-result-group-title:hover {
            background: #f3dcc0;
        }

        .search-result-group-title:focus-visible {
            outline: 2px solid #986c32;
            outline-offset: -2px;
        }

        .search-result-group-title-text {
            display: inline-flex;
            align-items: center;
            width: 100%;
            text-align: left;
        }

        .search-result-group-title:hover .search-result-group-title-text {
            text-decoration: underline;
        }

        .search-result-group-toggle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 1.8em;
            min-height: 1.8em;
            color: inherit;
            margin-left: 1rem;
            transition: transform 0.2s;
            font-size: 1rem;
        }

        .search-result-group-title[aria-expanded="false"] .search-result-group-toggle {
            transform: rotate(-90deg);
        }

        .search-result-group-items {
            display: flex;
            flex-direction: column;
            gap: 0;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .search-result-group-items>li {
            margin: 0;
            padding: 0;
        }

        .search-result-group-items[hidden] {
            display: none !important;
        }

        .search-result-group .search-result {
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(152, 108, 50, 0.16);
            border-radius: 0;
            padding: 10px 16px;
            margin: 0;
            cursor: pointer;
            transition: background 0.15s;
        }

        .search-result-group-items>li:last-child .search-result {
            border-bottom: none;
        }

        .search-result-group .search-result:hover,
        .search-result-group .search-result:focus-visible {
            background: rgba(152, 108, 50, 0.1);
            border-color: transparent;
        }

        /* ── Search bar + target groups 50/50; results full width below ── */
        .browse-tools {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-bottom: 30px;
            align-items: start;
            min-width: 0;
            width: 100%;
            max-width: 100%;
        }

        /* Small screens: target groups first, search bar+results as one block */
        .browse-tools .audience-filter {
            order: 1;
        }

        .browse-tools .search-section {
            order: 2;
        }

        @media (min-width: 900px) {
            /* Large screens: bar and results become separate grid items */
            .search-section {
                display: contents;
                background: none;
                border: none;
                padding: 0;
            }

            .search-bar {
                background: var(--panel-bg);
                border-radius: 8px;
                padding: 20px 24px;
                border: 1px solid rgba(6, 11, 111, 0.12);
            }

            .browse-tools:has(> .audience-filter:not([hidden])) {
                grid-template-columns: 1fr 1fr;
                grid-template-areas:
                    "search-bar audience"
                    "search-output search-output";
            }

            .browse-tools:has(> .audience-filter:not([hidden])) .search-bar {
                grid-area: search-bar;
            }

            .browse-tools:has(> .audience-filter:not([hidden])) .audience-filter {
                grid-area: audience;
            }

            .browse-tools:has(> .audience-filter:not([hidden])) .search-output {
                grid-area: search-output;
            }
        }

        /* ── Promo + top clips: side-by-side when both present ── */
        .featured-media {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-bottom: 30px;
            align-items: stretch;
            min-width: 0;
            width: 100%;
            max-width: 100%;
        }

        /* Collapse the wrapper when neither promo nor clips is shown */
        .featured-media:not(:has(> :not([hidden]))) {
            display: none;
            margin: 0;
        }

        @media (min-width: 900px) {
            .featured-media:has(> .promo-section:not([hidden])):has(> .top-clips-section:not([hidden])) {
                grid-template-columns: 1fr 1fr;
            }
        }

        /* ── Optional promo movie (omit promo from index.json to hide) ── */
        .promo-section {
            margin: 0;
            min-width: 0;
            background: var(--panel-bg);
            border-radius: 8px;
            padding: 20px 24px 24px;
            border: 1px solid rgba(6, 11, 111, 0.12);
        }

        .promo-section[hidden] {
            display: none !important;
        }

        .promo-title {
            font-size: 1.45rem;
            font-weight: 800;
            letter-spacing: -0.01em;
            color: #060b6f;
            margin: 0 0 14px;
            text-align: center;
        }

        .promo-title[hidden] {
            display: none !important;
        }

        .promo-player {
            position: relative;
            width: 100%;
            max-width: 960px;
            margin: 0 auto;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(6, 11, 111, 0.2);
        }

        .featured-media:has(> .promo-section:not([hidden])):has(> .top-clips-section:not([hidden])) .promo-player {
            max-width: none;
        }

        .promo-player .plyr {
            width: 100%;
        }

        .promo-player .plyr__poster {
            display: none !important;
        }

        /* ── Top ten clips ── */
        .top-clips-section {
            margin: 0;
            min-width: 0;
            max-width: 100%;
            background: var(--panel-bg);
            border-radius: 8px;
            padding: 20px 24px 14px;
            border: 1px solid rgba(6, 11, 111, 0.12);
        }

        .top-clips-section[hidden] {
            display: none !important;
        }

        .top-clips-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 4px 18px;
            margin-bottom: 14px;
        }

        .top-clips-header h2 {
            font-size: 1.45rem;
            font-weight: 800;
            letter-spacing: -0.01em;
            color: #060b6f;
        }

        .top-clips-sub {
            font-size: 0.88rem;
            color: #2e3a7a;
            margin: 0;
        }

        .top-clips-scroller {
            position: relative;
            min-width: 0;
            max-width: 100%;
            overflow: hidden;
        }

        .top-clips-scroller.has-more-right::after {
            content: '';
            position: absolute;
            top: 4px;
            right: 0;
            bottom: 12px;
            width: 3.25rem;
            pointer-events: none;
            z-index: 2;
            background: linear-gradient(to left,
                    rgba(255, 255, 255, 0.72) 0%,
                    rgba(255, 255, 255, 0.28) 45%,
                    transparent 100%);
        }

        .top-clips-more {
            position: absolute;
            top: calc(50% - 6px);
            right: 6px;
            z-index: 3;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 2.4rem;
            height: 2.4rem;
            padding: 0;
            border: 2px solid rgba(255, 255, 255, 0.85);
            border-radius: 50%;
            background: #060b6f;
            color: #fff;
            box-shadow: 0 6px 18px rgba(6, 11, 111, 0.4);
            cursor: pointer;
            transform: translateY(-50%);
            transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .top-clips-more[hidden] {
            display: none !important;
        }

        .top-clips-more:hover,
        .top-clips-more:focus-visible {
            background: #986c32;
            box-shadow: 0 8px 22px rgba(6, 11, 111, 0.45);
            transform: translateY(-50%) scale(1.06);
        }

        .top-clips-more:focus-visible {
            outline: 2px solid #986c32;
            outline-offset: 3px;
        }

        .top-clips-more svg {
            display: block;
            margin-left: 2px;
        }

        @media (prefers-reduced-motion: reduce) {
            .top-clips-more {
                transition: none;
            }

            .top-clips-more:hover,
            .top-clips-more:focus-visible {
                transform: translateY(-50%);
            }
        }

        .top-clips-row {
            display: flex;
            flex-wrap: nowrap;
            gap: 14px;
            overflow-x: auto;
            overflow-y: hidden;
            overscroll-behavior-x: contain;
            -webkit-overflow-scrolling: touch;
            scroll-snap-type: x proximity;
            padding: 4px 2px 12px;
            margin: 0;
            max-width: 100%;
            list-style: none;
            scrollbar-width: thin;
            scrollbar-color: rgba(6, 11, 111, 0.35) transparent;
        }

        .top-clips-row::-webkit-scrollbar {
            height: 6px;
        }

        .top-clips-row::-webkit-scrollbar-thumb {
            background: rgba(6, 11, 111, 0.3);
            border-radius: 3px;
        }

        .top-clips-row>li {
            flex: 0 0 15.5rem;
            width: 15.5rem;
            scroll-snap-align: start;
            min-height: 19rem;
        }

        .top-clip-scrim {

        .top-clip-duration {

        /* ── Day sections ── */
        .video-container {
            display: grid;
            gap: 40px;
            padding: 20px 0;
        }

        .day-section {
            display: grid;
            gap: 28px;

        .day-section h2 {
            font-size: 2rem;

        .video-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            justify-content: stretch;
            justify-items: stretch;
            gap: 16px;
            width: 100%;
        }

        @media (min-width: 1600px) {
            .video-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }

        @media (max-width: 640px) {
            .video-grid {
                grid-template-columns: minmax(0, 1fr);
            }

        @supports (grid-template-rows: masonry) {

                grid-template-rows: masonry;
            }

        .video-grid:has(.video-card.condensed) {

        /* ── Video cards ── */

            justify-self: stretch;
            break-inside: avoid;

        .video-card.condensed {
            background: transparent;
            box-shadow: none;
            border: none;

            gap: 15px;
            padding: 0px;
            margin: 0;
            max-width: none;
            cursor: pointer;

        .video-card.condensed:focus-visible {

        .video-card.condensed .video-info {
            padding: 0;

        .video-card.condensed *:not(.video-info):not(.video-title):not(.video-icon):not(.video-icon *) {

        .video-card.condensed .video-title>.video-icon,
        .video-card.condensed .video-title>.video-icon * {
            display: inline-flex;

        /* Keep <audio> mounted while condensed so lock-screen playback can continue. */
        .video-card.condensed .video-audio {
            display: block;
            position: fixed;
            width: 1px;
            height: 1px;
            overflow: hidden;
            opacity: 0;

        /* iOS native fullscreen has no Plyr overlay, so unhide native tracks there. */
        html.ios-native-fullscreen .plyr--full-ui ::-webkit-media-text-track-container,
        html.ios-native-fullscreen video::-webkit-media-text-track-container {
            display: block !important;
        }

        .plyr--video:not(.plyr--playing) .plyr__overlay-controls,
        .plyr--video:not(.plyr--playing) .plyr__control--overlaid {
            display: flex;
            visibility: visible;
            opacity: 0.95;
        }

        .plyr--video.plyr--playing:not(.plyr--hide-controls) .plyr__overlay-controls,
        .plyr--video.plyr--playing:not(.plyr--hide-controls) .plyr__control--overlaid,
        .plyr--video.plyr--playing.plyr--overlay-controls-pinned .plyr__overlay-controls,
        .plyr--video.plyr--playing.plyr--overlay-controls-pinned .plyr__control--overlaid {
            display: flex;
            visibility: visible;
            opacity: 0.95;
        }

        .plyr__overlay-controls {
            position: absolute;
            top: 50%;
            left: 50%;
            z-index: 3;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 0.85rem;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .plyr__overlay-controls .plyr__control,
        .plyr__control--overlaid {
            pointer-events: auto;
        }

        .plyr__overlay-controls .plyr__control--overlaid {
            position: static;
            top: auto;
            left: auto;
            transform: none;
            margin: 0;
        }

        .plyr__control--overlaid {
            padding: 1.35rem;
            z-index: 3;
        }

        .plyr__control--overlay-seek {
            padding: 0.95rem;
            background: rgba(0, 0, 0, 0.55);
            border-radius: 100%;
            color: #fff;
            border: 0;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.15s ease;
        }

        .plyr__control--overlay-seek:hover,
        .plyr__control--overlay-seek:focus-visible {
            background: var(--plyr-color-main, #5f7c2f);
        }

        .plyr__control--overlay-seek:active {
            transform: scale(0.96);
        }

        .plyr__control--overlaid svg,
        .plyr__control--overlay-seek svg {
            width: 1.75rem;
            height: 1.75rem;
            display: block;
        }

        .plyr__control--overlay-seek svg {
            width: 1.35rem;
            height: 1.35rem;
        }

        .plyr__control--overlaid.plyr__control--pressed svg {
            left: 0;
        }

        /* Mild media-tone on posters/images only (while player is stopped) */
        .video-thumbnail {
            position: relative;
            width: 100%;
            background: #accfce;
        }

        .video-thumbnail video {
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 9;
            display: block;
        }

        /* Plyr duplicates the poster; we render our own filtered copy instead */
        .video-thumbnail .plyr__poster,
        .video-modal-player .plyr__poster {
            display: none !important;
        }

        .video-poster-filter-wrap {
            pointer-events: none;
        }

        .video-thumbnail .video-poster-filter-wrap,
        .video-modal-player .video-poster-filter-wrap,
        .promo-player .video-poster-filter-wrap {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            transition: opacity 0.2s ease, visibility 0.2s ease;
        }

        .video-thumbnail .video-poster-filter,
        .video-modal-player .video-poster-filter,
        .promo-player .video-poster-filter {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
            object-position: center;
            filter: var(--media-tone);
            transition: filter 0.2s ease;
        }

        .promo-player .video-poster-filter {
            object-fit: cover;
        }

        .video-card:hover .video-thumbnail .plyr.plyr--stopped .video-poster-filter {
            filter: none;
        }

        .video-thumbnail .plyr:not(.plyr--stopped) .video-poster-filter-wrap,
        .video-modal-player .plyr:not(.plyr--stopped) .video-poster-filter-wrap,
        .promo-player .plyr:not(.plyr--stopped) .video-poster-filter-wrap {
            opacity: 0;
            visibility: hidden;
        }

        .video-info {
            padding: 16px 20px 18px;
        }

        .video-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .video-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            color: #2e3a7a;
            margin-top: 6px;
        }

        .video-duration {
            background: rgba(6, 11, 111, 0.1);
            padding: 3px 8px;
            border-radius: 20px;
            color: #060b6f;
        }

        .copy-button {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 2.25rem;
            height: 2.25rem;
            background: rgba(6, 11, 111, 0.1);
            border: none;
            border-radius: 8px;
            color: #060b6f;
            cursor: pointer;
            transition: background 0.2s, box-shadow 0.2s;
        }

        .copy-button:hover {
            background: rgba(6, 11, 111, 0.2);
        }

        .copy-button:focus-visible {
            outline: 2px solid #986c32;
            outline-offset: 2px;
        }

        .copy-button.is-pending-start {
            background: rgba(152, 108, 50, 0.35);
            box-shadow: inset 0 0 0 2px #986c32;
            animation: copy-pending-blink 1s ease-in-out infinite;
        }

        .copy-pending-hint {
            display: none;
            max-width: 16rem;
            padding: 6px 10px;
            border-radius: 8px;
            background: rgba(152, 108, 50, 0.2);
            border: 1px solid rgba(152, 108, 50, 0.55);
            color: #4a3520;
            font-size: 0.75rem;
            font-weight: 600;
            line-height: 1.35;
            animation: copy-pending-blink 1s ease-in-out infinite;
        }

        .copy-pending-hint.is-visible {
            display: block;
        }

        @keyframes copy-pending-blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.35;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            .copy-button.is-pending-start,
            .copy-pending-hint {
                animation: none;
            }

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }

            .top-clip-card:hover,
            .top-clip-card:focus-visible,
            .top-clip-card:hover .top-clip-photo,
            .plyr__control--overlay-seek:active {
                transform: none;
            }
        }

        .clip-timer {
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 20;
            display: none;
            align-items: baseline;
            gap: 12px;
            padding: 12px 18px;
            border-radius: 12px;
            background: rgba(6, 11, 111, 0.94);
            color: #fff;
            font-size: 1.75rem;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.02em;
            line-height: 1;
            pointer-events: none;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45), 0 0 0 2px rgba(255, 255, 255, 0.18);
        }

        .clip-timer.is-visible {
            display: inline-flex;
        }

        .clip-timer-label {
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            opacity: 0.9;
        }

        .clip-timer-value {
            min-width: 3.6em;
            text-align: right;
            font-size: 2.1rem;
            font-weight: 800;
        }

        /* ── Transcript accordion ── */
        .transcript-toggle {
            display: flex;
            align-items: center;
            gap: 7px;
            width: 100%;
            background: rgba(152, 108, 50, 0.12);
            border: none;
            border-top: 1px solid rgba(6, 11, 111, 0.1);
            color: #4a3520;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            padding: 10px 20px;
            cursor: pointer;
            text-align: left;
            transition: background 0.2s;
            margin-top: auto;
        }

        .transcript-toggle:hover {
            background: rgba(152, 108, 50, 0.2);
            color: #2a1f10;
        }

        .transcript-toggle:focus-visible {
            outline: 2px solid #986c32;
            outline-offset: -2px;
        }

        .transcript-toggle .arrow {
            display: inline-block;
            transition: transform 0.25s;
            font-style: normal;
        }

        .transcript-toggle[aria-expanded="true"] .arrow {
            transform: rotate(90deg);
        }

        .transcript-panel {
            overflow: hidden;
            max-height: 0;
            transition: max-height 0.35s ease;
            background: rgba(6, 11, 111, 0.06);
        }

        .transcript-panel.open {
            max-height: 380px;
        }

        .transcript-body {
            padding: 12px 16px;
            overflow-y: auto;
            max-height: 360px;
            scrollbar-width: thin;
            scrollbar-color: rgba(152, 108, 50, 0.45) transparent;
        }

        .transcript-body::-webkit-scrollbar {
            width: 5px;
        }

        .transcript-body::-webkit-scrollbar-thumb {
            background: rgba(152, 108, 50, 0.45);
            border-radius: 3px;
        }

        .transcript-loading {
            font-size: 0.8rem;
            color: #2e3a7a;
            padding: 6px 0;
        }

        /* ── Cue lines ── */
        .cue-line {
            display: flex;
            gap: 10px;
            width: 100%;
            appearance: none;
            margin-bottom: 6px;
            align-items: flex-start;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            padding: 4px 6px;
            background: transparent;
            font: inherit;
            color: inherit;
            text-align: left;
            transition: background 0.15s;
        }

        .cue-line:hover {
            background: rgba(152, 108, 50, 0.12);
        }

        .cue-line:focus-visible {
            outline: 2px solid #986c32;
            outline-offset: 1px;
        }

        .cue-time {
            flex-shrink: 0;
            font-size: 0.72rem;
            background: rgba(6, 11, 111, 0.08);
            border-radius: 20px;
            padding: 2px 7px;
            margin-top: 2px;
            color: #036b64;
            white-space: nowrap;
        }

        .cue-text {
            font-size: 0.85rem;
            line-height: 1.45;
            color: #1a2347;
        }

        footer {
            position: relative;
            z-index: 0;
            text-align: center;
            padding: 30px 0 120px;
            margin-top: 30px;
            font-size: 0.9rem;
            color: #2e3a7a;
        }

        /* Same bottom-right wave as keri.foundation asides. */
        footer::after {
            content: "";
            position: absolute;
            right: 0;
            bottom: 0;
            width: 280px;
            height: 161px;
            background: var(--waves) right bottom / 280px 161px no-repeat;
            pointer-events: none;
            z-index: -1;
            opacity: 0.85;
        }

        @media (max-width: 768px) {
            header::after {
                width: 220px;
                height: 126px;
                background-size: 220px 126px;
            }

            footer {
                padding-bottom: 88px;
            }

            footer::after {
                width: 180px;
                height: 104px;
                background-size: 180px 104px;
            }

            .video-container {
                gap: 24px;
            }

            h1 {
                font-size: 2.2rem;
            }

            .video-modal-overlay {
                padding: 0;
                padding-top: env(safe-area-inset-top, 0px);
                padding-right: env(safe-area-inset-right, 0px);
                padding-bottom: env(safe-area-inset-bottom, 0px);
                padding-left: env(safe-area-inset-left, 0px);
            }

            .video-modal {
                border-radius: 0;
                border: none;
                width: 100%;
                height: 100%;
                max-width: none;
                max-height: none;
            }

            .video-modal-header {
                align-items: center;
                gap: 8px;
                padding: 8px 10px 8px 12px;
            }

            .video-modal-header-actions {
                max-width: none;
                flex-shrink: 1;
                min-width: 0;
                gap: 6px;
            }

            .copy-pending-hint,
            .copy-pending-hint.is-visible {
                display: none !important;
            }

            .video-modal-title {
                font-size: 0.95rem;
                padding-right: 0;
            }

            .video-modal-workspace {
                display: flex;
                flex-direction: column;
                gap: 8px;
                padding: 8px;
            }

            .video-modal-panel {
                position: relative;
                left: auto;
                top: auto;
                width: auto;
                height: auto;
                max-width: none;
                max-height: none;
                resize: none;
                min-width: 0;
                min-height: 0;
                overflow: hidden;
                z-index: auto;
            }

            .video-modal-panel-handle {
                cursor: default;
                touch-action: auto;
                pointer-events: none;
            }

            .video-modal-panel--video,
            .video-modal-panel--transcript {
                left: auto;
                top: auto;
                width: auto;
                height: auto;
                z-index: auto;
            }

            .video-modal-panel--video {
                flex: 1 1 46%;
                min-height: 160px;
                order: 1;
            }

            .video-modal-panel--transcript {
                flex: 1 1 54%;
                min-height: 140px;
                order: 2;
            }

            .video-modal-panel-handle-hint {
                display: none;
            }

            .video-modal-player {
                --plyr-font-size-small: 0.75rem;
                --plyr-font-size-base: 0.8rem;
                --plyr-font-size-large: 0.9rem;
                --plyr-font-size-xlarge: 0.95rem;
            }

            .video-modal-player .plyr__caption {
                line-height: 1.3;
            }

            .video-modal-player .plyr__captions {
                padding: 4px 8px 8px;
            }

            .plyr__controls [data-plyr="fullscreen"] {
                display: inline-flex;
                flex-shrink: 0;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.8rem;
            }

            .search-section,
            .audience-filter {
                padding: 16px;
            }

            #transcriptSearch {
                flex-basis: 100%;
            }

            #searchToggleAll,
            #searchClear {
                flex: 1 1 auto;
                padding: 10px 12px;
                white-space: nowrap;
            }
        }
    </style>
</head>

<body>
    <a class="skip-link" href="#mainContent">Skip to main content</a>
    <nav class="seo-transcript-links" id="seoTranscriptLinks" aria-label="Transcript indexes" hidden></nav>
    <header id="galleryHeader"></header>

    <main id="mainContent">
        <div class="featured-media" id="featuredMedia">
            <section class="promo-section" id="promoSection" hidden aria-labelledby="promoTitle">
                <h2 class="promo-title" id="promoTitle" hidden>Promo video</h2>
                <div class="promo-player" id="promoPlayer"></div>
            </section>

            <section class="top-clips-section" id="topClipsSection" hidden aria-labelledby="topClipsTitle">
                <div class="top-clips-header">
                    <h2 id="topClipsTitle">Top Clips</h2>
                    <p class="top-clips-sub" id="topClipsSubtitle"></p>
                </div>
                <div class="top-clips-scroller" id="topClipsScroller">
                    <ol class="top-clips-row" id="topClipsRow"></ol>
                    <button type="button" class="top-clips-more" id="topClipsMore" hidden
                        aria-controls="topClipsRow" aria-label="Scroll to more clips" title="More clips">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                            fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"
                            stroke-linejoin="round" aria-hidden="true">
                            <path d="M9 5l7 7-7 7" />
                        </svg>
                    </button>
                </div>
            </section>
        </div>

        <div class="browse-tools" id="browseTools">
            <search class="search-section" aria-labelledby="searchLabel">
                <div class="search-bar">
                    <label for="transcriptSearch" id="searchLabel">Search all transcripts</label>
                    <div class="search-wrapper">
                        <input type="search" id="transcriptSearch" placeholder="Type to search…" autocomplete="off"
                            spellcheck="false" enterkeyhint="search" aria-describedby="searchStatus">
                        <button id="searchToggleAll" type="button" aria-expanded="true" aria-controls="searchResults"
                            title="Collapse or expand all result groups" disabled>Toggle All</button>
                        <button id="searchClear" type="button" aria-label="Clear search">Clear</button>
                    </div>
                </div>
                <div class="search-output">
                    <p id="searchStatus" role="status" aria-live="polite"></p>
                    <div id="searchResults"></div>
                </div>
            </search>

            <section class="audience-filter" id="audienceFilter" hidden>
                <h2 id="audienceFilterLabel">Target group</h2>
                <p class="audience-filter-hint" id="audienceFilterHint">Choose a group to see only the videos meant for
                    them. A video can belong to more than one group.</p>
                <div class="audience-filter-options" id="audienceFilterOptions" role="group" aria-label="Target groups">
                </div>
                <p class="audience-filter-status" id="audienceFilterStatus" role="status" aria-live="polite"></p>
            </section>
        </div>

        <div class="gallery-toolbar">
            <button id="toggleAllVideos" type="button" aria-pressed="false"
                title="Toggle condensed view for all videos">Show only titles</button>
        </div>

        <div class="video-container" id="videoContainer">
            <!-- Video cards generated from index.json -->
        </div>
    </main>

    <footer id="galleryFooter"></footer>

    <script src="https://cdn.plyr.io/3.8.4/plyr.polyfilled.js"></script>
    <script>
        // Optional: window.GALLERY_CONFIG = 'index.json';
    </script>
    <script>
        /**
         * Shared video gallery app. Content comes from index.json next to index.html.
         * Override config path with: window.GALLERY_CONFIG = 'index.json';
         *
         * Posters: video.poster, then speakerPhotos keyed by video.speaker or a name
         * found in the title / filename, then defaultPoster.
         */
        (function () {
            'use strict';

            let videos = [];
            let transcriptsDir = '';
            let defaultPoster = '';
            let dayOrder = [];
            let topClips = [];
            let promoVideoEl = null;
            let audienceCatalog = [];
            let activeAudience = '';

            function prefersReducedMotion() {
                return window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            }

            function motionSafeBehavior() {
                return prefersReducedMotion() ? 'auto' : 'smooth';
            }

            function getFocusableElements(root) {
                if (!root) return [];
                const selector = [
                    'a[href]',
                    'button:not([disabled])',
                    'input:not([disabled])',
                    'select:not([disabled])',
                    'textarea:not([disabled])',
                    'video[controls]',
                    '[tabindex]:not([tabindex="-1"])'
                ].join(', ');
                return Array.from(root.querySelectorAll(selector)).filter((el) => {
                    if (el.hasAttribute('disabled') || el.getAttribute('aria-hidden') === 'true') return false;
                    if (el.closest('[hidden]')) return false;
                    const style = window.getComputedStyle(el);
                    if (style.display === 'none' || style.visibility === 'hidden') return false;
                    const rect = el.getBoundingClientRect();
                    return rect.width > 0 && rect.height > 0;
                });
            }

            function setBackgroundAriaHidden(hidden) {
                Array.from(document.body.children).forEach((el) => {
                    if (el === videoModalOverlay) return;
                    if (el.tagName === 'SCRIPT' || el.tagName === 'STYLE' || el.tagName === 'SVG') return;
                    if (hidden) {
                        el.setAttribute('aria-hidden', 'true');
                        el.setAttribute('data-modal-hidden', 'true');
                    } else if (el.getAttribute('data-modal-hidden') === 'true') {
                        el.removeAttribute('aria-hidden');
                        el.removeAttribute('data-modal-hidden');
                    }
                });
            }

            function hasTransientUserActivation() {
                try {
                    return Boolean(navigator.userActivation && navigator.userActivation.isActive);
                } catch {
                    return false;
                }
            }

            function focusModalPlayControl() {
                if (isCoarsePointer() || !videoModalOverlay) return;
                const playBtn = videoModalOverlay.querySelector('.video-modal-player .plyr__control--overlaid');
                if (playBtn && typeof playBtn.focus === 'function') {
                    playBtn.focus({ preventScroll: true });
                    return;
                }
                if (modalVideoEl && typeof modalVideoEl.focus === 'function') {
                    modalVideoEl.focus({ preventScroll: true });
                }
            }

            function resolveAssetUrl(path) {
                if (!path) return path;
                if (/^(https?:)?\/\//i.test(path) || path.startsWith('/')) return path;
                return new URL(path, window.location.href).href;
            }

            const plyrConfig = {
                seekTime: 10,
                controls: ['play-large', 'rewind', 'play', 'fast-forward', 'progress', 'current-time', 'duration', 'mute', 'volume', 'captions', 'settings', 'fullscreen'],
                settings: ['captions', 'speed'],
                speed: {
                    selected: 1,
                    options: [0.5, 0.75, 1, 1.25, 1.5, 1.75, 2]
                },
                iconUrl: 'https://cdn.plyr.io/3.8.4/plyr.svg',
                loadSprite: true,
                hideControls: true,
                clickToPlay: true,
                captions: {
                    active: true,
                    update: true,
                    language: 'en'
                },
                storage: {
                    enabled: false
                },
                fullscreen: {
                    enabled: true,
                    fallback: true,
                    iosNative: true
                }
            };

            function isCoarsePointer() {
                return window.matchMedia('(hover: none) and (pointer: coarse)').matches
                    || (('ontouchstart' in window) && navigator.maxTouchPoints > 0);
            }

            function getPlyrConfig() {
                return { ...plyrConfig };
            }

            function getPlyrAudioConfig() {
                return {
                    seekTime: plyrConfig.seekTime,
                    controls: ['play', 'progress', 'current-time', 'duration', 'mute', 'settings'],
                    settings: ['speed'],
                    speed: plyrConfig.speed,
                    iconUrl: plyrConfig.iconUrl,
                    loadSprite: true,
                    hideControls: false,
                    clickToPlay: true,
                    invertTime: false,
                    storage: {
                        enabled: false
                    },
                    fullscreen: {
                        enabled: false
                    }
                };
            }

            function audioPathFor(video) {
                if (!video) return '';
                if (video.audio) return video.audio;
                if (!video.path) return '';
                return String(video.path).replace(/\.mp4$/i, '.mp3');
            }

            function prepareVideoElement(videoEl) {
                if (!videoEl) return;
                videoEl.playsInline = true;
                videoEl.setAttribute('playsinline', '');
                videoEl.setAttribute('webkit-playsinline', '');
            }

            function setVideoSource(videoEl, url) {
                if (!videoEl) return;
                const source = videoEl.querySelector('source');
                if (url) {
                    if (source) source.src = url;
                    videoEl.src = url;
                } else {
                    videoEl.removeAttribute('src');
                    if (source) source.removeAttribute('src');
                }
                try { videoEl.load(); } catch {
                    // Ignore load errors while swapping or releasing media.
                }
            }

            function playMedia(videoEl) {
                if (!videoEl) return Promise.resolve();
                const duration = Number(videoEl.duration);
                if (videoEl.ended || (Number.isFinite(duration) && duration > 0 && videoEl.currentTime >= duration - 0.15)) {
                    try { videoEl.currentTime = 0; } catch {
                        // Ignore seek errors on unloaded media.
                    }
                }
                const player = videoEl._plyrPlayer;
                let attempt;
                try {
                    attempt = player && typeof player.play === 'function' ? player.play() : videoEl.play();
                } catch (err) {
                    attempt = Promise.reject(err);
                }
                if (!attempt || typeof attempt.catch !== 'function') return Promise.resolve();
                return attempt.catch(() => {
                    // Do not call videoEl.load() here: after a blocked autoplay (clip hash URLs)
                    // it resets the media element and Plyr's play button stops responding.
                    const retry = videoEl.play();
                    if (retry && typeof retry.catch === 'function') {
                        return retry.catch((error) => {
                            console.warn('Video playback could not be started', error);
                        });
                    }
                    return undefined;
                });

            function isIosDevice() {

            function isCaptionTextTrack(track) {

            function setCaptionTracksMode(videoEl, mode) {
                const tracks = videoEl?.textTracks;
                if (!tracks) return;
                if (mode !== 'showing') {
                    for (let i = 0; i < tracks.length; i++) {
                        if (isCaptionTextTrack(tracks[i]) && tracks[i].mode !== mode) {
                            tracks[i].mode = mode;
                        }
                    }
                    return;
                }
                // Only the active language may be showing; others must be disabled
                // (not merely hidden) or Chromium/Firefox can flash their cues.
                enforceActiveCaptionTrack(videoEl);

            function enforceActiveCaptionTrack(videoEl, preferredLang) {
                const tracks = videoEl?.textTracks;
                if (!tracks) return;
                const player = videoEl._plyrPlayer;
                const want = String(
                    preferredLang
                    || player?.language
                    || videoEl.dataset.preferredCaptionLang
                    || 'en'
                ).toLowerCase();
                let matched = false;
                for (let i = 0; i < tracks.length; i++) {
                    if (!isCaptionTextTrack(tracks[i])) continue;
                    const lang = String(tracks[i].language || '').toLowerCase();
                    if (lang === want) {
                        matched = true;
                        // Keep cues available to Plyr without relying on other languages.
                        if (tracks[i].mode !== 'showing') tracks[i].mode = 'showing';
                    } else if (tracks[i].mode !== 'disabled') {
                        tracks[i].mode = 'disabled';
                    }
                }
                if (!matched) {
                    for (let i = 0; i < tracks.length; i++) {
                        if (!isCaptionTextTrack(tracks[i])) continue;
                        if (tracks[i].mode !== 'showing') tracks[i].mode = 'showing';
                        break;
                    }
                }

                videoEl.addEventListener('webkitbeginfullscreen', () => {
                    enableNativeFullscreenCaptions(videoEl);

                videoEl.addEventListener('webkitendfullscreen', () => {
                    videoEl.textTracks.removeEventListener('change', keepNativeTracksShowing);

            function syncPlyrCaptions(videoEl, preferredLang) {
                const player = videoEl && videoEl._plyrPlayer ? videoEl._plyrPlayer : null;
                if (!player || !player.media) return;

                const media = player.media;
                const tracks = Array.from(media.textTracks).filter(track => track.kind === 'subtitles' || track.kind === 'captions');
                if (!tracks.length) return;

                const want = preferredLang || videoEl.dataset.preferredCaptionLang || 'en';
                const preferred = tracks.find(track => track.language === want)
                    ?? tracks.find(track => track.language === 'en')
                    ?? tracks[0];
                if (!preferred) return;

                const apply = () => {
                    try {
                        player.language = preferred.language || want || 'en';

                        // Disable other languages before enabling captions so English
                        // cues cannot flash between Dutch timestamps (Ubuntu/Chromium).
                        enforceActiveCaptionTrack(videoEl, videoEl.dataset.preferredCaptionLang);
                        player.toggleCaptions(true);
                        enforceActiveCaptionTrack(videoEl, videoEl.dataset.preferredCaptionLang);
                    } catch {
                        // Plyr may not be ready yet; ignore.

                if (!text) return '';

                for (const [name, src] of Object.entries(speakerPhotos)) {
                    if (!name) continue;
                    const needle = name.toLowerCase();
                    if (needle.length > bestLen && haystack.includes(needle)) {

            function srtTimeToSeconds(hms, ms) {
                const [h, m, s] = hms.split(':').map(Number);
                return h * 3600 + m * 60 + s + Number(ms) / 1000;
            }

            // topClips start/end: seconds (730), or clock strings ("12:10", "00:12:10",
            // optional fractional "12:10.5" / "00:12:10,500").
            function parseClipTime(value) {
                if (typeof value === 'number') {
                    return Number.isFinite(value) && value >= 0 ? value : Number.NaN;
                }
                if (typeof value !== 'string') return Number.NaN;
                const trimmed = value.trim();
                if (!trimmed) return Number.NaN;

                if (/^\d+(\.\d+)?$/.test(trimmed)) {
                    const sec = Number(trimmed);
                    return Number.isFinite(sec) && sec >= 0 ? sec : Number.NaN;
                }

                const match = trimmed.match(/^(?:(\d{1,2}):)?(\d{1,2}):(\d{1,2})(?:[,.](\d{1,3}))?$/);
                if (!match) return Number.NaN;
                const hours = match[1] !== undefined ? Number(match[1]) : 0;
                const minutes = Number(match[2]);
                const seconds = Number(match[3]);
                const frac = match[4] !== undefined
                    ? Number(match[4].padEnd(3, '0')) / 1000
                    : 0;
                if (![hours, minutes, seconds, frac].every(Number.isFinite)) return Number.NaN;
                if (minutes > 59 || seconds > 59) return Number.NaN;
                return hours * 3600 + minutes * 60 + seconds + frac;
            }

            function normalizeTopClip(clip) {
                if (!clip || typeof clip !== 'object') return null;
                const start = parseClipTime(clip.start);
                const end = parseClipTime(clip.end);
                if (!Number.isFinite(start) || !Number.isFinite(end) || end <= start) return null;
                return { ...clip, start, end };
            }

                const h = Math.floor(totalSec / 3600);
                const m = Math.floor((totalSec % 3600) / 60);
                const s = Math.floor(totalSec % 60);

                    ? `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`
                    : `${m}:${String(s).padStart(2, '0')}`;

            function getCueContextLines(cues, index) {
