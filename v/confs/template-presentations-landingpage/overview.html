<!DOCTYPE html>
<html lang="en">
<!--
  Shared overview of the media trees (v/, v/confs/, v/sessions/).
  deploy-confs.sh landing-pages stamps this file into each tree root as
  index.html. Page copy and page.transcriptLinks come from that tree's
  overview.json (next to index.php). Site name, icons, share image, wave,
  and colors come from brand.json beside the gallery template. Cards come
  from every gallery index.json in the tree.
  Do not edit v/index.html, v/confs/index.html, or v/sessions/index.html by hand.
  Copy overview.json from this folder and tailor it beside each index.php.
-->

    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,600;0,700;0,800;1,600&display=swap"
        rel="stylesheet">
    <!-- Brand colors and wave. landing-pages fills this from brand.json. -->
    <style id="brand-theme">
        :root {
            --ink: #1a2332;
            --muted: #3e4c63;
            --bg: #f4f5f7;
            --panel: #ffffff;
            --stone: #e7e9ee;
            --speaker: #e8eef6;
            --accent: #3d5a80;
            --link: #0b57d0;
            --on-ink: #ffffff;
            --hover: #e4eaf3;
            --play: #2f6f4e;
            --play-press: #24573d;
            --surface: #eef1f6;
            --surface-2: #e3e8f0;
            --surface-3: #f7f8fa;
            --surface-4: #e7ebf2;
            --surface-5: #f3f5f8;
            --waves: none;
        }
    </style>
    <style>
        :root {
            --heading-font: 'Plus Jakarta Sans', 'Segoe UI', sans-serif;
            --media-tone: brightness(1.02) contrast(0.92) saturate(0.72) sepia(0.16);
            --page-bg: var(--bg);
            --panel-bg: var(--panel);
            --ink-deep: color-mix(in srgb, var(--ink) 54%, black);
            --ink-deeper: color-mix(in srgb, var(--ink) 43%, black);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--page-bg);
            color: var(--ink);
            padding: 16px 8px;
            min-height: 100vh;
        }

        a {
            color: var(--link);
        }

        a:hover {
            color: var(--ink);
        }

        a:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        h1 a {
            color: inherit;
            text-decoration: none;
        }

        h1 a:hover,
        h1 a:focus-visible {
            text-decoration: underline;
        }

        .skip-link {
            position: absolute;
            left: 16px;
            top: 16px;
            z-index: 3000;
            padding: 10px 16px;
            background: var(--ink);
            color: var(--on-ink);
            font-weight: 700;
            border-radius: 8px;
            text-decoration: none;
            transform: translateY(-200%);
        }

        .skip-link:focus,
        .skip-link:focus-visible {
            color: var(--on-ink);
            transform: none;
            outline: 2px solid var(--accent);
            outline-offset: 3px;
        }

        .page {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            position: relative;
            z-index: 0;
            overflow: hidden;
            text-align: center;
            padding: 30px 20px;
            margin-bottom: 20px;
            background: var(--panel-bg);
            border-radius: 8px;
            border: 1px solid color-mix(in srgb, var(--ink) 12%, transparent);
        }

        header > * {
            position: relative;
            z-index: 1;
        }

        header::after {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            width: 360px;
            height: 208px;
            background-image: var(--waves);
            background-repeat: no-repeat;
            background-position: left top;
            background-size: 360px 208px;
            transform: rotate(180deg);
            pointer-events: none;
            z-index: 0;
            opacity: 0.55;
        }

        h1,
        h1 a,
        h2,
        .video-title {
            font-family: var(--heading-font);
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.12;
            margin-bottom: 10px;
        }

        .status-notice {
            display: inline-block;
            margin: 0 auto 18px;
            padding: 10px 16px;
            background: var(--page-bg);
            color: var(--ink);
            border-radius: 4px;
            border: 1px solid color-mix(in srgb, var(--ink) 14%, transparent);
            border-left: 3px solid var(--accent);
            font-size: 0.9rem;
            font-weight: 500;
            max-width: 760px;
            text-align: left;
            line-height: 1.45;
        }

        .subtitle {
            font-size: 1.2rem;
            color: var(--muted);
            max-width: 800px;
            margin: 0 auto;
        }

        .overview-intro {
            max-width: 720px;
            margin: 0 auto 22px;
            padding: 0 12px;
            font-size: 1.05rem;
            line-height: 1.55;
            color: var(--muted);
            text-align: center;
        }

        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        /* Unified /v/ navigation (stamped by landing-pages). */
        .v-site-nav {
            margin: 0 auto 20px;
            max-width: 1100px;
            background: var(--panel-bg);
            border: 1px solid color-mix(in srgb, var(--ink) 10%, transparent);
            border-radius: 4px;
        }

        .v-site-nav-bar {
            background: var(--panel-bg);
            border-bottom: 1px solid color-mix(in srgb, var(--ink) 10%, transparent);
        }

        .v-site-nav-primary {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            gap: 0;
            padding: 0 16px;
        }

        .v-site-nav-primary > a,
        .v-site-nav-trigger {
            font-family: var(--heading-font);
            font-weight: 600;
            font-size: 0.9375rem;
            letter-spacing: 0.02em;
            text-transform: uppercase;
            color: var(--muted);
            text-decoration: none;
            padding: 16px 18px 13px;
            border: 0;
            background: transparent;
            cursor: pointer;
            border-radius: 0;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            transition: color 0.15s ease, border-color 0.15s ease;
        }

        .v-site-nav-primary > a:hover,
        .v-site-nav-trigger:hover {
            color: var(--ink);
        }

        .v-site-nav-trigger[aria-expanded="true"],
        .v-site-nav-trigger.is-active,
        .v-site-nav-primary > a[aria-current="page"] {
            color: var(--ink);
            font-weight: 800;
            border-bottom-color: var(--accent);
        }

        .v-site-nav-trigger::after {
            content: "";
            display: inline-block;
            width: 0.35em;
            height: 0.35em;
            margin-left: 0.4em;
            border-right: 1.5px solid currentColor;
            border-bottom: 1.5px solid currentColor;
            transform: rotate(45deg) translateY(-0.15em);
            opacity: 0.45;
            vertical-align: middle;
        }

        .v-site-nav-trigger[aria-expanded="true"]::after {
            transform: rotate(-135deg) translateY(0.05em);
            opacity: 0.65;
        }

        .v-site-nav-panels {
            background: color-mix(in srgb, var(--page-bg) 65%, var(--panel-bg));
        }

        .v-site-nav-panel {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 0;
            padding: 16px 22px 18px;
            font-size: 1rem;
            line-height: 1.6;
        }

        .v-site-nav-panel[hidden] {
            display: none !important;
        }

        html:not(.js) .v-site-nav-panel[hidden] {
            display: flex !important;
        }

        html:not(.js) .v-site-nav-panel + .v-site-nav-panel {
            border-top: 1px solid color-mix(in srgb, var(--ink) 8%, transparent);
        }

        .v-site-nav-link {
            font-weight: 500;
            font-size: inherit;
            padding: 0;
            border-radius: 0;
            background: none;
            border: 0;
            text-decoration: none;
            color: var(--link);
        }

        .v-site-nav-link:hover {
            text-decoration: underline;
            text-underline-offset: 3px;
            color: var(--ink);
            background: none;
        }

        .v-site-nav-link[aria-current="page"] {
            color: var(--ink);
            font-weight: 800;
            text-decoration: none;
            background: none;
        }

        .v-site-nav-panel .v-site-nav-link + .v-site-nav-link::before {
            content: "|";
            margin: 0 11px;
            color: color-mix(in srgb, var(--ink) 22%, transparent);
            font-weight: 400;
            text-decoration: none;
            display: inline;
        }

        .v-site-nav-index {
            font-weight: 600;
            color: var(--ink);
        }

        .v-site-nav-index:not(:last-child)::after {
            content: "|";
            margin: 0 11px;
            color: color-mix(in srgb, var(--ink) 22%, transparent);
            font-weight: 400;
        }

        .v-site-nav-index + .v-site-nav-link::before,
        .v-site-nav-group-label + .v-site-nav-link::before {
            content: none;
        }

        .v-site-nav-group-label {
            flex-basis: 100%;
            font-size: 0.9375rem;
            font-weight: 600;
            letter-spacing: normal;
            text-transform: none;
            color: var(--muted);
            margin: 10px 0 4px;
            padding-top: 10px;
            border-top: 1px solid color-mix(in srgb, var(--ink) 8%, transparent);
        }

        .v-site-nav-group-label:first-child {
            margin-top: 0;
            padding-top: 0;
            border-top: 0;
        }

        .v-site-nav-group-label a {
            color: var(--ink);
            text-decoration: none;
        }

        .v-site-nav-group-label a:hover {
            text-decoration: underline;
            text-underline-offset: 2px;
        }

        .v-site-nav-crumbs {
            flex-basis: 100%;
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 0;
            font-size: 0.9375rem;
            color: var(--muted);
            margin: 0 0 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid color-mix(in srgb, var(--ink) 8%, transparent);
        }

        .v-site-nav-crumbs .v-site-nav-link {
            color: var(--link);
        }

        .v-site-nav-crumbs .v-site-nav-link + .v-site-nav-link::before,
        .v-site-nav-crumbs .v-site-nav-crumb-sep + .v-site-nav-link::before {
            content: none;
        }

        .v-site-nav-crumb-sep {
            margin: 0 8px;
            color: color-mix(in srgb, var(--ink) 28%, transparent);
            font-weight: 400;
        }

        .v-site-nav-crumb-current {
            font-weight: 800;
            color: var(--ink);
        }

        .v-site-nav-primary > a:focus-visible,
        .v-site-nav-trigger:focus-visible,
        .v-site-nav-link:focus-visible,
        .v-site-nav-mobile-toggle:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .v-site-nav-mobile-toggle {
            display: none;
        }

        @media (max-width: 640px) {
            .v-site-nav {
                margin-left: 0;
                margin-right: 0;
            }

            .v-site-nav-mobile-toggle {
                display: flex;
                align-items: center;
                justify-content: space-between;
                width: 100%;
                min-height: 48px;
                margin: 0;
                padding: 12px 18px;
                font-family: var(--heading-font);
                font-size: 0.9375rem;
                font-weight: 600;
                letter-spacing: 0.02em;
                text-transform: uppercase;
                color: var(--ink);
                background: var(--panel-bg);
                border: 0;
                border-bottom: 1px solid color-mix(in srgb, var(--ink) 10%, transparent);
                cursor: pointer;
            }

            .v-site-nav-mobile-toggle::after {
                content: "";
                width: 0.4em;
                height: 0.4em;
                border-right: 2px solid currentColor;
                border-bottom: 2px solid currentColor;
                transform: rotate(45deg);
                opacity: 0.55;
                transition: transform 0.15s ease;
            }

            .v-site-nav-mobile-toggle[aria-expanded="true"]::after {
                transform: rotate(-135deg);
            }

            html:not(.js) .v-site-nav-mobile-toggle {
                display: none;
            }

            html.js #vSiteNav:not([data-v-nav-init]) #vSiteNavBody {
                display: none;
            }

            html.js .v-site-nav-body[hidden] {
                display: none !important;
            }

            html.js #vSiteNav[data-v-nav-init] #vSiteNavBody:not([hidden]) {
                display: block;
            }

            .v-site-nav-primary {
                flex-direction: column;
                align-items: stretch;
                padding: 0;
            }

            .v-site-nav-primary > a,
            .v-site-nav-trigger {
                flex: none;
                width: 100%;
                min-height: 48px;
                min-width: 0;
                text-align: left;
                padding: 14px 18px;
                font-size: 0.9375rem;
                border-bottom: 1px solid color-mix(in srgb, var(--ink) 6%, transparent);
            }

            .v-site-nav-panel {
                flex-direction: column;
                align-items: stretch;
                gap: 0;
                padding: 10px 14px 12px;
            }

            .v-site-nav-panel .v-site-nav-link {
                display: block;
                padding: 12px 4px;
                border-bottom: 1px solid color-mix(in srgb, var(--ink) 6%, transparent);
            }

            .v-site-nav-panel .v-site-nav-link:last-child {
                border-bottom: 0;
            }

            .v-site-nav-panel .v-site-nav-link + .v-site-nav-link::before,
            .v-site-nav-index:not(:last-child)::after {
                content: none;
            }

            .v-site-nav-crumbs {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }

            .v-site-nav-crumb-sep {
                display: none;
            }
        }

        .video-container {
            padding: 8px 0 20px;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 16px;
            width: 100%;
        }

        .overview-empty {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--muted);
            padding: 28px 16px;
        }

        .overview-card {
            background: var(--panel-bg);
            border-radius: 8px;
            overflow: hidden;
            border: 6px solid var(--stone);
            display: flex;
            flex-direction: column;
            min-width: 0;
            transition: border-color 0.2s ease;
        }

        .overview-card:hover {
            border-color: var(--accent);
        }

        .overview-card-link {
            display: flex;
            flex-direction: column;
            height: 100%;
            color: inherit;
            text-decoration: none;
        }

        .overview-card-link:hover {
            color: inherit;
            text-decoration: none;
        }

        .overview-card-link:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: -4px;
        }

        .overview-poster {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #accfce;
            overflow: hidden;
        }

        .overview-poster img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            filter: var(--media-tone);
        }

        .overview-poster-fallback {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .overview-poster-fallback span {
            font-family: var(--heading-font);
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: var(--ink);
            opacity: 0.72;
        }

        .video-info {
            padding: 16px 20px 18px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
        }

        .video-title {
            font-size: 1.1rem;
            font-weight: 600;
            line-height: 1.4;
        }

        .overview-blurb {
            color: var(--muted);
            font-size: 0.95rem;
            line-height: 1.45;
        }

        .video-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            font-size: 0.9rem;
            color: var(--muted);
            margin-top: auto;
        }

        .overview-org {
            font-weight: 700;
            color: var(--ink);
        }

        .video-meta .sep {
            margin: 0 0.35em;
            opacity: 0.55;
        }

        .video-duration {
            background: color-mix(in srgb, var(--ink) 10%, transparent);
            padding: 3px 8px;
            border-radius: 20px;
            color: var(--ink);
            white-space: nowrap;
        }

        footer {
            position: relative;
            z-index: 0;
            text-align: center;
            padding: 30px 0 120px;
            margin-top: 30px;
            font-size: 0.9rem;
            color: var(--muted);
        }

        footer::after {
            content: "";
            position: absolute;
            right: 0;
            bottom: 0;
            width: 280px;
            height: 161px;
            background: var(--waves) right bottom / 280px 161px no-repeat;
            pointer-events: none;
            z-index: -1;
            opacity: 0.85;
        }

        @media (max-width: 768px) {
            header::after {
                width: 220px;
                height: 126px;
                background-size: 220px 126px;
            }

            footer {
                padding-bottom: 88px;
            }

            footer::after {
                width: 180px;
                height: 104px;
                background-size: 180px 104px;
            }
        }

        @media (max-width: 1100px) {
            .video-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 640px) {
            h1 {
                font-size: 1.8rem;
            }

            .video-grid {
                grid-template-columns: minmax(0, 1fr);
            }
        }
    </style>
</head>

    <!--__V_SITE_NAV__-->
    <div class="page">
        <header id="galleryHeader"><!--__GALLERY_HEADER__--></header>

        <main id="mainContent">
            <!--__OVERVIEW_INTRO__-->
            <div class="video-container">
                <div class="video-grid" id="overviewGrid">
<!--__OVERVIEW_CARDS__-->
                </div>
            </div>
        </main>

        <footer id="galleryFooter"><!--__OVERVIEW_FOOTER__--></footer>
    </div>
    <script>
        (function () {
            const nav = document.getElementById('vSiteNav');
            if (!nav) return;
            nav.dataset.vNavInit = 'true';
            const triggers = nav.querySelectorAll('.v-site-nav-trigger');
            const panels = nav.querySelectorAll('.v-site-nav-panel');
            const mobileToggle = document.getElementById('vNavMobileToggle');
            const mobileBody = document.getElementById('vSiteNavBody');
            const mobileMq = window.matchMedia('(max-width: 640px)');

            function isMobile() {
                return mobileMq.matches;
            }

            function closeAllPanels() {
                triggers.forEach((t) => t.setAttribute('aria-expanded', 'false'));
                panels.forEach((p) => { p.hidden = true; });
            }

            function setMobileMenuOpen(open) {
                if (!mobileToggle || !mobileBody) return;
                if (!isMobile()) {
                    mobileBody.hidden = false;
                    mobileToggle.setAttribute('aria-expanded', 'false');
                    mobileToggle.textContent = 'Menu';
                    return;
                }
                mobileBody.hidden = !open;
                mobileToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
                mobileToggle.textContent = open ? 'Close menu' : 'Menu';
            }

            function closeEverything() {
                closeAllPanels();
                setMobileMenuOpen(false);
            }

            function openPanel(name) {
                const panel = nav.querySelector(`.v-site-nav-panel[data-panel="${name}"]`);
                const trigger = nav.querySelector(`.v-site-nav-trigger[data-panel="${name}"]`);
                if (!panel || !trigger) return;
                if (isMobile()) setMobileMenuOpen(true);
                const wasOpen = trigger.getAttribute('aria-expanded') === 'true';
                closeAllPanels();
                if (!wasOpen) {
                    trigger.setAttribute('aria-expanded', 'true');
                    panel.hidden = false;
                }
            }

            triggers.forEach((trigger) => {
                trigger.addEventListener('click', () => openPanel(trigger.dataset.panel));
            });

            if (mobileToggle) {
                mobileToggle.addEventListener('click', () => {
                    const open = mobileToggle.getAttribute('aria-expanded') !== 'true';
                    if (open) {
                        setMobileMenuOpen(true);
                    } else {
                        closeEverything();
                        mobileToggle.focus();
                    }
                });
            }

            document.addEventListener('click', (event) => {
                if (!nav.contains(event.target)) closeEverything();
            });

            nav.addEventListener('keydown', (event) => {
                if (event.key !== 'Escape') return;
                const openTrigger = nav.querySelector('.v-site-nav-trigger[aria-expanded="true"]');
                if (openTrigger) {
                    event.preventDefault();
                    closeAllPanels();
                    openTrigger.focus();
                    return;
                }
                if (isMobile() && mobileToggle && mobileToggle.getAttribute('aria-expanded') === 'true') {
                    event.preventDefault();
                    closeEverything();
                    mobileToggle.focus();
                }
            });

            mobileMq.addEventListener('change', () => {
                if (!isMobile()) {
                    if (mobileBody) mobileBody.hidden = false;
                    const defaultPanel = nav.dataset.defaultPanel;
                    if (defaultPanel) openPanel(defaultPanel);
                } else {
                    closeAllPanels();
                    setMobileMenuOpen(false);
                }
            });

            if (isMobile()) {
                setMobileMenuOpen(false);
            } else if (mobileBody) {
                mobileBody.hidden = false;
                const defaultPanel = nav.dataset.defaultPanel;
                if (defaultPanel) openPanel(defaultPanel);
            }

        })();
    </script>
</body>

</html>
